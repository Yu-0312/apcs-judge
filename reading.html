<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APCS 程式判讀練習｜程式識讀 × 統測判讀題</title>
<meta name="description" content="APCS『程式識讀』與統測『程式設計實習』判讀題的線上練習：依 APCS 四級難度分庫，讀程式、選答案、即時對解＋解析。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--sidebar-bg:#161b22;--panel-bg:#1c2128;
  --border:#30363d;--text:#e6edf3;--text-muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--purple:#bc8cff;--orange:#ffa657;
  --accent:#58a6ff;--header-h:56px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
a{color:inherit;}
header{height:var(--header-h);display:flex;align-items:center;padding:0 20px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;}
.logo{font-size:17px;font-weight:700;color:var(--accent);}
.sub{font-size:12px;color:var(--text-muted);}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;}
.navlink{color:var(--text-muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:5px;}
.navlink:hover{border-color:var(--text-muted);color:var(--text);}
.score-pill{font-size:12px;color:var(--green);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap;}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--header-h));overflow:hidden;}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-hdr{padding:11px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);}
.progress-wrap{padding:11px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);}
.progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#56d364);width:0%;transition:width .4s ease;}
.progress-text{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:6px;letter-spacing:.3px;}
.sb-scroll{overflow-y:auto;flex:1;padding:10px;}

.bank-name{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rand-item{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 22px;cursor:pointer;border-top:1px solid rgba(48,54,61,.45);font-size:12.5px;color:var(--purple);background:rgba(188,140,255,.06);}
.rand-item:hover{background:rgba(188,140,255,.14);}
.rand-item.active{box-shadow:inset 3px 0 0 var(--purple);font-weight:700;}
.rand-ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
.rand-ctl input{width:54px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:12px;text-align:center;}
.ov-rand{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border:1px dashed var(--purple);color:var(--purple);border-radius:8px;margin-top:10px;cursor:pointer;font-size:12px;font-weight:600;background:rgba(188,140,255,.05);}
.ov-rand:hover{background:rgba(188,140,255,.14);}

/* ===== sidebar 3-level tree: 語言 → 難度 → 題型 ===== */
.lang-sec{margin-bottom:8px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel-bg);}
.lang-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;border-left:3px solid var(--lgcolor);user-select:none;}
.lang-head:hover{background:rgba(255,255,255,.03);}
.lang-chev{font-size:10px;color:var(--text-muted);transition:transform .2s;}
.lang-sec.open>.lang-head .lang-chev{transform:rotate(90deg);}
.lang-name{font-weight:700;font-size:13px;color:var(--lgcolor);}
.lang-count{font-size:11px;color:var(--text-muted);}
.lang-body{display:none;border-top:1px solid var(--border);}
.lang-sec.open>.lang-body{display:block;}
.lvl-sec{border-top:1px solid rgba(48,54,61,.45);}
.lvl-sec:first-child{border-top:none;}
.lvl-head{display:flex;align-items:center;gap:7px;padding:8px 12px 8px 20px;cursor:pointer;user-select:none;border-left:3px solid var(--lvcolor);}
.lvl-head:hover{background:rgba(255,255,255,.03);}
.lvl-chev{font-size:9px;color:var(--text-muted);transition:transform .2s;}
.lvl-sec.open>.lvl-head .lvl-chev{transform:rotate(90deg);}
.lvl-name{font-weight:600;font-size:12.5px;color:var(--lvcolor);}
.lvl-count{font-size:10.5px;color:var(--text-muted);}
.lvl-body{display:none;background:rgba(0,0,0,.12);}
.lvl-sec.open>.lvl-body{display:block;}
.rand-item.l3{padding-left:38px;}
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 38px;cursor:pointer;border-top:1px solid rgba(48,54,61,.3);transition:background .12s;}
.cat-item:hover{background:rgba(255,255,255,.04);}
.cat-item.active{background:rgba(88,166,255,.12);box-shadow:inset 3px 0 0 var(--accent);}
.cat-name{font-size:12px;color:var(--text);}
.cat-item.active .cat-name{color:var(--accent);font-weight:600;}
.cat-stat{margin-left:auto;font-size:10px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
/* overview 語言卡片 */
.ov-lv{display:flex;align-items:center;gap:8px;margin-top:14px;}
.ov-lv-count{font-size:11px;color:var(--text-muted);}
.ov-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.ov-chips .ov-bank-chip{margin-top:0;flex:0 0 auto;}
.badge.lang-badge{color:var(--lvcolor);background:rgba(255,255,255,.05);border-color:var(--lvcolor);font-weight:700;font-size:13px;}

/* ===== main ===== */
.main{display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--panel-bg);flex-shrink:0;}
.panel-title{font-size:15px;font-weight:700;}
.panel-sub{font-size:12px;color:var(--text-muted);}
.panel-hdr .grow{flex:1;}
.main-scroll{overflow-y:auto;flex:1;padding:18px 18px 90px;}
.inner{max-width:880px;margin:0 auto;}
.inner.practice{max-width:1060px;}
.inner.practice .qcard{padding:20px 24px;}
.inner.practice .qprompt{font-size:15.5px;}
.inner.practice pre.code{font-size:13.5px;padding:14px 16px;}
.inner.practice .opt{font-size:14px;padding:13px 15px;}
.inner.practice .explain{font-size:13px;}
.tbtn{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;}
.tbtn:hover{color:var(--text);border-color:var(--text-muted);}

/* ===== overview ===== */
.intro{background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.7;color:#cdd9e5;}
.intro b{color:var(--text);}
.intro .src{font-size:11px;color:var(--text-muted);margin-top:8px;}
.ov-hint{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:13px;color:var(--text);font-weight:600;}
.ov-hint .grow{flex:1;}
.ov-reset{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:400;}
.ov-reset:hover{color:var(--red);border-color:var(--red);}
.ov-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;}
@media(max-width:1300px){.ov-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.ov-grid{grid-template-columns:minmax(0,1fr);}}
.ov-card{background:var(--panel-bg);border:1px solid var(--border);border-top:3px solid var(--lvcolor);border-radius:12px;padding:15px 16px;}
.ov-card h3{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px;}
.ov-card-count{margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:400;}
.ov-card-prog{font-size:11px;color:var(--text-muted);margin-bottom:8px;}
.ov-prog-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:12px;}
.ov-prog-bar i{display:block;height:100%;background:var(--lvcolor);border-radius:3px;}
.ov-bank-chip{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin-top:8px;cursor:pointer;font-size:12.5px;transition:all .12s;}
.ov-bank-chip:hover{border-color:var(--accent);background:rgba(88,166,255,.06);}
.ov-bank-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ov-chip-stat{margin-left:auto;font-size:10.5px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;}
.ov-chip-stat.done{color:var(--green);font-weight:700;}

/* ===== question card ===== */
.qcard{background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.qcard.answered{border-color:rgba(88,166,255,.25);}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text-muted);}
.badge.exam{color:var(--blue);background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);}
.badge.cat{color:var(--blue);background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);}
.badge.topic{color:var(--purple);background:rgba(188,140,255,.1);border-color:rgba(188,140,255,.3);}
.badge.lang{color:var(--orange);background:rgba(255,166,87,.1);border-color:rgba(255,166,87,.3);}
.badge.num{color:var(--text-muted);}
.badge.official{color:var(--green);background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);}
.badge.lv{font-weight:700;}
.badge.lv1{color:var(--green);background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.35);}
.badge.lv2{color:var(--blue);background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.35);}
.badge.lv3{color:var(--orange);background:rgba(255,166,87,.12);border-color:rgba(255,166,87,.35);}
.badge.lv4{color:var(--red);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.35);}
.qmark{margin-left:auto;font-size:16px;}
pre.code{background:#0b0e14;border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;color:#cdd9e5;margin:4px 0 12px;white-space:pre;tab-size:2;}
pre.code .cm{color:#6b7785;font-style:italic;}
pre.code .st{color:#a5d6ff;}
pre.code .kw{color:#ff7b72;}
pre.code .nm{color:#79c0ff;}
pre.code .fn{color:#d2a8ff;}
.qprompt{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:12px;font-weight:500;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;line-height:1.5;transition:all .12s;}
.opt:hover:not(:disabled){border-color:var(--accent);background:rgba(88,166,255,.05);}
.opt:disabled{cursor:default;}
.opt .lab{font-weight:700;color:var(--text-muted);flex-shrink:0;}
.opt.correct{border-color:var(--green);background:rgba(63,185,80,.12);}
.opt.correct .lab{color:var(--green);}
.opt.wrong{border-color:var(--red);background:rgba(248,81,73,.12);}
.opt.wrong .lab{color:var(--red);}
.opt .mk{margin-left:auto;font-weight:700;}
.explain{margin-top:12px;background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.22);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:12.5px;line-height:1.7;color:#cdd9e5;}
.explain b{color:var(--text);}
.explain .lead{color:var(--green);font-weight:700;}
.explain .lead.bad{color:var(--red);}
.empty{text-align:center;color:var(--text-muted);padding:48px 20px;}

/* ===== 單題導覽 ===== */
.q-progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:16px;}
.q-progress-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease;}
.q-nav{display:flex;align-items:center;gap:12px;margin-top:20px;}
.q-nav .grow{flex:1;}
.q-counter{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.nav-btn{background:var(--panel-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s;}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.35;cursor:default;}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.nav-btn.primary:hover{filter:brightness(1.12);color:#fff;}

/* ===== 錯題本徽章／統計 ===== */
.pw-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text-muted);padding:3px 0;}
.pw-row b{color:var(--text);font-weight:700;}
.pw-row b.wrong{color:var(--red);}
.wrong-pill{font-size:11px;color:var(--red);background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);border-radius:999px;padding:1px 7px;font-weight:700;white-space:nowrap;}
.wb-item{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 22px;cursor:pointer;border-top:1px solid rgba(48,54,61,.45);font-size:12.5px;color:var(--red);background:rgba(248,81,73,.06);font-weight:600;}
.wb-item:hover{background:rgba(248,81,73,.14);}
.wb-item.active{box-shadow:inset 3px 0 0 var(--red);}
.bank-wrong{font-size:10.5px;color:var(--red);margin-left:6px;flex-shrink:0;}

/* ===== 錯題本總覽 ===== */
.ov-chip-wrong{margin-left:auto;font-size:10.5px;color:var(--red);font-weight:700;white-space:nowrap;flex-shrink:0;}
.wrong-empty{text-align:center;color:var(--text-muted);padding:56px 20px;font-size:14px;line-height:1.9;}
.wrong-empty .big{font-size:40px;display:block;margin-bottom:10px;}

/* ===== 抽題數 modal ===== */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
#modal-root.show{display:flex;}
.modal{background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:min(92vw,380px);box-shadow:0 18px 50px rgba(0,0,0,.5);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.modal-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;line-height:1.6;}
.modal-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:20px;}
.modal-row input{width:90px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:15px;text-align:center;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
#ver-badge{position:fixed;right:8px;bottom:8px;z-index:50;font:10px/1.4 ui-monospace,monospace;color:var(--text-muted);background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:2px 8px;opacity:.55;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}

#mobile-nav{display:none;}
@media(max-width:860px){
  :root{--mnav-h:56px;}
  html,body{overflow:hidden;height:100%;}
  header{padding:0 12px;gap:8px;}
  .sub{display:none;}
  .hright{gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;}
  .hright::-webkit-scrollbar{display:none;}
  .hright>*{flex-shrink:0;}
  .logo{font-size:15px;white-space:nowrap;}
  .layout{display:flex;flex-direction:column;height:calc(100vh - var(--header-h) - var(--mnav-h));height:calc(100dvh - var(--header-h) - var(--mnav-h));overflow:hidden;}
  .sidebar,.main{display:none;width:100%;height:100%;border-right:none;}
  .layout[data-mview="bank"] .sidebar{display:flex;}
  .layout[data-mview="quiz"] .main{display:flex;}
  .main-scroll{padding:16px 12px 28px;}
  .panel-hdr{padding:10px 12px;}
  #ver-badge{bottom:calc(var(--mnav-h) + 8px + env(safe-area-inset-bottom));}
  #mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--mnav-h);background:var(--sidebar-bg);border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom);}
  #mobile-nav button{flex:1;background:transparent;border:none;color:var(--text-muted);font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-top:2px solid transparent;transition:color .15s;}
  #mobile-nav button.on{color:var(--accent);border-top-color:var(--accent);}
  #mobile-nav button .ic{font-size:17px;}
}
</style>
</head>

<script>
const DATA_VER='20260626a';
const SESS_KEY='apcs_reading_sess_v1';   // 本回合作答（打完即清空）
const WRONG_KEY='apcs_reading_wrong_v1'; // 錯題本（持久）
const UI_KEY='apcs_reading_ui_v3';
const LEVELS=['初級','中級','中高級','高級'];
const LVCLASS={'初級':'lv1','中級':'lv2','中高級':'lv3','高級':'lv4'};
const LV_COLOR={'初級':'var(--green)','中級':'var(--blue)','中高級':'var(--orange)','高級':'var(--red)'};
const LANGS=[{key:'c',name:'C'},{key:'cpp',name:'C++'},{key:'python',name:'Python'},{key:'js',name:'JavaScript'},{key:'',name:'共同'}];
const LANG_COLOR={c:'var(--blue)',cpp:'var(--purple)',python:'var(--green)',js:'var(--yellow)','':'var(--text-muted)'};
const CATS=['基礎','流程','迴圈','陣列字串','函式遞迴','指標記憶體','結構類別','演算法'];
const RAND_MAX=50, DEFAULT_N=20;

let sess=loadSess();        // {id:oi} 本回合作答
let wrong=loadWrong();      // [id,...] 錯題本
let expanded=new Set();     // 展開的節點（lang::x / lv::lang::level）
let view='home';            // 'home' | 'practice' | 'wrong'
let run={wrong:false,lang:null,level:null,cat:null,ids:[],idx:0,count:DEFAULT_N}; // 篩選：語言/難度/題型
let pick=null;              // 抽題數對話框狀態

function loadSess(){try{const o=JSON.parse(localStorage.getItem(SESS_KEY)||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return {};}}
function saveSess(){try{localStorage.setItem(SESS_KEY,JSON.stringify(sess));}catch(e){}}
function loadWrong(){try{const a=JSON.parse(localStorage.getItem(WRONG_KEY)||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string'):[];}catch(e){return [];}}
function saveWrong(){try{localStorage.setItem(WRONG_KEY,JSON.stringify(wrong));}catch(e){}}
function loadUI(){try{const o=JSON.parse(localStorage.getItem(UI_KEY)||'{}');if(o&&typeof o==='object'){if(Array.isArray(o.expanded))expanded=new Set(o.expanded);if(o.view)view=o.view;if(o.run&&typeof o.run==='object')run=Object.assign(run,o.run);}}catch(e){}}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify({expanded:[...expanded],view,run}));}catch(e){}}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 輕量語法上色：逐字掃描，安全 escape。支援 C/C++/Python 註解、字串、關鍵字、數字。
const KW=new Set(['int','float','double','char','unsigned','signed','long','short','void','bool','if','else','while','for','return','switch','case','default','break','continue','enum','struct','class','public','private','static','const','def','print','elif','std','let','var','function','new','delete','typeof','instanceof','async','await','yield','this','super','extends','null','true','false','undefined','import','from','export','lambda']);
function hlCode(code,lang){
  const lineComment=(lang==='python')?'#':'//';
  let out='',i=0,n=code.length;
  function esc(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;}
  while(i<n){
    const c=code[i];
    if(c===lineComment[0]&&(lineComment.length===1||code[i+1]===lineComment[1])){
      let j=i;while(j<n&&code[j]!=='\n')j++;out+='<span class="cm">'+escH(code.slice(i,j))+'</span>';i=j;continue;
    }
    if(c==='/'&&code[i+1]==='*'){let j=i+2;while(j<n&&!(code[j]==='*'&&code[j+1]==='/'))j++;j=Math.min(n,j+2);out+='<span class="cm">'+escH(code.slice(i,j))+'</span>';i=j;continue;}
    if(c==='"'||c==="'"){const q=c;let j=i+1;while(j<n){if(code[j]==='\\'){j+=2;continue;}if(code[j]===q){j++;break;}j++;}out+='<span class="st">'+escH(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/[A-Za-z0-9_]/.test(code[j]))j++;const w=code.slice(i,j);
      if(KW.has(w))out+='<span class="kw">'+w+'</span>';
      else if(code[j]==='(')out+='<span class="fn">'+escH(w)+'</span>';
      else out+=escH(w);
      i=j;continue;}
    if(/[0-9]/.test(c)){let j=i;while(j<n&&/[0-9xXa-fA-F.]/.test(code[j]))j++;out+='<span class="nm">'+code.slice(i,j)+'</span>';i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function langLabel(l){return ({c:'C',cpp:'C++',python:'Python',js:'JavaScript'})[l]||'觀念題';}
function langName(l){return ({c:'C',cpp:'C++',python:'Python',js:'JavaScript'})[l]!==undefined?({c:'C',cpp:'C++',python:'Python',js:'JavaScript'})[l]:'共同';}

// ===== 題庫結構（語言 → 難度 → 題型）=====
const QMAP=new Map();for(const q of READING_QUESTIONS)QMAP.set(q.id,q);
function QById(id){return QMAP.get(id);}   // O(1) 查表（取代 O(n) find）
// 預建計數索引（題庫靜態，啟動算一次）→ 側欄／總覽計數改 O(1)，免去每次 render 數百次全表掃描
const CNT={total:READING_QUESTIONS.length,lang:{},langLevel:{},langLevelCat:{}};
for(const q of READING_QUESTIONS){
  CNT.lang[q.lang]=(CNT.lang[q.lang]||0)+1;
  const lk=q.lang+'|'+q.level;CNT.langLevel[lk]=(CNT.langLevel[lk]||0)+1;
  CNT.langLevelCat[lk+'|'+q.cat]=(CNT.langLevelCat[lk+'|'+q.cat]||0)+1;
}
// 篩選：f={wrong?, lang(null=全部 / ''=共同), level, cat}（poolFor 仍用於實際抽題與錯題計數）
function poolFor(f){
  f=f||{};
  let arr=f.wrong?validWrong().map(QById):READING_QUESTIONS;
  return arr.filter(q=>q&&
    (f.lang==null||q.lang===f.lang)&&
    (f.level==null||q.level===f.level)&&
    (f.cat==null||q.cat===f.cat)
  ).map(q=>q.id);
}
// 非錯題計數走索引（O(1)）；錯題題數少，仍走 poolFor
function countQ(f){
  f=f||{};
  if(f.wrong)return poolFor(f).length;
  if(f.cat!=null)return CNT.langLevelCat[f.lang+'|'+f.level+'|'+f.cat]||0;
  if(f.level!=null)return CNT.langLevel[f.lang+'|'+f.level]||0;
  if(f.lang!=null)return CNT.lang[f.lang]||0;
  return CNT.total;
}
function langLevels(lang){return LEVELS.filter(lv=>countQ({lang,level:lv})>0);}
function catsIn(lang,level){return CATS.filter(c=>countQ({lang,level,cat:c})>0);}

// ===== 錯題本 =====
function validWrong(){return wrong.filter(id=>QById(id));}
function wrongCount(f){return poolFor(Object.assign({wrong:true},f)).length;}
function addWrong(id){if(!wrong.includes(id)){wrong.push(id);saveWrong();}}
// 答錯自動送進統一錯題本（依日期為預設標題，可到錯題本改名）
function recordReadingMistake(q,chosen){
  if(typeof MistakeBook==='undefined'||!q)return;
  try{MistakeBook.add({
    type:'reading', sourceKey:'reading::'+q.id,
    title:MistakeBook.dateTitle(new Date())+'｜判讀 '+(q.num||q.id),
    qid:q.id, lang:q.lang, level:q.level, topic:q.topic,
    questionStem:q.q, code:q.code||'', options:q.options||[],
    answerIndex:q.answer, chosenIndex:chosen, explain:q.explain||''
  });}catch(e){}
}
function removeWrong(id){const i=wrong.indexOf(id);if(i>=0){wrong.splice(i,1);saveWrong();}}

// ===== 抽題 =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function drawRun(f,count){const pool=poolFor(f);shuffle(pool);return pool.slice(0,Math.min(count,pool.length));}
function runFilter(){return {wrong:run.wrong,lang:run.lang,level:run.level,cat:run.cat};}
function runList(){return run.ids.map(id=>QById(id)).filter(Boolean);}

// ===== 側欄（語言 → 難度 → 題型）=====
function renderSidebar(){
  const wt=validWrong().length;
  let html=`<div class="wb-item${view==='wrong'?' active':''}" data-open="wrong">
    <span class="bank-name">📕 錯題本</span><span class="grow"></span><span class="wrong-pill">${wt}</span></div>`;
  for(const lg of LANGS){
    const lang=lg.key;
    const total=countQ({lang});
    if(!total)continue;
    const langKey='lang::'+lang;
    const lopen=expanded.has(langKey);
    let body='';
    for(const lv of langLevels(lang)){
      const lvTotal=countQ({lang,level:lv});
      const lvKey='lv::'+lang+'::'+lv;
      const lvopen=expanded.has(lvKey);
      const lvw=wrongCount({lang,level:lv});
      const randOn=view==='practice'&&!run.wrong&&run.lang===lang&&run.level===lv&&run.cat==null;
      let inner=`<div class="rand-item l3${randOn?' active':''}" data-rlang="${escH(lang)}" data-rlevel="${escH(lv)}">🎲 隨機練習（最多 ${Math.min(RAND_MAX,lvTotal)} 題）</div>`;
      if(lang!==''){
        for(const c of catsIn(lang,lv)){
          const n=countQ({lang,level:lv,cat:c});
          const cw=wrongCount({lang,level:lv,cat:c});
          const active=view==='practice'&&!run.wrong&&run.lang===lang&&run.level===lv&&run.cat===c;
          inner+=`<div class="cat-item${active?' active':''}" data-lang="${escH(lang)}" data-level="${escH(lv)}" data-cat="${escH(c)}">
            <span class="cat-name">${escH(c)}</span><span class="cat-stat">${n}</span>${cw?`<span class="bank-wrong">❌${cw}</span>`:''}</div>`;
        }
      }
      body+=`<div class="lvl-sec${lvopen?' open':''}" data-lvkey="${escH(lvKey)}" style="--lvcolor:${LV_COLOR[lv]}">
        <div class="lvl-head"><span class="lvl-chev">▶</span><span class="lvl-name">${escH(lv)}</span><span class="lvl-count">${lvTotal} 題</span>${lvw?`<span class="bank-wrong">❌${lvw}</span>`:''}</div>
        <div class="lvl-body">${inner}</div></div>`;
    }
    const lw=wrongCount({lang});
    html+=`<div class="lang-sec${lopen?' open':''}" data-langkey="${escH(langKey)}" style="--lgcolor:${LANG_COLOR[lang]}">
      <div class="lang-head"><span class="lang-chev">▶</span><span class="lang-name">${escH(lg.name)}</span><span class="lang-count">${total} 題</span>${lw?`<span class="bank-wrong">❌${lw}</span>`:''}</div>
      <div class="lang-body">${body}</div></div>`;
  }
  document.getElementById('sb-scroll').innerHTML=html;
}

// ===== 總覽（依語言分卡）=====
function overviewHTML(){
  let cards='';
  for(const lg of LANGS){
    const lang=lg.key;
    const total=countQ({lang});
    if(!total)continue;
    const lw=wrongCount({lang});
    let inner='';
    for(const lv of langLevels(lang)){
      const lvTotal=countQ({lang,level:lv});
      inner+=`<div class="ov-lv"><span class="badge lv ${LVCLASS[lv]}">${escH(lv)}</span><span class="ov-lv-count">${lvTotal} 題</span></div>`;
      inner+=`<div class="ov-rand" data-rlang="${escH(lang)}" data-rlevel="${escH(lv)}">🎲 隨機抽題（最多 ${Math.min(RAND_MAX,lvTotal)} 題）</div>`;
      if(lang!==''){
        let chips='';
        for(const c of catsIn(lang,lv)){
          const n=countQ({lang,level:lv,cat:c});
          const cw=wrongCount({lang,level:lv,cat:c});
          chips+=`<div class="ov-bank-chip" data-lang="${escH(lang)}" data-level="${escH(lv)}" data-cat="${escH(c)}">
            <span class="nm">${escH(c)}</span><span class="ov-chip-stat">${n}</span>${cw?`<span class="ov-chip-wrong">❌${cw}</span>`:''}</div>`;
        }
        inner+=`<div class="ov-chips">${chips}</div>`;
      }
    }
    cards+=`<div class="ov-card" style="--lvcolor:${LANG_COLOR[lang]}">
      <h3><span class="badge lang-badge">${escH(lg.name)}</span><span class="ov-card-count">${total} 題</span></h3>
      <div class="ov-card-prog">${lw?`📕 錯題本 ${lw} 題`:'尚無錯題 ✓'}</div>
      ${inner}
    </div>`;
  }
  const wt=validWrong().length;
  return `<div class="main-scroll"><div class="inner">
    <div class="intro">
      <b>程式判讀</b>是「讀懂一段程式並推出結果 / 找出錯誤」的題型，<b>APCS 程式識讀</b>與<b>統測 程式設計實習</b>都大量出現。
      題庫依 <b>語言（C／C++／Python／JavaScript／共同）→ 難度 → 題型</b>分類；展開語言、選難度後再點<b>題型</b>（或 🎲 隨機抽題），<b>選擇題數</b>即可開始練習；每回合作答完成即<b>重置</b>，答錯的題目會自動收進<b style="color:var(--red)">📕 錯題本</b>（答對後自動移除）。
      <div class="src">題目來源：APCS 官網範例題本（apcs.csie.ntnu.edu.tw）／技專校院入學測驗中心歷屆公告試題（tcte.edu.tw）；標註「官方解答」者為公告標準答案，其餘為依程式邏輯推得之正解。僅供練習參考。</div>
    </div>
    <div class="ov-hint">選擇語言・難度・題型開始練習 👇<span class="grow"></span><button class="ov-wrong">📕 錯題本（${wt}）</button><button class="ov-reset">清除全部紀錄</button></div>
    <div class="ov-grid">${cards}</div>
  </div></div>`;
}

// ===== 錯題本（依語言 → 難度 → 題型分類）=====
function wrongHTML(){
  const ids=validWrong();
  const header=`<div class="panel-hdr">
      <button class="tbtn" id="btn-home">‹ 回題庫總覽</button>
      <span class="panel-title">📕 錯題本（依語言分類）</span>
      <span class="grow"></span>
      ${ids.length?'<button class="tbtn ov-clear-wrong">清空錯題本</button>':''}
    </div>`;
  if(!ids.length){
    return header+`<div class="main-scroll"><div class="inner"><div class="wrong-empty"><span class="big">📕</span>錯題本目前是空的。<br>練習時答錯的題目會自動收進這裡，答對後自動移除。</div></div></div>`;
  }
  let cards='';
  for(const lg of LANGS){
    const lang=lg.key;
    const lw=wrongCount({lang});
    if(!lw)continue;
    let inner='';
    for(const lv of LEVELS){
      const lvw=wrongCount({lang,level:lv});
      if(!lvw)continue;
      inner+=`<div class="ov-lv"><span class="badge lv ${LVCLASS[lv]}">${escH(lv)}</span><span class="ov-chip-wrong">❌${lvw}</span></div>`;
      inner+=`<div class="ov-rand" data-wrong="1" data-rlang="${escH(lang)}" data-rlevel="${escH(lv)}">🎲 複習此難度錯題（最多 ${Math.min(RAND_MAX,lvw)} 題）</div>`;
      if(lang!==''){
        let chips='';
        for(const c of CATS){
          const cw=wrongCount({lang,level:lv,cat:c});
          if(!cw)continue;
          chips+=`<div class="ov-bank-chip" data-wrong="1" data-lang="${escH(lang)}" data-level="${escH(lv)}" data-cat="${escH(c)}">
            <span class="nm">${escH(c)}</span><span class="ov-chip-wrong">❌${cw}</span></div>`;
        }
        if(chips)inner+=`<div class="ov-chips">${chips}</div>`;
      }
    }
    cards+=`<div class="ov-card" style="--lvcolor:${LANG_COLOR[lang]}">
      <h3><span class="badge lang-badge">${escH(lg.name)}</span><span class="ov-card-count">❌ ${lw} 題</span></h3>
      ${inner}
    </div>`;
  }
  return header+`<div class="main-scroll"><div class="inner">
    <div class="ov-hint">點語言・難度・題型開始複習錯題 👇<span class="grow"></span><button class="ov-wrong-all">📕 複習全部錯題（最多 ${Math.min(RAND_MAX,ids.length)} 題）</button></div>
    <div class="ov-grid">${cards}</div>
  </div></div>`;
}

// ===== 練習（一頁一題）=====
function practiceHTML(){
  const level=run.level;
  const list=runList();
  const title=run.wrong?'📕 錯題複習':(run.cat?escH(run.cat):'🎲 隨機練習');
  const canRedraw=!run.wrong;
  const head=`<div class="panel-hdr">
      <button class="tbtn" id="btn-home">‹ 題庫總覽</button>
      ${run.lang!=null?`<span class="badge lang">${escH(langName(run.lang))}</span>`:''}
      ${level?`<span class="badge lv ${LVCLASS[level]}">${escH(level)}</span>`:''}
      <span class="panel-title">${title}</span>
      <span class="panel-sub" id="panel-prog"></span>
      <span class="grow"></span>
      ${canRedraw?'<button class="tbtn" id="btn-redraw">🎲 重新抽題</button>':''}
    </div>`;
  if(!list.length){
    const msg=run.wrong?'錯題本沒有可複習的題目了 🎉':'沒有可練習的題目。';
    return head+`<div class="main-scroll"><div class="inner practice"><div class="empty">${msg}</div></div></div>`;
  }
  run.idx=Math.max(0,Math.min(run.idx,list.length-1));
  const q=list[run.idx];
  const answered=sess[q.id]!==undefined;
  const isLast=run.idx>=list.length-1;
  const pct=Math.round((run.idx+1)/list.length*100);
  const body=`
    <div class="q-progress-bar"><i style="width:${pct}%"></i></div>
    ${renderCard(q)}
    <div class="q-nav">
      <button class="nav-btn" id="q-prev" ${run.idx===0?'disabled':''}>‹ 上一題</button>
      <span class="q-counter">第 ${run.idx+1} / ${list.length} 題</span>
      <span class="grow"></span>
      <button class="nav-btn${answered?' primary':''}" id="q-next">${isLast?'完成 ✓':'下一題 ›'}</button>
    </div>`;
  return head+`<div class="main-scroll"><div class="inner practice" id="qlist">${body}</div></div>`;
}

function renderCard(q){
  const chosen=sess[q.id];
  const done=chosen!==undefined;
  const mark=done?(chosen===q.answer?'<span class="qmark" style="color:var(--green)">✓</span>':'<span class="qmark" style="color:var(--red)">✗</span>'):'';
  const codeBlock=q.code?`<pre class="code">${hlCode(q.code,q.lang)}</pre>`:'';
  const opts=q.options.map((op,oi)=>{
    let cls='opt';let mk='';let dis=done?'disabled':'';
    if(done){
      if(oi===q.answer){cls+=' correct';mk='<span class="mk" style="color:var(--green)">正解</span>';}
      else if(oi===chosen){cls+=' wrong';mk='<span class="mk" style="color:var(--red)">你的選擇</span>';}
    }
    return `<button class="${cls}" ${dis} data-oi="${oi}"><span class="lab">(${'ABCD'[oi]})</span><span>${escH(op)}</span>${mk}</button>`;
  }).join('');
  let explain='';
  if(done){
    const ok=chosen===q.answer;
    explain=`<div class="explain"><span class="lead ${ok?'':'bad'}">${ok?'✓ 答對！':'✗ 答錯了（已收進錯題本）'}</span>　正解 (${'ABCD'[q.answer]})。<br>${escH(q.explain)}</div>`;
  }
  return `<div class="qcard${done?' answered':''}" data-qid="${escH(q.id)}">
    <div class="qmeta">
      ${q.level?`<span class="badge lv ${LVCLASS[q.level]}">${escH(q.level)}</span>`:''}
      <span class="badge lang">${langLabel(q.lang)}</span>
      ${q.cat?`<span class="badge cat">${escH(q.cat)}</span>`:''}
      <span class="badge topic">${escH(q.topic)}</span>
      <span class="badge num">${escH(q.num)}</span>
      ${q.official?'<span class="badge official">官方解答</span>':''}
      ${mark}
    </div>
    ${codeBlock}
    <div class="qprompt">${escH(q.q)}</div>
    <div class="opts">${opts}</div>
    ${explain}
  </div>`;
}

// ===== 導覽 =====
function scrollTop(){const sc=document.querySelector('.main-scroll');if(sc)sc.scrollTop=0;}
function isMobileView(){return window.matchMedia('(max-width:860px)').matches;}
function setMobileView(v){
  const layout=document.querySelector('.layout');
  if(!layout)return;
  layout.dataset.mview=v;
  ['bank','quiz'].forEach(k=>{const b=document.getElementById('mnav-'+k);if(b)b.classList.toggle('on',k===v);});
  if(v==='quiz')scrollTop();
}
// 手機版：跳到題目／練習面板（桌機無作用）
function showQuiz(){if(isMobileView())setMobileView('quiz');}
function goTo(i){
  const list=runList();
  if(!list.length||i>=list.length){finishRun();return;}   // 在最後一題按「完成」→ 結束回合並重置
  run.idx=Math.max(0,Math.min(i,list.length-1));
  saveUI();renderMain();scrollTop();
}
function nextQ(){goTo(run.idx+1);}
function prevQ(){goTo(run.idx-1);}

function renderMain(){
  const m=document.getElementById('main');
  if(view==='practice')m.innerHTML=practiceHTML();
  else if(view==='wrong')m.innerHTML=wrongHTML();
  else m.innerHTML=overviewHTML();
  refresh();
}

// ===== 互動 =====
function toggleKey(k){if(expanded.has(k))expanded.delete(k);else expanded.add(k);saveUI();renderSidebar();}
function backHome(){view='home';saveUI();renderSidebar();renderMain();scrollTop();showQuiz();}
function openWrong(){view='wrong';saveUI();renderSidebar();renderMain();scrollTop();showQuiz();}

// 結束回合：清空本回合作答、回總覽（錯題本已持久保存）
function finishRun(){
  sess={};saveSess();
  view='home';run={wrong:false,lang:null,level:null,cat:null,ids:[],idx:0,count:run.count};
  saveUI();renderSidebar();renderMain();scrollTop();
}

// ===== 抽題數對話框 =====
function openPick(f){
  f=f||{};
  const max=Math.min(RAND_MAX,poolFor(f).length);
  if(max<=0)return;
  pick={wrong:!!f.wrong,lang:(f.lang===undefined?null:f.lang),level:f.level||null,cat:f.cat||null,max,n:Math.min(run.count||DEFAULT_N,max)};
  renderModal();
}
function renderModal(){
  const root=document.getElementById('modal-root');
  if(!pick){root.innerHTML='';root.classList.remove('show');return;}
  const label=pick.wrong?'📕 錯題複習':(pick.cat?escH(pick.cat):'🎲 隨機練習');
  const crumb=[pick.lang!=null?escH(langName(pick.lang)):'',pick.level?escH(pick.level):''].filter(Boolean).join('｜');
  root.innerHTML=`<div class="modal">
    <div class="modal-title">選擇題數</div>
    <div class="modal-sub">${crumb?crumb+'｜':''}${label}　共 ${pick.max} 題可抽（最多 ${RAND_MAX}）</div>
    <div class="modal-row">
      <input type="number" id="pick-count" min="1" max="${pick.max}" value="${pick.n}"><span>／ ${pick.max} 題</span>
    </div>
    <div class="modal-btns">
      <button class="tbtn" id="pick-cancel">取消</button>
      <button class="nav-btn primary" id="pick-go">開始練習 ›</button>
    </div>
  </div>`;
  root.classList.add('show');
  const inp=document.getElementById('pick-count');if(inp){inp.focus();inp.select();}
}
function confirmPick(){
  if(!pick)return;
  const inp=document.getElementById('pick-count');
  let n=parseInt(inp&&inp.value,10);if(!n||n<1)n=1;if(n>pick.max)n=pick.max;
  const p=pick;closePick();startRun({wrong:p.wrong,lang:p.lang,level:p.level,cat:p.cat},n);
}
function closePick(){pick=null;renderModal();}

function startRun(f,n){
  run={wrong:!!f.wrong,lang:(f.lang===undefined?null:f.lang),level:f.level||null,cat:f.cat||null,ids:drawRun(f,n),idx:0,count:n};
  sess={};saveSess();
  view='practice';
  if(run.lang!=null){expanded.add('lang::'+run.lang);if(run.level)expanded.add('lv::'+run.lang+'::'+run.level);}
  saveUI();renderSidebar();renderMain();scrollTop();showQuiz();
}
function redraw(){if(!run.wrong)openPick(runFilter());}

function answer(id,oi){
  if(sess[id]!==undefined)return;
  const q=QById(id);if(!q)return;
  sess[id]=oi;saveSess();
  if(oi===q.answer)removeWrong(id);else{addWrong(id);recordReadingMistake(q,oi);}
  const card=document.querySelector('.qcard[data-qid="'+CSS.escape(id)+'"]');
  if(card){const t=document.createElement('div');t.innerHTML=renderCard(q);card.replaceWith(t.firstElementChild);}
  const nb=document.getElementById('q-next');if(nb)nb.classList.add('primary');
  refresh();renderSidebar();
}

function clearWrong(){
  if(!validWrong().length)return;
  if(!confirm('確定清空錯題本？此動作無法復原。'))return;
  wrong=[];saveWrong();renderSidebar();renderMain();
}
function resetAll(){
  if(!confirm('確定清除全部紀錄（含錯題本與本回合作答）？'))return;
  wrong=[];saveWrong();sess={};saveSess();
  view='home';run={wrong:false,lang:null,level:null,cat:null,ids:[],idx:0,count:DEFAULT_N};
  saveUI();renderSidebar();renderMain();scrollTop();
}

// 只更新數字/進度（不重建 DOM、不重置捲動）
function refresh(){
  const wt=validWrong().length;
  document.getElementById('score-pill').textContent=`📕 錯題本 ${wt} 題`;
  const pt=document.getElementById('pw-total');if(pt)pt.textContent=READING_QUESTIONS.length;
  const pw=document.getElementById('pw-wrong');if(pw)pw.textContent=wt;
  const pp=document.getElementById('panel-prog');
  if(pp&&view==='practice'){
    const list=runList();
    const done=list.filter(q=>sess[q.id]!==undefined).length;
    pp.textContent=list.length?`第 ${Math.min(run.idx+1,list.length)} / ${list.length} 題 · 已答 ${done}`:'';
  }
}

// ===== 事件委派 =====
document.getElementById('sb-scroll').addEventListener('click',e=>{
  if(e.target.closest('.wb-item')){openWrong();return;}
  const ri=e.target.closest('.rand-item');if(ri){openPick({lang:ri.dataset.rlang,level:ri.dataset.rlevel,cat:null});return;}
  const ci=e.target.closest('.cat-item');if(ci){openPick({lang:ci.dataset.lang,level:ci.dataset.level,cat:ci.dataset.cat});return;}
  const lvh=e.target.closest('.lvl-head');if(lvh){toggleKey(lvh.parentElement.dataset.lvkey);return;}
  const lgh=e.target.closest('.lang-head');if(lgh){toggleKey(lgh.parentElement.dataset.langkey);return;}
});
document.getElementById('main').addEventListener('click',e=>{
  if(e.target.closest('#btn-home')){backHome();return;}
  if(e.target.closest('#q-prev')){prevQ();return;}
  if(e.target.closest('#q-next')){nextQ();return;}
  if(e.target.closest('#btn-redraw')){redraw();return;}
  if(e.target.closest('.ov-wrong')){openWrong();return;}
  if(e.target.closest('.ov-reset')){resetAll();return;}
  if(e.target.closest('.ov-clear-wrong')){clearWrong();return;}
  if(e.target.closest('.ov-wrong-all')){openPick({wrong:true});return;}
  const ovr=e.target.closest('.ov-rand');
  if(ovr){openPick({wrong:!!ovr.dataset.wrong,lang:ovr.dataset.rlang,level:ovr.dataset.rlevel||null,cat:null});return;}
  const chip=e.target.closest('.ov-bank-chip');
  if(chip){openPick({wrong:!!chip.dataset.wrong,lang:chip.dataset.lang,level:chip.dataset.level,cat:chip.dataset.cat});return;}
  const opt=e.target.closest('.opt');if(opt&&!opt.disabled){const card=opt.closest('.qcard');if(card)answer(card.dataset.qid,Number(opt.dataset.oi));return;}
});
document.getElementById('modal-root').addEventListener('click',e=>{
  if(e.target.closest('#pick-go')){confirmPick();return;}
  if(e.target.closest('#pick-cancel')){closePick();return;}
  if(e.target.classList.contains('show')){closePick();return;}   // 點背景關閉
});
document.getElementById('modal-root').addEventListener('keydown',e=>{
  if(e.target.id==='pick-count'&&e.key==='Enter'){e.preventDefault();confirmPick();}
});
// 鍵盤操作：對話框 Esc 關閉；練習中 ← → 換題、1~4 選答案
document.addEventListener('keydown',e=>{
  if(pick){if(e.key==='Escape')closePick();return;}
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(view!=='practice')return;
  if(e.key==='ArrowRight'){e.preventDefault();nextQ();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();prevQ();return;}
  if(/^[1-4]$/.test(e.key)){
    const list=runList();const q=list[run.idx];
    if(q&&sess[q.id]===undefined)answer(q.id,Number(e.key)-1);
  }
});

// ===== 啟動 =====
(function(){
  document.getElementById('ver-badge').textContent=`${READING_QUESTIONS.length} 題 · v${DATA_VER}`;
  loadUI();
  if(!expanded.size)expanded.add('lang::c');
  // 還原練習回合防呆：題目已不存在或為空 → 回總覽
  if(view==='practice'){
    if(!runList().length)view='home';
    else if(run.lang!=null){expanded.add('lang::'+run.lang);if(run.level)expanded.add('lv::'+run.lang+'::'+run.level);}
  }
  renderSidebar();
  renderMain();
})();
</script>
