<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APCS 多級 多語言評分系統</title>
<meta name="description" content="300 道 APCS 分級題目，Python、C++、C、Java 四語言即時評分，附官方解答與解題思路——全部在瀏覽器內完成。">
<meta property="og:type" content="website">
<meta property="og:title" content="APCS 練習題庫｜四語言即時評分">
<meta property="og:description" content="300 道分級題目、四語言官方解答、即時評分與解題思路——零安裝、零註冊。">
<meta property="og:url" content="https://yu-0312.github.io/apcs-judge/">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="APCS 練習題庫｜四語言即時評分">
<meta name="twitter:description" content="300 道分級題目、即時評分與解題思路——零安裝、零註冊。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--sidebar-bg:#161b22;--panel-bg:#1c2128;
  --border:#30363d;--text:#e6edf3;--text-muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;
  --py:#3fb950;--cpp:#79c0ff;--c:#ffa657;--java:#d2a8ff;
  --lang-color:var(--py);
  --header-h:56px;--tab-h:44px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

/* Header */
header{height:var(--header-h);display:flex;align-items:center;padding:0 20px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;}
.logo{font-size:17px;font-weight:700;color:var(--lang-color);transition:color .2s;}
.sub{font-size:12px;color:var(--text-muted);}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);}
.hbtn{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;}
.hbtn:hover{border-color:var(--text-muted);}
.ldbar{display:inline-block;width:72px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;vertical-align:middle;margin-left:6px;}
.ldbar i{display:block;width:40%;height:100%;background:var(--yellow);border-radius:2px;animation:ldslide 1.2s ease-in-out infinite;}
@keyframes ldslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite;}
.status-dot.ready{background:var(--green);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Language tabs */
.lang-tabs{height:var(--tab-h);display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.lang-tab{display:flex;align-items:center;gap:7px;padding:0 20px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s;}
.lang-tab:hover{color:var(--text);background:rgba(255,255,255,.03);}
.lang-tab.active-py{color:var(--py);border-color:var(--py);background:rgba(63,185,80,.05);}
.lang-tab.active-cpp{color:var(--cpp);border-color:var(--cpp);background:rgba(121,192,255,.05);}
.lang-tab.active-c{color:var(--c);border-color:var(--c);background:rgba(255,166,87,.05);}
.lang-tab.active-java{color:var(--java);border-color:var(--java);background:rgba(210,168,255,.05);}
.lang-note{margin-left:auto;padding:0 16px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;}

/* Layout */
.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - var(--header-h) - var(--tab-h));overflow:hidden;}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.problem-list{overflow-y:auto;flex:1;padding:8px 0;}
.list-tools{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.list-tools input[type=search]{width:100%;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:6px 8px;outline:none;}
.list-tools input[type=search]:focus{border-color:var(--lang-color,#58a6ff);}
.filter-row{display:flex;align-items:center;gap:8px;}
.filter-row select{flex:1;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;padding:5px 6px;outline:none;}
.filter-chk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
.filter-chk input{accent-color:var(--green);}
.list-empty{padding:20px 14px;font-size:12px;color:var(--text-muted);text-align:center;}
.problem-group{padding-bottom:8px;border-bottom:1px solid rgba(48,54,61,.45);}
.level-header{position:relative;margin:0 8px 6px;padding:13px 12px 14px 16px;border-radius:7px;background:linear-gradient(135deg,var(--level-bg),rgba(22,27,34,.94));border:1px solid var(--level-border);border-left:4px solid var(--level-color);box-shadow:0 8px 18px rgba(0,0,0,.12);}
.level-title-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:750;color:var(--text);}
.level-title-row .count{margin-left:auto;font-size:10px;color:var(--level-color);background:rgba(255,255,255,.06);border:1px solid var(--level-border);border-radius:999px;padding:1px 7px;font-weight:700;}
.level-desc{margin-top:6px;font-size:11px;color:var(--text-muted);line-height:1.45;}
.problem-item{display:block;padding:9px 14px 10px 18px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,.38);transition:background .12s,border-color .12s;font-size:12px;border-left:3px solid transparent;}
.problem-item:hover{background:rgba(255,255,255,.03);}
.problem-item.active{background:rgba(255,255,255,.07);border-left-color:var(--level-color);}
.problem-item .pmeta{font-size:10px;color:var(--text-muted);font-weight:700;letter-spacing:.3px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.problem-row{display:flex;align-items:center;gap:8px;}
.problem-item .ptitle{flex:1;font-weight:650;font-size:13px;color:var(--text);line-height:1.35;min-width:0;}
.problem-item .pmarks{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.pstatus.pass{color:var(--green);font-size:10px;font-weight:700;}
.pstatus.fail{color:var(--red);font-size:10px;font-weight:700;}
.pstatus.partial{color:var(--yellow);font-size:10px;font-weight:700;}

/* Main panels */
.main{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}
.problem-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel-bg);font-size:12px;color:var(--text-muted);}
.problem-content{overflow-y:auto;flex:1;padding:18px;}
.problem-title-h{font-size:21px;font-weight:700;margin-bottom:4px;}
.problem-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;background:rgba(255,255,255,.06);color:var(--text-muted);border:1px solid var(--border);}
.badge.lang{background:rgba(255,255,255,.08);color:var(--lang-color);border-color:var(--lang-color);transition:all .2s;}
.badge.topic{color:#bc8cff;background:rgba(188,140,255,.1);border-color:rgba(188,140,255,.3);}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin:14px 0 6px;}
.desc-text{font-size:13px;line-height:1.7;color:#cdd9e5;}
.desc-text p{margin-bottom:8px;}
.desc-text code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:12px;}
.sample-block{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.sample-block-hdr{padding:7px 12px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);}
.sample-inner{display:grid;grid-template-columns:1fr 1fr;}
.sample-col{padding:10px 12px;}
.sample-col+.sample-col{border-left:1px solid var(--border);}
.sample-col-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:5px;letter-spacing:.5px;}
.sample-col pre{font-family:monospace;font-size:11px;color:#cdd9e5;white-space:pre-wrap;line-height:1.5;}

/* Editor panel */
.editor-panel{display:flex;flex-direction:column;overflow:hidden;}
.editor-toolbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--panel-bg);flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn-run{background:var(--lang-color);color:#000;transition:background .2s;}
.btn-run:hover{filter:brightness(1.15);}
.btn-run:disabled{opacity:.5;cursor:not-allowed;}
.btn-sec{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-sec:hover{color:var(--text);border-color:var(--text-muted);}
.btn-sample{background:transparent;color:var(--lang-color);border:1px solid var(--lang-color);opacity:.7;font-size:11px;padding:4px 9px;transition:all .2s;}
.btn-sample:hover{opacity:1;}
.editor-wrap{flex:1;overflow:hidden;}
.CodeMirror{height:100%!important;font-size:13px!important;font-family:'SFMono-Regular',Consolas,monospace!important;line-height:1.6!important;}
.results-panel{border-top:1px solid var(--border);flex-shrink:0;max-height:250px;overflow-y:auto;background:var(--bg);}
.results-hdr{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1;}
.test-case{display:grid;grid-template-columns:110px 1fr 1fr;border-bottom:1px solid rgba(48,54,61,.5);}
.test-col{padding:7px 10px;font-size:11px;}
.test-label{display:flex;align-items:center;gap:5px;font-weight:600;}
.icon{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.icon-pass{background:rgba(63,185,80,.2);color:var(--green);}
.icon-fail{background:rgba(248,81,73,.2);color:var(--red);}
.test-col pre{font-family:monospace;font-size:10px;white-space:pre-wrap;line-height:1.5;color:var(--text-muted);max-height:70px;overflow:auto;}
.pre-right{color:var(--green);}
.pre-wrong{color:var(--red);}
.score-summary{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:12px;background:var(--panel-bg);border-top:1px solid var(--border);}
.score-num{font-size:20px;font-weight:700;}
.score-num.full{color:var(--green);}
.score-num.partial{color:var(--yellow);}
.score-num.zero{color:var(--red);}
.no-results{padding:20px;text-align:center;color:var(--text-muted);font-size:12px;}
.progress-bar{height:2px;background:var(--border);}
.progress-fill{height:100%;background:var(--lang-color);transition:background .2s;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}
</style>
</head>
<body>
<header>
  <div><div class="logo" id="logo">APCS 多語言評分系統</div><div class="sub"><span id="problem-total">0</span> 題 · 初/中/中高/高級 · Python / C++ / C / Java</div></div>
  <div class="hright">
    <a href="tutorial.html" style="color:var(--text-muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:5px;">📚 基礎教學</a>
    <button id="prog-exp-btn" class="hbtn" onclick="exportProgress()" title="匯出刷題進度（下載 JSON）">💾</button>
    <button id="prog-imp-btn" class="hbtn" onclick="importProgress()" title="匯入刷題進度">📂</button>
    <input type="file" id="prog-file" accept=".json,application/json" style="display:none">
    <span><span class="status-dot" id="status-dot"></span><span id="status-text">載入中...</span><span class="ldbar" id="py-ldbar" style="display:none"><i></i></span></span>
  </div>
</header>

<div class="lang-tabs">
  <div class="lang-tab" id="tab-py"   onclick="switchLang('py')"  >🐍 Python</div>
  <div class="lang-tab" id="tab-cpp"  onclick="switchLang('cpp')" >⚡ C++</div>
  <div class="lang-tab" id="tab-c"    onclick="switchLang('c')"   >🔧 C</div>
  <div class="lang-tab" id="tab-java" onclick="switchLang('java')">☕ Java</div>
  <div class="lang-note" id="lang-note"></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>題目列表（<span id="problem-list-total">0</span> 題）</span>
      <span id="solved-count" style="color:var(--green);font-size:11px;">0 / 0</span>
    </div>
    <div class="list-tools">
      <input type="search" id="prob-search" placeholder="🔍 搜尋題名 / 主題 / 編號" oninput="onFilterChange()">
      <div class="filter-row">
        <select id="filter-diff" onchange="onFilterChange()">
          <option value="">全部難度</option>
          <option value="easy">⭐ 初級</option>
          <option value="medium">⭐⭐ 中級</option>
          <option value="midhigh">⭐⭐⭐ 中高級</option>
          <option value="hard">⭐⭐⭐⭐ 高級</option>
        </select>
        <label class="filter-chk"><input type="checkbox" id="filter-unsolved" onchange="onFilterChange()">只看未 AC</label>
      </div>
    </div>
    <div class="problem-list" id="problem-list"></div>
  </aside>
  <div class="main">
    <div class="problem-panel">
      <div class="panel-hdr"><span>題目說明</span><span id="prob-badge"></span></div>
      <div class="problem-content" id="problem-content">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:10px;">
          <div style="font-size:44px">👈</div><div>選擇語言，再從左側點選題目</div>
        </div>
      </div>
    </div>
    <div class="editor-panel">
      <div class="editor-toolbar">
        <button class="btn btn-run" id="run-btn" onclick="runCode()" disabled>▶ 執行並評分</button>
        <button class="btn btn-sec" onclick="clearEditor()">清空</button>
        <button class="btn btn-sample" onclick="loadSample()">載入解答</button>
        <button class="btn btn-sec" onclick="showHint()" title="顯示解題思路">💡 思路</button>
        <span style="flex:1"></span>
        <span id="lang-label" style="font-size:11px;color:var(--text-muted);">-</span>
      </div>
      <div class="editor-wrap"><textarea id="code-editor"></textarea></div>
      <div class="results-panel">
        <div class="results-hdr"><span>📊 評測結果</span><span id="results-summary" style="margin-left:auto;"></span></div>
        <div id="results-body"><div class="no-results">選擇題目後撰寫程式，點擊「執行並評分」</div></div>
      </div>
    </div>
  </div>
</div>

<!-- 題目與解答資料（拆檔以利快取與協作） -->
<script src="data/judge-problems.js"></script>
<script src="data/judge-solutions.js"></script>
<script>
// ── Problem data (language-independent) ──────────────────────────────────────
// PROBLEMS 已抽出至 data/judge-problems.js

// ── Solutions per language ────────────────────────────────────────────────────
// SOLUTIONS 已抽出至 data/judge-solutions.js

// ── Language config ───────────────────────────────────────────────────────────
const LANGS = {
  py:   { name:'Python', icon:'🐍', color:'#3fb950', mode:'python',        note:'Pyodide 瀏覽器執行',          label:'Python' },
  cpp:  { name:'C++',    icon:'⚡', color:'#79c0ff', mode:'text/x-c++src', note:'線上 g++ (Judge0)',           label:'C++' },
  c:    { name:'C',      icon:'🔧', color:'#ffa657', mode:'text/x-csrc',   note:'線上 gcc (Judge0)',           label:'C' },
  java: { name:'Java',   icon:'☕', color:'#d2a8ff', mode:'text/x-java',   note:'Judge0 CE（需網路，約3秒）',  label:'Java' }
};

// ── State ─────────────────────────────────────────────────────────────────────
let currentLang = null;
let currentProblem = null;
let editor = null;
let pyodide = null;
let pyodideLoading = false;
const SCORES_KEY = 'apcs_judge_scores_v1';
let scores = loadScores(); // { 'py_b964': {passed,total}, 'cpp_b964': ... }

function loadScores() {
  try {
    const raw = localStorage.getItem(SCORES_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object') ? obj : {};
  } catch(e) { return {}; }
}

function saveScores() {
  try { localStorage.setItem(SCORES_KEY, JSON.stringify(scores)); } catch(e) {}
}

// ── 進度匯出 / 匯入（換裝置、清快取時可帶走刷題進度） ─────────────────────
function exportProgress() {
  const data = { app:'apcs-judge', v:1, exportedAt:new Date().toISOString(), scores };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'judge-progress.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importProgress() { document.getElementById('prog-file').click(); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('prog-file').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== 'apcs-judge' || !data.scores || typeof data.scores !== 'object') throw new Error('bad format');
      // 合併：保留通過題數較高的紀錄
      for (const [k, v] of Object.entries(data.scores)) {
        if (!v || typeof v.passed !== 'number' || typeof v.total !== 'number') continue;
        const cur = scores[k];
        if (!cur || v.passed > cur.passed) scores[k] = { passed: v.passed, total: v.total };
      }
      saveScores();
      renderProblemList();
      const solved = Object.values(scores).filter(s => s.passed === s.total).length;
      alert(`已匯入！目前共 ${solved} 筆 AC 紀錄`);
    } catch (err) {
      alert('檔案格式不符，無法匯入（請選擇本站匯出的 judge-progress.json）');
    }
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    mode: 'python', theme: 'dracula', lineNumbers: true,
    indentUnit: 4, tabSize: 4, indentWithTabs: false,
    extraKeys: { 'Tab': cm => cm.execCommand('indentMore'), 'Ctrl-Enter': runCode, 'Cmd-Enter': runCode },
    styleActiveLine: true
  });
  updateProblemTotals();
  switchLang('py');
});

// ── Language switching ────────────────────────────────────────────────────────
function switchLang(lang) {
  currentLang = lang;
  const cfg = LANGS[lang];

  // Update CSS variable for accent color
  document.documentElement.style.setProperty('--lang-color', cfg.color);

  // Update tabs
  Object.keys(LANGS).forEach(k => {
    document.getElementById('tab-'+k).className = 'lang-tab' + (k===lang ? ' active-'+k : '');
  });

  // Update header logo color, label, note
  document.getElementById('logo').textContent = `APCS 多級 ${cfg.name} 評分系統`;
  document.getElementById('lang-label').textContent = cfg.label;
  document.getElementById('lang-note').textContent = cfg.note;

  // Update editor mode
  editor.setOption('mode', cfg.mode);

  // Update run button color (via CSS var, already done above)
  // Update status
  updateStatus(lang);

  // Re-render problem list with new scores
  renderProblemList();

  // If a problem is open, reload its state
  if (currentProblem) {
    renderProblemContent();
    const key = lang + '_' + currentProblem.id;
    document.getElementById('results-body').innerHTML = '<div class="no-results">已切換語言，重新撰寫或載入解答後點擊執行</div>';
    document.getElementById('results-summary').textContent = '';
  }

  // Trigger Pyodide load when Python selected
  if (lang === 'py' && !pyodide && !pyodideLoading) {
    loadPyodide();
  }
}

function updateStatus(lang) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const ldbar = document.getElementById('py-ldbar');
  if (ldbar) ldbar.style.display = 'none';
  if (lang === 'py') {
    if (pyodide) { dot.className = 'status-dot ready'; txt.textContent = 'Python 就緒'; }
    else { dot.className = 'status-dot'; txt.textContent = '下載 Python 環境中（首次約 10–20 秒）...'; if (ldbar) ldbar.style.display = 'inline-block'; }
  } else if (lang === 'java') {
    dot.className = 'status-dot ready';
    txt.textContent = 'Java 就緒（需網路）';
  } else {
    dot.className = 'status-dot ready';
    txt.textContent = LANGS[lang].name + ' 就緒';
  }
  // Enable/disable run button
  const canRun = lang !== 'py' || !!pyodide;
  document.getElementById('run-btn').disabled = !canRun || !currentProblem;
}

// ── Pyodide ───────────────────────────────────────────────────────────────────
async function loadPyodide() {
  pyodideLoading = true;
  updateStatus('py');
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    document.head.appendChild(script);
    await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
    pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    pyodideLoading = false;
    if (currentLang === 'py') {
      updateStatus('py');
      if (currentProblem) document.getElementById('run-btn').disabled = false;
    }
  } catch(e) {
    pyodideLoading = false;
    document.getElementById('status-dot').className = 'status-dot'; // keep yellow
    document.getElementById('status-text').textContent = 'Python 載入失敗，請重新整理';
    const ldbar = document.getElementById('py-ldbar');
    if (ldbar) ldbar.style.display = 'none';
  }
}

// ── Problem list ──────────────────────────────────────────────────────────────
const DIFFICULTY = {
  easy:    { stars:'⭐',       label:'初級',   color:'#3fb950', bg:'rgba(63,185,80,.15)',   border:'rgba(63,185,80,.3)' },
  medium:  { stars:'⭐⭐',     label:'中級',   color:'#d29922', bg:'rgba(210,153,34,.15)',  border:'rgba(210,153,34,.3)' },
  midhigh: { stars:'⭐⭐⭐',   label:'中高級', color:'#bc8cff', bg:'rgba(188,140,255,.14)', border:'rgba(188,140,255,.32)' },
  hard:    { stars:'⭐⭐⭐⭐', label:'高級',   color:'#f85149', bg:'rgba(248,81,73,.15)',   border:'rgba(248,81,73,.3)' }
};

const LEVEL_SECTIONS = [
  { diff:'easy',    icon:'📗', desc:'語法 → 基礎實作 → 直接模擬' },
  { diff:'medium',  icon:'📙', desc:'序列資料 → 排序/前綴 → 狀態整理' },
  { diff:'midhigh', icon:'📘', desc:'資料結構 → 圖/樹 → 狀態管理' },
  { diff:'hard',    icon:'📕', desc:'演算法設計 → 複雜度最佳化' }
];

function difficultyInfo(diff) {
  return DIFFICULTY[diff] || DIFFICULTY.easy;
}

function difficultyStars(diff) {
  const d = difficultyInfo(diff);
  return `<span style="font-size:9px;color:${d.color};">${d.stars}</span>`;
}

function difficultyBadge(diff) {
  const d = difficultyInfo(diff);
  return `<span class="badge" style="color:${d.color};background:${d.bg};border-color:${d.border};">${d.stars} ${d.label}</span>`;
}

function onFilterChange() { renderProblemList(); }

function problemFilter() {
  const q = (document.getElementById('prob-search')?.value || '').trim().toLowerCase();
  const diff = document.getElementById('filter-diff')?.value || '';
  const unsolved = document.getElementById('filter-unsolved')?.checked || false;
  return ({ p }) => {
    if (diff && (p.diff || 'easy') !== diff) return false;
    if (unsolved) {
      const s = scores[currentLang + '_' + p.id];
      if (s && s.passed === s.total) return false;
    }
    if (q) {
      const hay = `${p.title} ${p.topic || ''} ${p.id} ${p.source || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  };
}

function renderProblemList() {
  const list = document.getElementById('problem-list');
  const indexedProblems = PROBLEMS.map((p, i) => ({ p, i })).filter(problemFilter());
  if (!indexedProblems.length) {
    list.innerHTML = '<div class="list-empty">沒有符合條件的題目</div>';
  } else {
  list.innerHTML = LEVEL_SECTIONS.map(section => {
    const d = difficultyInfo(section.diff);
    const items = indexedProblems.filter(({ p }) => (p.diff || 'easy') === section.diff);
    if (!items.length) return '';
    return `<div class="problem-group">
      <div class="level-header" style="--level-color:${d.color};--level-bg:${d.bg};--level-border:${d.border};">
        <div class="level-title-row"><span>${escH(section.icon)}</span><span>${escH(d.label)}練習</span><span class="count">${items.length} 題</span></div>
        <div class="level-desc">${escH(section.desc)}</div>
      </div>
      ${items.map(({ p, i }) => renderProblemItem(p, i, d)).join('')}
    </div>`;
  }).join('');
  }

  // Solved count for current language
  const solved = PROBLEMS.filter(p => {
    const s = scores[currentLang + '_' + p.id];
    return s && s.passed === s.total;
  }).length;
  document.getElementById('solved-count').textContent = `${solved} / ${PROBLEMS.length}`;
}

function updateProblemTotals() {
  document.getElementById('problem-total').textContent = PROBLEMS.length;
  document.getElementById('problem-list-total').textContent = PROBLEMS.length;
}

function renderProblemItem(p, i, d) {
    const key = currentLang + '_' + p.id;
    const s = scores[key];
    let sh = '';
    if (s) {
      if (s.passed === s.total) sh = '<span class="pstatus pass">AC</span>';
      else if (s.passed > 0) sh = `<span class="pstatus partial">${s.passed}/${s.total}</span>`;
      else sh = '<span class="pstatus fail">WA</span>';
    }
    const active = currentProblem?.id === p.id ? ' active' : '';
    return `<div class="problem-item${active}" style="--level-color:${d.color};" onclick="selectProblem(${i})">
      <div class="pmeta">第 ${String(i+1).padStart(2,'0')} 題 · ${escH(p.topic || p.date)}</div>
      <div class="problem-row">
        <span class="ptitle">${escH(p.title)}</span>
        <span class="pmarks">${difficultyStars(p.diff)}${sh}</span>
      </div>
    </div>`;
}

// ── Select problem ────────────────────────────────────────────────────────────
function selectProblem(idx) {
  currentProblem = PROBLEMS[idx];
  renderProblemList();
  renderProblemContent();
  document.getElementById('results-body').innerHTML = '<div class="no-results">撰寫程式後點擊「執行並評分」</div>';
  document.getElementById('results-summary').textContent = '';
  if (currentLang !== 'py' || pyodide)
    document.getElementById('run-btn').disabled = false;
}

function renderProblemContent() {
  const p = currentProblem;
  const cfg = LANGS[currentLang];
  document.getElementById('prob-badge').textContent = p.source ? `🌏 ${p.source}` : `ZeroJudge: ${p.id}`;
  const originalUrl = safeUrl(p.url);
  const samples = p.samples.map((s, i) => `
    <div class="sample-block">
      <div class="sample-block-hdr">範例 ${i+1}</div>
      <div class="sample-inner">
        <div class="sample-col"><div class="sample-col-label">輸入</div><pre>${escH(s.input)}</pre></div>
        <div class="sample-col"><div class="sample-col-label">輸出</div><pre>${escH(s.output)}</pre></div>
      </div>
    </div>`).join('');
  document.getElementById('problem-content').innerHTML = `
    <div class="problem-title-h">${escH(p.title)}</div>
    <div class="problem-meta">
      <span class="badge">${escH(p.date)}</span>
      ${p.source ? `<span class="badge" style="color:#79c0ff;background:rgba(121,192,255,.12);border-color:rgba(121,192,255,.35);">🌏 ${escH(p.source)}</span>` : `<span class="badge">${escH(p.id)}</span>`}
      ${originalUrl ? `<a class="badge" href="${escAttr(originalUrl)}" target="_blank" rel="noopener" style="color:#3fb950;background:rgba(63,185,80,.10);border-color:rgba(63,185,80,.35);text-decoration:none;">🔗 原題</a>` : ''}
      <span class="badge lang">${escH(cfg.icon)} ${escH(cfg.name)}</span>
      ${p.topic ? `<span class="badge topic">${escH(p.topic)}</span>` : ''}
      ${difficultyBadge(p.diff)}
    </div>
    <div class="section-label">題目說明</div><div class="desc-text">${safeMarkdown(p.desc)}</div>
    <div class="section-label">輸入說明</div><div class="desc-text">${safeMarkdown(p.input_desc)}</div>
    <div class="section-label">輸出說明</div><div class="desc-text">${safeMarkdown(p.output_desc)}</div>
    <div class="section-label">範例測資</div>${samples}`;
}

// ── Run ───────────────────────────────────────────────────────────────────────
async function runCode() {
  if (!currentProblem || !currentLang) return;
  const code = editor.getValue().trim();
  if (!code) { alert('請先撰寫程式碼！'); return; }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = currentLang === 'java' ? '⏳ 執行中（約3秒）...' : '⏳ 執行中...';

  const results = [];
  for (let i = 0; i < currentProblem.samples.length; i++) {
    const s = currentProblem.samples[i];
    const r = await runSingle(code, s.input, s.output);
    results.push({ ...r, idx: i + 1 });
  }

  btn.disabled = false;
  btn.textContent = '▶ 執行並評分';

  const passed = results.filter(r => r.pass).length;
  const total = results.length;
  scores[currentLang + '_' + currentProblem.id] = { passed, total };
  saveScores();
  renderProblemList();
  renderResults(results, passed, total);
}

const JUDGE0_LANG = { cpp: 54, c: 50, java: 62 };

// 送交 Judge0；429（速率限制）與 5xx／網路錯誤時自動退避重試，共 3 次
async function judge0Submit(code, stdin) {
  const delays = [0, 1500, 4000];
  let lastErr = null;
  for (let attempt = 0; attempt < delays.length; attempt++) {
    if (delays[attempt]) await new Promise(r => setTimeout(r, delays[attempt]));
    let res;
    try {
      res = await fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          language_id: JUDGE0_LANG[currentLang],
          source_code: code,
          stdin: stdin || ''
        })
      });
    } catch(e) {
      lastErr = '🌐 無法連線到雲端評測服務，請確認網路後再試';
      continue;
    }
    if (res.status === 429) { lastErr = '🚦 雲端評測服務忙碌中（請求過於頻繁），請等幾秒再執行'; continue; }
    if (res.status >= 500) { lastErr = '⚠️ 雲端評測服務暫時異常（HTTP ' + res.status + '），請稍後再試'; continue; }
    if (!res.ok) throw new Error('評測服務回應異常（HTTP ' + res.status + '）');
    return await res.json();
  }
  throw new Error(lastErr || '評測服務無回應');
}

async function runSingle(code, stdin, expectedRaw) {
  const expected = expectedRaw.replace(/\r\n/g, '\n').trimEnd();
  try {
    let output = '', error = null;
    if (currentLang === 'py') {
      const lines = stdin.split('\n');
      pyodide.globals.set('_stdin_lines', lines);
      pyodide.globals.set('_stdin_text', stdin.endsWith('\n') ? stdin : stdin + '\n');
      output = await pyodide.runPythonAsync(`
import sys, io, builtins
_lines = _stdin_lines; _idx = [0]
def _inp(p=''):
    if _idx[0] < len(_lines): v=_lines[_idx[0]]; _idx[0]+=1; return v
    raise EOFError()
builtins.input = _inp
sys.stdin = io.StringIO(_stdin_text)
_old = sys.stdout; sys.stdout = io.StringIO()
try:
${code.split('\n').map(l => '    ' + l).join('\n')}
    _out = sys.stdout.getvalue()
except Exception as e:
    _out = 'ERROR: ' + str(e)
finally:
    sys.stdout = _old
_out`);
    } else {
      // C / C++ / Java 走 Judge0 CE（Piston 公開 API 自 2026/02/15 起白名單）
      const data = await judge0Submit(code, stdin);
      // Judge0 status：3=AC/正常結束, 5=TLE, 6=編譯錯誤, 7~12=執行期錯誤, 13/14=服務內部錯誤
      const sid = data.status && data.status.id;
      if (sid === 5) return { pass: false, got: '', expected, error: '⏱ 執行逾時（TLE）：程式超過時間限制，請檢查迴圈或演算法複雜度' };
      if (sid === 6) return { pass: false, got: '', expected, error: '🛠 編譯錯誤：\n' + String(data.compile_output || '').split('\n').slice(0, 4).join('\n') };
      if (sid >= 13) return { pass: false, got: '', expected, error: '⚠️ 評測服務暫時異常（' + (data.status.description || sid) + '），請稍後再試' };
      const stdout = data.stdout || '';
      const stderr = data.stderr || data.compile_output || '';
      if (sid >= 7 && sid <= 12) return { pass: false, got: stdout, expected, error: '💥 執行期錯誤（' + (data.status.description || 'Runtime Error') + '）：\n' + String(stderr).split('\n').slice(0, 4).join('\n') };
      if (stderr && !stdout) return { pass: false, got: '', expected, error: stderr.split('\n').slice(0, 4).join('\n') };
      output = stdout;
    }
    const got = String(output).replace(/\r\n/g, '\n').trimEnd();
    return { pass: got === expected, got, expected, error };
  } catch(e) {
    return { pass: false, got: '', expected, error: String(e.message || e).split('\n').slice(0, 3).join('\n') };
  }
}

function renderResults(results, passed, total) {
  const pct = Math.round(passed / total * 100);
  const sc = passed === total ? 'full' : passed > 0 ? 'partial' : 'zero';
  document.getElementById('results-summary').innerHTML =
    `<span style="color:var(--${passed===total?'green':passed>0?'yellow':'red'})">${passed}/${total} 通過</span>`;

  const rows = results.map(r => `
    <div class="test-case">
      <div class="test-col"><div class="test-label">
        <div class="icon ${r.pass?'icon-pass':'icon-fail'}">${r.pass?'✓':'✗'}</div>
        <span style="color:var(--${r.pass?'green':'red'})">測資 ${r.idx} · ${r.pass?'AC':'WA'}</span>
      </div></div>
      <div class="test-col">
        <div style="font-size:9px;color:var(--text-muted);margin-bottom:4px">預期輸出</div>
        <pre>${escH(r.expected)}</pre>
      </div>
      <div class="test-col">
        <div style="font-size:9px;color:var(--text-muted);margin-bottom:4px">你的輸出</div>
        <pre class="${r.pass?'pre-right':'pre-wrong'}">${escH(r.error || r.got || '(無輸出)')}</pre>
      </div>
    </div>`).join('');

  document.getElementById('results-body').innerHTML = `
    <div class="score-summary">
      <span class="score-num ${sc}">${pct}%</span>
      <div>
        <div style="font-size:13px;font-weight:600">${passed===total?'🎉 全部通過！':passed>0?'⚠️ 部分通過':'❌ 未通過'}</div>
        <div style="font-size:11px;color:var(--text-muted)">通過 ${passed} / ${total} 筆測資</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${rows}`;
}

function clearEditor() { editor.setValue(''); editor.focus(); }

function loadSample() {
  if (!currentProblem || !currentLang) { alert('請先選擇語言和題目'); return; }
  const sol = SOLUTIONS[currentLang][currentProblem.id];
  if (!sol) { alert('此題目目前沒有參考解答'); return; }
  if (editor.getValue().trim() && !confirm('確定要載入參考解答？（會同時顯示解題思路）')) return;
  editor.setValue(sol);
  editor.focus();
  // Show hint panel if hint exists
  if (currentProblem.hint) showHint();
}

function showHint() {
  if (!currentProblem || !currentProblem.hint) return;
  const html = safeMarkdown(currentProblem.hint);
  document.getElementById('hint-content').innerHTML = html;
  document.getElementById('hint-overlay').style.display = 'flex';
}

function hideHint() {
  document.getElementById('hint-overlay').style.display = 'none';
}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return escH(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function safeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(String(url), window.location.href);
    return ['http:', 'https:'].includes(u.protocol) ? u.href : '';
  } catch (_) {
    return '';
  }
}

function safeMarkdown(text) {
  const escaped = escH(text).replace(/~/g, '&#126;');
  return marked.parse(escaped).replace(/&amp;(lt|gt|amp|#126);/g, '&$1;');
}
