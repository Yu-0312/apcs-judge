<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--sidebar-bg:#161b22;--panel-bg:#1c2128;
  --border:#30363d;--text:#e6edf3;--text-muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;
  --py:#3fb950;--cpp:#79c0ff;--c:#ffa657;--java:#d2a8ff;
  --lang-color:var(--py);
  --header-h:56px;--tab-h:44px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

/* Header */
header{height:var(--header-h);display:flex;align-items:center;padding:0 20px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;}
.logo{font-size:17px;font-weight:700;color:var(--lang-color);transition:color .2s;}
.sub{font-size:12px;color:var(--text-muted);}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);}
.hbtn{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;}
.hbtn:hover{border-color:var(--text-muted);}
.hbtn:disabled{opacity:.5;cursor:wait;}
.ldbar{display:inline-block;width:72px;height:4px;border-radius:2px;background:var(--track-bg);overflow:hidden;vertical-align:middle;margin-left:6px;}
.ldbar i{display:block;width:40%;height:100%;background:var(--yellow);border-radius:2px;animation:ldslide 1.2s ease-in-out infinite;}
@keyframes ldslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite;}
.status-dot.ready{background:var(--green);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* First-visit next-step card */
.onboard{position:fixed;z-index:80;top:64px;right:18px;width:min(430px,calc(100vw - 24px));background:rgba(28,33,40,.98);border:1px solid var(--border);border-radius:10px;box-shadow:0 14px 42px rgba(0,0,0,.45);padding:16px;}
.onboard[hidden]{display:none;}
.onboard-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.onboard-head h2{font-size:16px;margin-bottom:3px;}
.onboard-head p{font-size:11px;color:var(--text-muted);line-height:1.5;}
.onboard-close{margin-left:auto;background:none;border:0;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;}
.onboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.onboard-field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-muted);}
.onboard-field select,.onboard-field input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font:inherit;color-scheme:dark;}
.onboard-actions{display:flex;align-items:center;gap:8px;margin-top:12px;}
.onboard-save{background:var(--green);color:var(--button-on-accent);border:0;border-radius:6px;padding:7px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.onboard-next{margin-top:12px;padding-top:11px;border-top:1px solid var(--border);}
.onboard-next[hidden]{display:none;}
.onboard-message{font-size:12px;line-height:1.55;margin-bottom:8px;}
.onboard-links{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.onboard-links a{border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);text-decoration:none;font-size:11px;background:var(--surface-tint);}
.onboard-links a.primary{border-color:var(--lang-color);color:var(--lang-color);background:rgba(63,185,80,.07);}
.sample-scope-note{font-size:10px;color:var(--yellow);white-space:nowrap;}

/* Language tabs */
.lang-tabs{height:var(--tab-h);display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.lang-tab{display:flex;align-items:center;gap:7px;padding:0 20px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s;}
.lang-tab:hover{color:var(--text);background:var(--hover-bg);}
.lang-tab.active-py{color:var(--py);border-color:var(--py);background:rgba(63,185,80,.05);}
.lang-tab.active-cpp{color:var(--cpp);border-color:var(--cpp);background:rgba(121,192,255,.05);}
.lang-tab.active-c{color:var(--c);border-color:var(--c);background:rgba(255,166,87,.05);}
.lang-tab.active-java{color:var(--java);border-color:var(--java);background:rgba(210,168,255,.05);}
.lang-note{margin-left:auto;padding:0 16px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;}

/* Layout */
.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - var(--header-h) - var(--tab-h));overflow:hidden;}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.problem-list{overflow-y:auto;flex:1;padding:8px 0;}
.list-tools{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.list-tools input[type=search]{width:100%;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:6px 8px;outline:none;}
.list-tools input[type=search]:focus{border-color:var(--lang-color,#58a6ff);}
.filter-row{display:flex;align-items:center;gap:8px;}
.filter-row select{flex:1;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;padding:5px 6px;outline:none;}
.filter-chk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
.filter-chk input{accent-color:var(--green);}
.list-empty{padding:20px 14px;font-size:12px;color:var(--text-muted);text-align:center;}
.problem-group{padding-bottom:8px;border-bottom:1px solid rgba(48,54,61,.45);}
.level-header{position:relative;margin:0 8px 6px;padding:13px 12px 14px 16px;border-radius:7px;background:linear-gradient(135deg,var(--level-bg),rgba(22,27,34,.94));border:1px solid var(--level-border);border-left:4px solid var(--level-color);box-shadow:0 8px 18px rgba(0,0,0,.12);}
.level-title-row{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:750;color:var(--text);}
.level-title-row .count{margin-left:auto;font-size:10px;color:var(--level-color);background:var(--track-bg);border:1px solid var(--level-border);border-radius:999px;padding:1px 7px;font-weight:700;}
.level-desc{margin-top:6px;font-size:11px;color:var(--text-muted);line-height:1.45;}
.problem-item{display:block;padding:9px 14px 10px 18px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,.38);transition:background .12s,border-color .12s;font-size:12px;border-left:3px solid transparent;}
.problem-item:hover{background:var(--hover-bg);}
.problem-item:focus-visible{outline:2px solid var(--lang-color);outline-offset:-2px;}
.problem-item.active{background:var(--strong-hover-bg);border-left-color:var(--level-color);}
.problem-item .pmeta{font-size:10px;color:var(--text-muted);font-weight:700;letter-spacing:.3px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.problem-row{display:flex;align-items:center;gap:8px;}
.problem-item .ptitle{flex:1;font-weight:650;font-size:13px;color:var(--text);line-height:1.35;min-width:0;}
.problem-item .pmarks{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.pstatus.pass{color:var(--green);font-size:10px;font-weight:700;}
.pstatus.fail{color:var(--red);font-size:10px;font-weight:700;}
.pstatus.partial{color:var(--yellow);font-size:10px;font-weight:700;}

/* Main panels */
.main{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}
.problem-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel-bg);font-size:12px;color:var(--text-muted);}
.problem-content{overflow-y:auto;flex:1;padding:18px;}
.problem-title-h{font-size:21px;font-weight:700;margin-bottom:4px;}
.problem-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;background:var(--track-bg);color:var(--text-muted);border:1px solid var(--border);}
.badge.lang{background:var(--strong-hover-bg);color:var(--lang-color);border-color:var(--lang-color);transition:all .2s;}
.badge.topic{color:#bc8cff;background:rgba(188,140,255,.1);border-color:rgba(188,140,255,.3);}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin:14px 0 6px;}
.desc-text{font-size:13px;line-height:1.7;color:var(--text-soft);}
.desc-text p{margin-bottom:8px;}
.desc-text code{background:var(--strong-hover-bg);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:12px;}
.sample-block{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.sample-block-hdr{padding:7px 12px;background:var(--surface-tint);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);}
.sample-inner{display:grid;grid-template-columns:1fr 1fr;}
.sample-col{padding:10px 12px;}
.sample-col+.sample-col{border-left:1px solid var(--border);}
.sample-col-label{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:5px;letter-spacing:.5px;}
.sample-col pre{font-family:monospace;font-size:11px;color:var(--text-soft);white-space:pre-wrap;line-height:1.5;}

/* Editor panel */
.editor-panel{display:flex;flex-direction:column;overflow:hidden;}
.editor-toolbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--panel-bg);flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn:focus-visible{outline:2px solid var(--lang-color);outline-offset:-2px;}
.btn-run{background:var(--lang-color);color:var(--button-on-accent);transition:background .2s;}
.btn-run:hover{filter:brightness(1.15);}
.btn-run:disabled{opacity:.5;cursor:not-allowed;}
.btn-sec{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-sec:hover:not(:disabled){color:var(--text);border-color:var(--text-muted);}
.btn-sec:disabled{opacity:.4;cursor:not-allowed;}
.btn-sample{background:transparent;color:var(--lang-color);border:1px solid var(--lang-color);opacity:.7;font-size:11px;padding:4px 9px;transition:all .2s;}
.btn-sample:hover{opacity:1;}
.editor-wrap{flex:1;overflow:hidden;}
.CodeMirror{height:100%!important;font-size:13px!important;font-family:'SFMono-Regular',Consolas,monospace!important;line-height:1.6!important;}
.results-panel{border-top:1px solid var(--border);flex-shrink:0;max-height:250px;overflow-y:auto;background:var(--bg);}
.results-hdr{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1;}
.test-case{display:grid;grid-template-columns:110px 1fr 1fr;border-bottom:1px solid rgba(48,54,61,.5);}
.test-col{padding:7px 10px;font-size:11px;}
.test-label{display:flex;align-items:center;gap:5px;font-weight:600;}
.icon{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.icon-pass{background:rgba(63,185,80,.2);color:var(--green);}
.icon-fail{background:rgba(248,81,73,.2);color:var(--red);}
.test-col pre{font-family:monospace;font-size:10px;white-space:pre-wrap;line-height:1.5;color:var(--text-muted);max-height:90px;overflow:auto;}
.pre-right{color:var(--green);}
.pre-wrong{color:var(--red);}
.dline{display:block;min-height:1.4em;}
.dline.bad{background:rgba(248,81,73,.22);border-radius:2px;}
.dline small{color:var(--text-muted);font-weight:400;}
.diff-at{font-size:10px;color:var(--text-muted);margin-top:4px;}
.score-summary{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:12px;background:var(--panel-bg);border-top:1px solid var(--border);}
.score-num{font-size:20px;font-weight:700;}
.score-num.full{color:var(--green);}
.score-num.partial{color:var(--yellow);}
.score-num.zero{color:var(--red);}
.no-results{padding:20px;text-align:center;color:var(--text-muted);font-size:12px;}
.progress-bar{height:2px;background:var(--border);}
.progress-fill{height:100%;background:var(--lang-color);transition:background .2s;}
.lang-tab:focus-visible{outline:2px solid var(--lang-color);outline-offset:-2px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}

/* === responsive: mobile === */
#mobile-nav{display:none;}
@media (max-width:960px){
  :root{--mnav-h:54px;}
  header{padding:0 10px;gap:8px;}
  header .sub{display:none;}
  .logo{font-size:14px;white-space:nowrap;}
  .hright{gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none;}
  .hright::-webkit-scrollbar{display:none;}
  .hright>*{flex-shrink:0;}
  .hright a{padding:4px 8px;white-space:nowrap;}
  #status-text{display:none;}
  .lang-tabs{overflow-x:auto;}
  .lang-tab{padding:0 12px;font-size:11.5px;white-space:nowrap;}
  .lang-note{display:none;}
  .layout{display:flex;flex-direction:column;height:calc(100vh - var(--header-h) - var(--tab-h) - var(--mnav-h));height:calc(100dvh - var(--header-h) - var(--tab-h) - var(--mnav-h));}
  .sidebar{display:none;width:100%;height:100%;border-right:none;}
  .main{display:none;grid-template-columns:1fr;flex:1;min-height:0;height:100%;}
  .problem-panel,.editor-panel{display:none;border-right:none;width:100%;height:100%;}
  .layout[data-mview="list"] .sidebar{display:flex;}
  .layout[data-mview="prob"] .main{display:grid;}
  .layout[data-mview="prob"] .problem-panel{display:flex;}
  .layout[data-mview="code"] .main{display:grid;}
  .layout[data-mview="code"] .editor-panel{display:flex;}
  .results-panel{max-height:200px;}
  .sample-inner{grid-template-columns:1fr;}
  .sample-col+.sample-col{border-left:none;border-top:1px solid var(--border);}
  .test-case{grid-template-columns:90px 1fr 1fr;}
  .onboard{top:58px;right:12px;}
  .onboard-grid,.onboard-links{grid-template-columns:1fr;}
  #mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--mnav-h);background:var(--sidebar-bg);border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom);}
  #mobile-nav button{flex:1;background:transparent;border:none;color:var(--text-muted);font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:2px solid transparent;transition:color .15s;}
  #mobile-nav button.on{color:var(--lang-color);border-top-color:var(--lang-color);}
  #mobile-nav button .ic{font-size:16px;}
}
</style>

// ── Language config ───────────────────────────────────────────────────────────
const LANGS = {
  py:   { name:'Python', icon:'🐍', color:'#3fb950', mode:'python',        note:'Pyodide 瀏覽器執行',         noteEn:'Pyodide runs in your browser', label:'Python' },
  cpp:  { name:'C++',    icon:'⚡', color:'#79c0ff', mode:'text/x-c++src', note:'線上 g++ (Judge0)',          noteEn:'Online g++ (Judge0)',          label:'C++' },
  c:    { name:'C',      icon:'🔧', color:'#ffa657', mode:'text/x-csrc',   note:'線上 gcc (Judge0)',          noteEn:'Online gcc (Judge0)',          label:'C' },
  java: { name:'Java',   icon:'☕', color:'#d2a8ff', mode:'text/x-java',   note:'Judge0 CE（需網路，約3秒）', noteEn:'Judge0 CE (network, ~3 s)',    label:'Java' }
};

// ── State ─────────────────────────────────────────────────────────────────────
let currentLang = null;
let currentProblem = null;
let editor = null;
let running = false;
const SAMPLE_RESULTS_KEY = 'apcs_judge_sample_results_v2';
const LEGACY_SCORES_KEY = 'apcs_judge_scores_v1';
const VALID_RESULT_KEYS = new Set(PROBLEMS.flatMap(p => Object.keys(LANGS).map(lang => lang + '_' + p.id)));

function sanitizeSampleResults(value, migratedFrom) {
  const clean = {};
  if (!value || typeof value !== 'object' || Array.isArray(value)) return clean;
  for (const [key, result] of Object.entries(value)) {
    if (!VALID_RESULT_KEYS.has(key) || !result || typeof result !== 'object') continue;
    const passed = Number(result.passed), total = Number(result.total);
    if (!Number.isInteger(passed) || !Number.isInteger(total) || total < 1 || passed < 0 || passed > total) continue;
    clean[key] = {
      passed, total,
      checkedAt: typeof result.checkedAt === 'string' ? result.checkedAt : null,
      sampleDataVersion: typeof result.sampleDataVersion === 'string' ? result.sampleDataVersion : null,
      ...(migratedFrom ? { migratedFrom } : {})
    };
  }
  return clean;
}

function loadSampleResults() {
  let current = {}, hasCurrent = false, changed = false;
  try {
    const raw = localStorage.getItem(SAMPLE_RESULTS_KEY);
    if (raw !== null) {
      current = sanitizeSampleResults(JSON.parse(raw));
      hasCurrent = true;
    }
  } catch (e) {}
  // v1 曾把公開範例結果稱為 AC；保留舊資料但遷移到語意正確的新 key，不刪除原始備份。
  try {
    const legacy = sanitizeSampleResults(JSON.parse(localStorage.getItem(LEGACY_SCORES_KEY) || '{}'), 'legacy-sample-result-v1');
    for (const [key, result] of Object.entries(legacy)) {
      if (current[key] === undefined) { current[key] = result; changed = true; }
    }
    if (!hasCurrent || changed) localStorage.setItem(SAMPLE_RESULTS_KEY, JSON.stringify(current));
  } catch (e) {}
  return current;
}

let sampleResults = loadSampleResults(); // { 'py_b964': {passed,total,checkedAt,sampleDataVersion}, ... }

function saveSampleResults() {
  try { localStorage.setItem(SAMPLE_RESULTS_KEY, JSON.stringify(sampleResults)); } catch(e) {}
}

function sampleResultComplete(result, problem) {
  return !!(result && problem && result.passed === problem.samples.length && result.total === problem.samples.length);
}

function completeSampleResultCount() {
  let count = 0;
  for (const p of PROBLEMS) for (const lang of Object.keys(LANGS)) {
    if (sampleResultComplete(sampleResults[lang + '_' + p.id], p)) count++;
  }
  return count;
}

// ── 首訪「今天下一步」與安全深連結 ──────────────────────────────────────────
const ONBOARDING_KEY = 'apcs_judge_onboarding_v1';
const ONBOARDING_GOALS = ['beginner', 'reading', 'practice', 'exam'];
const ONBOARDING_HOURS = [2, 4, 7, 10];

function normalizeOnboarding(value) {
  const v = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  const goal = ONBOARDING_GOALS.includes(v.goal) ? v.goal : 'beginner';
  const lang = Object.prototype.hasOwnProperty.call(LANGS, v.lang) ? v.lang : 'py';
  const weeklyHours = ONBOARDING_HOURS.includes(Number(v.weeklyHours)) ? Number(v.weeklyHours) : 4;
  const examDate = typeof v.examDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.examDate) ? v.examDate : '';
  return { goal, lang, weeklyHours, examDate, configured:!!v.configured, dismissed:!!v.dismissed,
    updatedAt:typeof v.updatedAt === 'string' ? v.updatedAt : null };
}

function loadOnboarding() {
  try { return normalizeOnboarding(JSON.parse(localStorage.getItem(ONBOARDING_KEY) || '{}')); }
  catch (e) { return normalizeOnboarding({}); }
}

function saveOnboarding(value) {
  const clean = normalizeOnboarding(value);
  try { localStorage.setItem(ONBOARDING_KEY, JSON.stringify(clean)); } catch (e) {}
  return clean;
}

function renderOnboardingRecommendation(value) {
  const v = normalizeOnboarding(value), t = T().onboard;
  const card = document.getElementById('onboard-next');
  const links = [
    document.getElementById('onboard-tutorial'), document.getElementById('onboard-reading'),
    document.getElementById('onboard-judge'), document.getElementById('onboard-plan')
  ];
  links[0].href = 'tutorial.html';
  links[1].href = 'reading.html';
  links[2].href = 'index.html?problem=p101&lang=' + encodeURIComponent(v.lang);
  links[3].href = 'studyplan.html';
  links.forEach((a, i) => { a.textContent = t.links[i]; a.classList.remove('primary'); });
  links[{beginner:0,reading:1,practice:2,exam:3}[v.goal]].classList.add('primary');
  const timing = uiLang === 'en'
    ? ` ${v.weeklyHours}+ hours/week${v.examDate ? '; exam ' + v.examDate : ''}.`
    : ` 每週 ${v.weeklyHours}+ 小時${v.examDate ? '；考試日 ' + v.examDate : ''}。`;
  document.getElementById('onboard-message').textContent = t.messages[v.goal] + timing;
  card.hidden = false;
}

function openOnboarding(force) {

  document.getElementById('onboard-goal').value = saved.goal;

function dismissOnboarding() {

function initOnboarding(suppressAutoOpen) {

function parsePracticeDeepLink() {

// ── 草稿自動保存（per 題目 + 語言；換題、換語言、重整都不會弄丟程式碼） ─────
const DRAFTS_KEY = 'apcs_judge_drafts_v1';
const PROGRESS_IMPORT_MAX_BYTES = 12 * 1024 * 1024;
const MAX_DRAFT_RECORDS = 1200;
const MAX_DRAFT_CHARS = 200000;

function sanitizeDraftMap(value, strict) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) {
    if (strict) throw new Error('bad drafts');
    return {};
  }
  const entries = Object.entries(value);
  if (entries.length > MAX_DRAFT_RECORDS) {
    if (strict) throw new Error('too many drafts');
    entries.length = MAX_DRAFT_RECORDS;
  }
  const clean = {};
  for (const [key, draft] of entries) {
    const valid = VALID_RESULT_KEYS.has(key) && typeof draft === 'string' && draft.length <= MAX_DRAFT_CHARS;
    if (!valid) { if (strict) throw new Error('bad draft'); else continue; }
    if (draft.trim()) clean[key] = draft;
  }
  return clean;
}

function sanitizeImportedOnboarding(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('bad onboarding');
  const allowed = new Set(['goal','lang','weeklyHours','examDate','configured','dismissed','updatedAt']);
  if (Object.keys(value).some(key => !allowed.has(key))) throw new Error('bad onboarding fields');
  if (!ONBOARDING_GOALS.includes(value.goal) || !Object.prototype.hasOwnProperty.call(LANGS, value.lang)) throw new Error('bad onboarding choice');
  if (!ONBOARDING_HOURS.includes(Number(value.weeklyHours))) throw new Error('bad onboarding hours');
  if (typeof value.examDate !== 'string' || (value.examDate && !/^\d{4}-\d{2}-\d{2}$/.test(value.examDate))) throw new Error('bad onboarding date');
  if (typeof value.configured !== 'boolean' || typeof value.dismissed !== 'boolean') throw new Error('bad onboarding flags');
  if (value.updatedAt !== null && (typeof value.updatedAt !== 'string' || value.updatedAt.length > 40 || !Number.isFinite(Date.parse(value.updatedAt)))) throw new Error('bad onboarding time');
  return normalizeOnboarding(value);
}

let drafts = {};
try {
  const d = JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}');
  drafts = sanitizeDraftMap(d, false);
} catch(e) {}
let draftTimer = null;
function dKey(){ return currentLang + '_' + currentProblem.id; }
function scheduleDraftSave(){
  if (!currentProblem || !currentLang) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, 400);
}
function flushDraft(){
  clearTimeout(draftTimer); draftTimer = null;
  if (!currentProblem || !currentLang || !editor) return;
  const v = editor.getValue();
  if (v.trim()) drafts[dKey()] = v; else delete drafts[dKey()];
  try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); } catch(e) {}
}
// 關閉/切走分頁時把防抖中的草稿立即寫入，避免最後 0.4 秒的輸入遺失
window.addEventListener('beforeunload', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });

function exportProgress() {
  try {
    flushDraft(); // 草稿一併打包，換裝置時寫到一半的程式碼帶得走
    const isFull = typeof LearningState!=='undefined'&&typeof LearningState.exportBackup==='function';
    const data = isFull ? LearningState.exportBackup() : { app:'apcs-judge', v:2, exportedAt:new Date().toISOString(), sampleResults, drafts, onboarding:loadOnboarding() };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = isFull ? `apcs-learning-backup-${new Date().toISOString().slice(0,10)}.json` : 'judge-progress.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (err) { alert(T().backupExportFail); }
}
function importProgress() { document.getElementById('prog-file').click(); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('prog-file').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > PROGRESS_IMPORT_MAX_BYTES) { alert(T().importTooLarge); return; }
    try {
      const data = JSON.parse(await f.text());
      if(data.app==='apcs-learning-backup'){
        if(typeof LearningState==='undefined'||typeof LearningState.importBackup!=='function')throw new Error('backup unavailable');
        LearningState.importBackup(data);
        alert(T().backupImportOk);
        location.reload();
        return;
      }
      if (data.app !== 'apcs-judge') throw new Error('bad format');
      const incomingRaw = data.sampleResults || data.scores; // v2 語意 key；v1 匯出檔向後相容
      if (!incomingRaw || typeof incomingRaw !== 'object') throw new Error('bad format');
      if (Object.keys(incomingRaw).length > VALID_RESULT_KEYS.size) throw new Error('too many results');
      const incoming = sanitizeSampleResults(incomingRaw, data.sampleResults ? null : 'legacy-export-v1');
      const incomingDrafts = data.drafts === undefined ? null : sanitizeDraftMap(data.drafts, true);
      const incomingOnboarding = data.onboarding === undefined ? null : sanitizeImportedOnboarding(data.onboarding);
      // 合併：保留通過公開範例數較高的紀錄
      for (const [k, v] of Object.entries(incoming)) {
        const cur = sampleResults[k];
        if (!cur || v.passed > cur.passed || (v.passed === cur.passed && v.total > cur.total)) sampleResults[k] = v;
      }
      // 草稿合併：只補進本機沒有的（本機現有草稿優先，不被匯入檔覆蓋）
      if (incomingDrafts) {
        for (const [k, v] of Object.entries(incomingDrafts)) {
          if (drafts[k] === undefined) drafts[k] = v;
        }
        try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); } catch(e) {}
        if (currentProblem && currentLang && !editor.getValue().trim() && drafts[dKey()]) editor.setValue(drafts[dKey()]);
      }
      if (incomingOnboarding) saveOnboarding(incomingOnboarding);
      saveSampleResults();
      renderProblemList();
      alert(T().importOk(completeSampleResultCount()));
    } catch (err) {
      alert(err&&(/^(?:STORAGE_|BACKUP_TOO_LARGE)/.test(err.message||''))?T().backupStorageFail:T().importBad);
    }
  });
});

  "ready.then(() => postMessage({ type: 'ready' }), (e) => postMessage({ type: 'ready', error: String(e) }));\n" +
  'const WRAP = ' + JSON.stringify(PY_WRAPPER) + ';\n' +
  'onmessage = async (e) => {\n' +
  '  const { id, code, stdin } = e.data;\n' +
  '  try {\n' +
  '    const py = await ready;\n' +
  "    py.globals.set('__code', code);\n" +
  "    py.globals.set('__stdin', stdin);\n" +
  '    await py.runPythonAsync(WRAP);\n' +
  "    postMessage({ id, out: py.globals.get('__r_out') || '', err: py.globals.get('__r_err') || '', outTruncated: !!py.globals.get('__r_out_truncated'), errTruncated: !!py.globals.get('__r_err_truncated') });\n" +
  '  } catch (err) {\n' +
  "    postMessage({ id, out: '', err: String(err), outTruncated: false, errTruncated: false });\n" +
  '  }\n' +
  '};\n';

function startPyWorker() {
  const blob = new Blob([PY_WORKER_SRC], { type: 'text/javascript' });
  const workerUrl = URL.createObjectURL(blob);
  try { pyWorker = new Worker(workerUrl); }
  finally { URL.revokeObjectURL(workerUrl); }
  pyReady = false;
  pyReadyPromise = new Promise((resolve, reject) => {
    pyWorker.onmessage = (e) => {
      const d = e.data || {};
      if (d.type === 'ready') {
        if (d.error) reject(new Error(d.error));
        else { pyReady = true; resolve(); }
        return;
      }
      const job = pyJobs.get(d.id);
      if (job) { pyJobs.delete(d.id); clearTimeout(job.timer); job.resolve(d); }
    };
    pyWorker.onerror = (e) => reject(new Error((e && e.message) || 'Worker error'));
  });
  return pyReadyPromise;
}

function killPyWorker() {
  if (pyWorker) pyWorker.terminate();
  pyWorker = null; pyReady = false; pyReadyPromise = null;
  for (const [, job] of pyJobs) { clearTimeout(job.timer); job.reject(new Error('terminated')); }
  pyJobs.clear();
}

function initPython() {
  if (pyWorker) return;
  pyFailed = false;
  startPyWorker()
    .then(() => { if (currentLang === 'py') updateStatus('py'); })
    .catch(() => { pyFailed = true; killPyWorker(); if (currentLang === 'py') updateStatus('py'); });
  if (currentLang === 'py') updateStatus('py');
}

async function runPython(code, stdin, timeoutMs) {
  if (!pyWorker) initPython();
  await pyReadyPromise;
  const w = pyWorker;
  return await new Promise((resolve, reject) => {
    const id = ++pyJobSeq;
    const timer = setTimeout(() => {
      pyJobs.delete(id);
      killPyWorker();
      initPython(); // 自動重建環境（背景重新下載，快取後很快）
      reject(new Error('PY_TIMEOUT'));
    }, timeoutMs);
    pyJobs.set(id, { resolve, reject, timer });
    w.postMessage({ id, code, stdin });
  });
}

function difficultyInfo(diff) {

function problemFilter() {
  const q = (document.getElementById('prob-search')?.value || '').trim().toLowerCase();
  const diff = document.getElementById('filter-diff')?.value || '';
  const unsolved = document.getElementById('filter-unsolved')?.checked || false;
  return ({ p }) => {
    if (diff && (p.diff || 'easy') !== diff) return false;
    if (unsolved) {
      const s = sampleResults[currentLang + '_' + p.id];
      if (sampleResultComplete(s, p)) return false;
    }
    if (q) {
      const en = (typeof PROBLEMS_EN !== 'undefined' && PROBLEMS_EN[p.id]) || {};
      const hay = `${p.title} ${en.title || ''} ${p.topic || ''} ${en.topic || ''} ${p.id} ${p.source || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  };
}

// ── Run ───────────────────────────────────────────────────────────────────────
async function runCode() {
  if (running || !currentProblem || !currentLang) return;
  const code = editor.getValue().trim();
  if (!code) { alert(T().alertNeedCode); return; }

  // 快照：執行過程中即使切題 / 切語言，結果也記在開跑當下的題目與語言上
  const prob = currentProblem;
  const lang = currentLang;
  const hintLevelUsed = getHintLevelUsed(prob.id, lang);
  if (lang !== 'py') {
    if (code.length > JUDGE0_MAX_SOURCE_CHARS) { alert(T().alertSourceTooLong(JUDGE0_MAX_SOURCE_CHARS)); return; }
    if (prob.samples.some(s => s.input.length > JUDGE0_MAX_STDIN_CHARS)) { alert(T().alertInputTooLong(JUDGE0_MAX_STDIN_CHARS)); return; }
    if (!ensureJudge0Consent()) return;
  }
  running = true;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = lang === 'java' ? T().btnRunningJava : T().btnRunning;

  const results = [];
  try {
  // C/C++/Java 多筆測資優先走 Judge0 批次（一次提交全部）；不支援或失敗時退回逐筆
  if (lang !== 'py' && prob.samples.length > 1 && _j0BatchOk) {
    try {
      const subs = await judge0SubmitBatch(code, prob.samples.map(s => s.input), JUDGE0_LANG[lang]);
      subs.forEach((data, i) => {
        results.push({ ...judge0Result(data, normOut(prob.samples[i].output)), idx: i + 1 });
      });
    } catch (e) {
      if (String(e && e.message).startsWith('BATCH_UNSUPPORTED')) _j0BatchOk = false;
      results.length = 0; // 批次失敗：退回下方逐筆模式（自帶重試）
    }
  }
  if (!results.length) {
    for (let i = 0; i < prob.samples.length; i++) {
      const s = prob.samples[i];
      const r = await runSingle(code, s.input, s.output, lang);
      results.push({ ...r, idx: i + 1 });
    }
  }

  const passed = results.filter(r => r.pass).length;
  const total = results.length;
  if (typeof LearningState !== 'undefined') LearningState.recordJudgeAttempt(prob.id, lang, total > 0 && passed === total, hintLevelUsed);
  // 保留較佳公開範例結果：斷網或失誤不覆蓋既有完整通過紀錄。
  const skey = lang + '_' + prob.id;
  const prevScore = sampleResults[skey];
  if (!prevScore || passed >= prevScore.passed) {
    sampleResults[skey] = { passed, total, checkedAt:new Date().toISOString(), sampleDataVersion:DATA_VER };
    saveSampleResults();
  }
  if (passed < total) recordImplMistake(prob, lang, passed, total, code);
  renderProblemList();
  if (currentProblem === prob && currentLang === lang) renderResults(results, passed, total);
  } catch (error) {
    if (currentProblem === prob && currentLang === lang) {
      const body=document.getElementById('results-body');
      body.textContent=(uiLang==='en'?'Unexpected execution error: ':'執行發生非預期錯誤：')+String(error&&error.message||error);
    }
  } finally {
    running = false;
    btn.textContent = T().btnRun;
    updateStatus(currentLang);
  }
}

// 實作題未全數通過時，自動送進統一錯題本（同題會更新而非重複，記錄最後一次提交）
function recordImplMistake(prob, lang, passed, total, code) {
  if (typeof MistakeBook === 'undefined' || !prob) return;
  try {
    MistakeBook.add({
      type: 'impl', sourceKey: 'impl::' + lang + '::' + prob.id,
      title: MistakeBook.dateTitle(new Date()) + '｜實作 ' + (pv(prob, 'title') || prob.id),
      problemId: prob.id, problemTitle: pv(prob, 'title'),
      lang: lang, passed: passed, total: total,
      topic: pv(prob, 'topic') || prob.topic || '', desc: pv(prob, 'desc') || '',
      code: code || ''
    });
  } catch (e) {}
}

const JUDGE0_LANG = { cpp: 54, c: 50, java: 62 };
const JUDGE0_FETCH_TIMEOUT_MS = 15000;
const JUDGE0_MAX_SOURCE_CHARS = 100000;
const JUDGE0_MAX_STDIN_CHARS = 100000;
const JUDGE0_CONSENT_KEY = 'apcs_judge0_disclosure_v1';
let judge0ConsentInMemory = false;

function ensureJudge0Consent() {
  try { if (sessionStorage.getItem(JUDGE0_CONSENT_KEY) === 'accepted') return true; }
  catch (e) { if (judge0ConsentInMemory) return true; }
  if (!window.confirm(T().judge0Disclosure)) return false;
  judge0ConsentInMemory = true;
  try { sessionStorage.setItem(JUDGE0_CONSENT_KEY, 'accepted'); } catch (e) {}
  return true;
}

function assertJudge0Payload(code, stdins) {
  if (String(code).length > JUDGE0_MAX_SOURCE_CHARS) throw new Error('JUDGE0_SOURCE_TOO_LARGE');
  if (stdins.some(stdin => String(stdin || '').length > JUDGE0_MAX_STDIN_CHARS)) throw new Error('JUDGE0_STDIN_TOO_LARGE');
}

async function judge0Fetch(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || JUDGE0_FETCH_TIMEOUT_MS);
  try {
    return await fetch(url, { ...(options || {}), signal:controller.signal });
  } catch (e) {
    if (e && e.name === 'AbortError') {
      const timeoutError = new Error('JUDGE0_FETCH_TIMEOUT');
      timeoutError.cause = e;
      throw timeoutError;
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// 送交 Judge0；429（速率限制）與 5xx／網路錯誤時自動退避重試，共 3 次。
// wait=true 在服務忙碌時可能直接回 In Queue / Processing（status 1/2），改以 token 輪詢到完成。
async function judge0Submit(code, stdin, languageId) {
  assertJudge0Payload(code, [stdin]);
  const delays = [0, 1500, 4000];
  let lastErr = null;
  for (let attempt = 0; attempt < delays.length; attempt++) {
    if (delays[attempt]) await new Promise(r => setTimeout(r, delays[attempt]));
    let res;
    try {
      res = await judge0Fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language_id: languageId, source_code: code, stdin: stdin || '', max_file_size: 1024 })
      });
    } catch(e) {
      lastErr = T().errNet;
      continue;
    }
    if (res.status === 429) { lastErr = T().errBusy; continue; }
    if (res.status >= 500) { lastErr = T().err5xx(res.status); continue; }
    if (!res.ok) throw new Error(T().errResp(res.status));
    let data = await res.json();
    for (let p = 0; p < 12 && data.status && data.status.id <= 2 && data.token; p++) {
      await new Promise(r => setTimeout(r, 1200));
      // 輪詢途中斷網不往外丟原始錯誤：中止輪詢，讓上層以 queued 狀態顯示友善訊息
      try {
        const r2 = await judge0Fetch('https://ce.judge0.com/submissions/' + data.token + '?base64_encoded=false');
        if (r2.status === 429 || r2.status >= 500) continue;
        if (!r2.ok) break;
        data = await r2.json();
      } catch (e) { break; }
    }
    return data;
  }
  throw new Error(lastErr || T().errNoResp);
}

// Judge0 批次送出：一題的全部公開範例一次提交。
// 僅 404/405 代表 endpoint 確實不支援；429/5xx/逾時皆視為暫時失敗，不永久關閉 batch。
let _j0BatchOk = true;
async function judge0SubmitBatch(code, stdins, languageId) {
  assertJudge0Payload(code, stdins);
  const delays = [0, 1500, 4000];
  let created = null, lastError = 'unknown';
  for (let attempt = 0; attempt < delays.length; attempt++) {
    if (delays[attempt]) await new Promise(r => setTimeout(r, delays[attempt]));
    let res;
    try {
      res = await judge0Fetch('https://ce.judge0.com/submissions/batch?base64_encoded=false', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ submissions: stdins.map(stdin => ({ language_id: languageId, source_code: code, stdin: stdin || '', max_file_size: 1024 })) })
      });
    } catch (e) {
      lastError = e && e.message || 'network';
      continue;
    }
    if (res.status === 404 || res.status === 405) throw new Error('BATCH_UNSUPPORTED:' + res.status);
    if (res.status === 429 || res.status >= 500) { lastError = 'HTTP ' + res.status; continue; }
    if (!res.ok) throw new Error('BATCH_FAILED:' + res.status);
    try { created = await res.json(); }
    catch (e) { throw new Error('BATCH_INVALID_RESPONSE'); }
    if (!Array.isArray(created)) throw new Error('BATCH_INVALID_RESPONSE');
    break;
  }
  if (!created) throw new Error('BATCH_TRANSIENT:' + lastError);
  const tokens = created.map(s => s && s.token).filter(Boolean);
  if (tokens.length !== stdins.length) throw new Error('BATCH_PARTIAL_RESPONSE');
  const url = 'https://ce.judge0.com/submissions/batch?tokens=' + tokens.join(',') + '&base64_encoded=false';
  let subs = null;
  for (let p = 0; p < 20; p++) {
    await new Promise(r => setTimeout(r, 1200));
    try {
      const r2 = await judge0Fetch(url);
      if (!r2.ok) continue;
      const j = await r2.json();
      if (j && Array.isArray(j.submissions)) subs = j.submissions;
    } catch (e) { continue; }
    if (subs && subs.length === tokens.length && subs.every(s => s && s.status && s.status.id > 2)) return subs;
  }
  // 輪詢逾時：把已知狀態交給上層，未完成的測資會顯示 errQueued
  return subs || tokens.map(() => null);
}

// 輸出正規化：統一換行、去除每行行尾空白與結尾空行。
function normOut(s) {
  return String(s).replace(/\r\n/g, '\n').split('\n').map(l => l.replace(/[ \t]+$/, '')).join('\n').replace(/\n+$/, '');
}

function boundedExecutionText(value, forcedTruncated) {
  const raw = String(value || '');
  const truncated = !!forcedTruncated || raw.length > EXEC_OUTPUT_MAX_CHARS;
  if (!truncated) return { text:raw, truncated:false };
  const marker = `\n…[${T().outputTruncatedMarker}]`;
  return { text:raw.slice(0, Math.max(0, EXEC_OUTPUT_MAX_CHARS - marker.length)) + marker, truncated:true };
}

async function runSingle(code, stdin, expectedRaw, lang) {
  const expected = normOut(expectedRaw);
  try {
    let output = '';
    if (lang === 'py') {
      const r = await runPython(code, stdin, PY_TIMEOUT_MS);
      const stdout = boundedExecutionText(r.out, r.outTruncated);
      const stderr = boundedExecutionText(r.err, r.errTruncated);
      if (stdout.truncated || stderr.truncated) return { pass:false, got:normOut(stdout.text), expected, error:T().errOutputTruncated };
      if (stderr.text && stderr.text.trim()) {
        const tail = stderr.text.trim().split('\n').slice(-3).join('\n');
        return { pass: false, got: normOut(stdout.text), expected, error: tail };
      }
      output = stdout.text;
    } else {
      const data = await judge0Submit(code, stdin, JUDGE0_LANG[lang]);
      return judge0Result(data, expected);
    }
    const got = normOut(output);
    return { pass: got === expected, got, expected, error: null };
  } catch(e) {
    if (e && e.message === 'PY_TIMEOUT') return { pass: false, got: '', expected, error: T().errPyTimeout };
    return { pass: false, got: '', expected, error: String(e.message || e).split('\n').slice(0, 3).join('\n') };
  }
}

// 把一筆 Judge0 回應轉成評測結果（逐筆與批次共用）
// Judge0 status：3=Accepted/正常結束, 5=TLE, 6=編譯錯誤, 7~12=執行期錯誤, ≥13=服務內部錯誤
function judge0Result(data, expected) {
  const sid = data && data.status && data.status.id;
  if (!sid || sid <= 2) return { pass: false, got: '', expected, error: T().errQueued };
  if (sid === 5) return { pass: false, got: '', expected, error: T().errTLE };
  const stdout = boundedExecutionText(data.stdout);
  const stderr = boundedExecutionText(data.stderr || data.compile_output || '');
  const truncatedNote = stdout.truncated || stderr.truncated ? '\n' + T().errOutputTruncated : '';
  if (sid === 6) return { pass: false, got: '', expected, error: T().errCompile + stderr.text.split('\n').slice(0, 4).join('\n') + truncatedNote };
  if (sid >= 13) return { pass: false, got: '', expected, error: T().errService(data.status.description || sid) };
  if (sid >= 7 && sid <= 12) return { pass: false, got: normOut(stdout.text), expected, error: T().errRuntime(data.status.description || 'Runtime Error') + stderr.text.split('\n').slice(0, 4).join('\n') + truncatedNote };
  if (stdout.truncated || stderr.truncated) return { pass:false, got:normOut(stdout.text), expected, error:T().errOutputTruncated };
  if (stderr.text && !stdout.text) return { pass: false, got: '', expected, error: stderr.text.split('\n').slice(0, 4).join('\n') };
  const got = normOut(stdout.text);
  return { pass: got === expected, got, expected, error: null };
}

// 失敗測資的逐行 diff：差異行紅底，附「此行預期」提示
function renderJudgeDiff(got, expect, t) {
  const g = got.split('\n'), w = expect.split('\n');
  const n = Math.max(g.length, w.length);
  let firstBad = -1, rows = '';
  for (let i = 0; i < n; i++) {
    const a = i < g.length ? g[i] : null;
    const b = i < w.length ? w[i] : null;
    const same = a === b;
    if (!same && firstBad < 0) firstBad = i;
    if (a === null) rows += `<span class="dline bad"><i>${t.diffMissing}</i> <small>← ${t.diffExpected}${escH(b)}</small></span>`;
    else if (same) rows += `<span class="dline">${escH(a)}</span>`;
    else if (b === null) rows += `<span class="dline bad">${escH(a)} <small>← ${t.diffExtra}</small></span>`;
    else rows += `<span class="dline bad">${escH(a)} <small>← ${t.diffExpected}${escH(b)}</small></span>`;
  }
  const at = firstBad >= 0 ? `<div class="diff-at">${t.diffAt(firstBad + 1)}</div>` : '';
  return `<pre class="pre-wrong">${rows}</pre>${at}`;
}

function renderResults(results, passed, total) {
  const t = T();
  const pct = Math.round(passed / total * 100);
  const sc = passed === total ? 'full' : passed > 0 ? 'partial' : 'zero';
  document.getElementById('results-summary').innerHTML =
    `<span style="color:var(--${passed===total?'green':passed>0?'yellow':'red'})">${t.passedSummary(passed, total)}</span>`;

  const rows = results.map(r => {
    let gotCell;
    if (r.error) gotCell = `<pre class="pre-wrong">${escH(r.error)}</pre>`;
    else if (r.pass) gotCell = `<pre class="pre-right">${escH(r.got || t.noOutput)}</pre>`;
    else gotCell = renderJudgeDiff(r.got, r.expected, t);
    return `
    <div class="test-case">
      <div class="test-col"><div class="test-label">
        <div class="icon ${r.pass?'icon-pass':'icon-fail'}">${r.pass?'✓':'✗'}</div>
        <span style="color:var(--${r.pass?'green':'red'})">${escH(t.testN(r.idx))} · ${escH(r.pass?t.examplePass:t.exampleFail)}</span>
      </div></div>
      <div class="test-col">
        <div style="font-size:9px;color:var(--text-muted);margin-bottom:4px">${escH(t.expectedOut)}</div>
        <pre>${escH(r.expected)}</pre>
      </div>
      <div class="test-col">
        <div style="font-size:9px;color:var(--text-muted);margin-bottom:4px">${escH(t.yourOut)}</div>
        ${gotCell}
      </div>
    </div>`;
  }).join('');

  document.getElementById('results-body').innerHTML = `
    <div class="score-summary">
      <span class="score-num ${sc}">${pct}%</span>
      <div>
        <div style="font-size:13px;font-weight:600">${passed===total?t.allPass:passed>0?t.somePass:t.nonePass}</div>
        <div style="font-size:11px;color:var(--text-muted)">${t.passDetail(passed, total)}</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${rows}`;
}

function clearEditor() { editor.setValue(''); editor.focus(); }

// 解答資料 680KB，首次按「載入解答」時才動態載入（data/judge-solutions.js 宣告 const SOLUTIONS）
let _solutionsLoading = null;
function ensureSolutions() {
  if (typeof SOLUTIONS !== 'undefined') return Promise.resolve();
  if (_solutionsLoading) return _solutionsLoading;
  _solutionsLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'data/judge-solutions.js?v=' + DATA_VER;
    s.onload = res;
    s.onerror = () => { _solutionsLoading = null; s.remove(); rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return _solutionsLoading;
}

async function loadSample() {
  if (!currentProblem || !currentLang) { alert(T().alertPickFirst); return; }
  const problem = currentProblem, lang = currentLang;
  try {
    await ensureSolutions();
  } catch (e) {
    alert(T().alertSolLoadFail);
    return;
  }
  if (currentProblem !== problem || currentLang !== lang) return;
  const sol = SOLUTIONS[lang][problem.id];
  if (!sol) { alert(T().alertNoSolution); return; }
  if (!confirm(T().confirmLoadSol)) return;
  editor.setValue(sol);
  editor.focus();
  if (typeof LearningState !== 'undefined') LearningState.recordJudgeSolutionLoaded(problem.id, lang);
}

const MAX_HINT_LAYERS = 8;
const hintLevelByKey = new Map();
let activeHintDialog = null;
let hintReturnFocus = null;

function hintStateKey(problemId, lang) { return String(lang || '') + '_' + String(problemId || ''); }
function getHintLevelUsed(problemId, lang) { return hintLevelByKey.get(hintStateKey(problemId, lang)) || 0; }

function splitHintLayers(hint) {
  const text = String(hint || '').trim();
  if (!text) return [];
  let parts = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (parts.length === 1) {
    const sentences = (text.match(/[^。！？；!?]+[。！？；!?]?/g) || []).map(s => s.trim()).filter(Boolean);
    if (sentences.length > 1) parts = sentences;
  }
  if (parts.length > MAX_HINT_LAYERS) parts = parts.slice(0, MAX_HINT_LAYERS - 1).concat(parts.slice(MAX_HINT_LAYERS - 1).join('\n'));
  return parts;
}

function rememberHintLevel(level) {
  if (!activeHintDialog) return;
  const next = Math.max(1, Math.min(level, activeHintDialog.layers.length));
  activeHintDialog.level = next;
  hintLevelByKey.set(activeHintDialog.key, Math.max(getHintLevelUsed(activeHintDialog.problem.id, activeHintDialog.lang), next));
  if (typeof LearningState !== 'undefined') LearningState.recordJudgeHint(activeHintDialog.problem.id, activeHintDialog.lang, next);
}

function renderHintDialog() {
  if (!activeHintDialog) return;
  const t = T(), shown = activeHintDialog.layers.slice(0, activeHintDialog.level);
  document.getElementById('hint-content').innerHTML = shown.map((layer, i) =>
    `<section class="hint-layer" aria-label="${escAttr(t.hintLevel(i + 1, activeHintDialog.layers.length))}">${safeMarkdown(layer)}</section>`
  ).join('');
  document.getElementById('hint-level-status').textContent = t.hintLevel(activeHintDialog.level, activeHintDialog.layers.length);
  const next = document.getElementById('hint-next');
  next.textContent = t.hintNext;
  next.hidden = activeHintDialog.level >= activeHintDialog.layers.length;
  document.getElementById('hint-done').textContent = t.hintDone;
}

function showHint() {
  if (!currentProblem || !currentLang) return;
  const layers = splitHintLayers(pv(currentProblem, 'hint'));
  if (!layers.length) return;
  const key = hintStateKey(currentProblem.id, currentLang);
  activeHintDialog = { problem:currentProblem, lang:currentLang, key, layers, level:Math.max(1, Math.min(getHintLevelUsed(currentProblem.id, currentLang) || 1, layers.length)) };
  hintReturnFocus = document.activeElement && typeof document.activeElement.focus === 'function' ? document.activeElement : document.getElementById('hint-btn');
  rememberHintLevel(activeHintDialog.level);
  const overlay = document.getElementById('hint-overlay');
  overlay.style.display = 'flex';
  overlay.setAttribute('aria-hidden', 'false');
  renderHintDialog();
  requestAnimationFrame(() => document.getElementById('hint-dialog').focus());
}

function revealNextHint() {
  if (!activeHintDialog || activeHintDialog.level >= activeHintDialog.layers.length) return;
  rememberHintLevel(activeHintDialog.level + 1);
  renderHintDialog();
  const target = activeHintDialog.level < activeHintDialog.layers.length ? document.getElementById('hint-next') : document.getElementById('hint-done');
  target.focus();
}

function isHintOpen() {
  const overlay = document.getElementById('hint-overlay');
  return !!(overlay && overlay.style.display !== 'none');
}

function refreshHintLanguage() {
  if (!activeHintDialog) return;
  const layers = splitHintLayers(pv(activeHintDialog.problem, 'hint'));
  if (!layers.length) { hideHint(); return; }
  activeHintDialog.layers = layers;
  activeHintDialog.level = Math.min(activeHintDialog.level, layers.length);
  renderHintDialog();
}

function hideHint(restoreFocus = true) {
  const overlay = document.getElementById('hint-overlay');
  if (!overlay || overlay.style.display === 'none') return;
  overlay.style.display = 'none';
  overlay.setAttribute('aria-hidden', 'true');
  activeHintDialog = null;
  const target = hintReturnFocus;
  hintReturnFocus = null;
  if (restoreFocus && target && target.isConnected && typeof target.focus === 'function') target.focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && isHintOpen()) { e.preventDefault(); hideHint(); }
});

// ── 手機版面板切換 ────────────────────────────────────────────────────────────
function isMobileView() { return window.matchMedia('(max-width:960px)').matches; }
function setMobileView(v) {
  const layout = document.querySelector('.layout');
  if (!layout) return;
  layout.dataset.mview = v;
  ['list','prob','code'].forEach(k => {
    const b = document.getElementById('mnav-' + k);
    if (b) b.classList.toggle('on', k === v);
  });
  if (v === 'code' && editor) setTimeout(() => editor.refresh(), 0);
}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  return escH(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function safeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(String(url), window.location.href);
    return ['http:', 'https:'].includes(u.protocol) ? u.href : '';
  } catch (_) {
    return '';
  }
}

function safeMarkdown(text) {
  const escaped = escH(text).replace(/~/g, '&#126;');
  return marked.parse(escaped).replace(/&amp;(lt|gt|amp|#126);/g, '&$1;');
}
