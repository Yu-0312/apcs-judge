<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--sidebar-bg:#161b22;--panel-bg:#1c2128;
  --border:#30363d;--text:#e6edf3;--text-muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;
  --py:#3fb950;--cpp:#79c0ff;--c-col:#ffa657;--java:#d2a8ff;
  --lang-color:var(--py);
  --header-h:56px;--tab-h:40px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
header{height:var(--header-h);display:flex;align-items:center;padding:0 20px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0}
.logo{font-size:17px;font-weight:700;color:var(--lang-color);transition:color .2s}
.lang-tabs{height:var(--tab-h);display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.lang-tab{display:flex;align-items:center;gap:6px;padding:0 16px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .15s}
.lang-tab:hover{color:var(--text);background:var(--hover-bg)}
.lang-tab.active-py{color:var(--py);border-color:var(--py);background:rgba(63,185,80,.05)}
.lang-tab.active-cpp{color:var(--cpp);border-color:var(--cpp);background:rgba(121,192,255,.05)}
.lang-tab.active-c{color:var(--c-col);border-color:var(--c-col);background:rgba(255,166,87,.05)}
.lang-tab.active-java{color:var(--java);border-color:var(--java);background:rgba(210,168,255,.05)}
.btn-run{background:var(--lang-color);color:var(--button-on-accent);transition:background .2s}
.sub{font-size:12px;color:var(--text-muted)}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-muted)}
.hright a{color:var(--text-muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:5px}
.hright a:hover{color:var(--text);border-color:var(--text-muted)}
.hbtn{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px}
.hbtn:hover{border-color:var(--text-muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite}
.status-dot.ready{background:var(--green);animation:none}
.ldbar{display:inline-block;width:72px;height:4px;border-radius:2px;background:var(--track-bg);overflow:hidden;vertical-align:middle;margin-left:6px}
.ldbar i{display:block;width:40%;height:100%;background:var(--yellow);border-radius:2px;animation:ldslide 1.2s ease-in-out infinite}
@keyframes ldslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.layout{display:grid;grid-template-columns:260px 1fr 1fr;height:calc(100vh - var(--header-h) - var(--tab-h));overflow:hidden}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-hdr{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
.chap-list{overflow-y:auto;flex:1}
.chap{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,.5);font-size:13px;transition:background .12s}
.sec-header{margin:14px 0 6px;padding:8px 10px;background:linear-gradient(90deg,rgba(88,166,255,.12),transparent);border-left:3px solid var(--py);border-radius:4px}
.sec-header:first-child{margin-top:0}
.sec-label{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.3px}
.sec-desc{font-size:10.5px;color:var(--text-muted);margin-top:2px;line-height:1.4}

.chap:hover{background:var(--hover-bg)}
.chap.active{background:var(--strong-hover-bg);border-left:2px solid var(--lang-color);padding-left:12px;transition:border-color .2s}
.chap-num{font-size:10px;color:var(--text-muted);font-weight:600}
.chap-title{font-weight:500;margin-top:2px}
.lesson-panel{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-hdr{padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel-bg);font-size:12px;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
.lesson-body{overflow-y:auto;flex:1;padding:20px 24px;line-height:1.7;font-size:14px;color:var(--text-soft)}
.lesson-body h1{font-size:24px;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.lesson-body h2{font-size:18px;color:var(--lang-color);margin:22px 0 8px;transition:color .2s}
.lesson-body h3{font-size:15px;color:var(--text);margin:16px 0 6px}
.lesson-body h1,.lesson-body h2,.lesson-body h3{position:relative}
.heading-anchor{margin-left:8px;border:0;background:transparent;color:var(--text-muted);cursor:pointer;font-size:.72em;opacity:0;transition:opacity .12s,color .12s;vertical-align:middle}
.lesson-body h1:hover .heading-anchor,.lesson-body h2:hover .heading-anchor,.lesson-body h3:hover .heading-anchor,.heading-anchor:focus-visible{opacity:1}
.heading-anchor:hover{color:var(--lang-color)}
.heading-anchor.copied{opacity:1;color:var(--green)}
.lesson-body p{margin-bottom:10px}
.lesson-body ul,.lesson-body ol{margin:8px 0 12px 22px}
.lesson-body li{margin:4px 0}
.lesson-body code{background:var(--strong-hover-bg);padding:1px 6px;border-radius:3px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;color:var(--orange)}
.lesson-body pre{background:var(--code-bg);border:1px solid var(--border);padding:12px 14px;border-radius:6px;overflow-x:auto;margin:10px 0}
.lesson-body pre code{background:transparent;padding:0;color:var(--text-soft);font-size:12.5px}
.lesson-body table{border-collapse:collapse;margin:10px 0;font-size:13px}
.lesson-body th,.lesson-body td{padding:6px 12px;border:1px solid var(--border);text-align:left}
.lesson-body th{background:var(--panel-bg);font-weight:600}
.lesson-body blockquote{border-left:3px solid var(--yellow);padding:8px 12px;margin:10px 0;background:rgba(210,153,34,.08);color:var(--text-soft);border-radius:0 4px 4px 0}
.lesson-body .demo-btn{display:inline-block;background:var(--py);color:#000;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;margin:6px 0;text-decoration:none;border:none}
.editor-panel{display:flex;flex-direction:column;overflow:hidden}
.editor-toolbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--panel-bg);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-run:hover{filter:brightness(1.15)}
.btn-run:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-sec:hover{color:var(--text);border-color:var(--text-muted)}
.editor-wrap{flex:1;overflow:hidden}
.CodeMirror{height:100%!important;font-size:13px!important;font-family:'SFMono-Regular',Consolas,monospace!important;line-height:1.6!important}
.output-panel{border-top:1px solid var(--border);height:200px;overflow-y:auto;background:var(--code-bg);padding:10px 14px}
.output-hdr{font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.output-body{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;color:var(--text-soft);white-space:pre-wrap;line-height:1.5}
.input-area{padding:8px 14px;border-top:1px solid var(--border);background:var(--panel-bg);display:flex;gap:8px;align-items:center}
.input-area label{font-size:11px;color:var(--text-muted);font-weight:600}
.input-area textarea{flex:1;background:var(--code-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-family:monospace;font-size:11px;resize:vertical;min-height:32px;max-height:80px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.lesson-section{margin-bottom:18px}
.quiz{background:rgba(63,185,80,.06);border:1px solid rgba(63,185,80,.3);padding:12px 14px;border-radius:6px;margin:14px 0}
.quiz-q{font-weight:600;margin-bottom:8px;color:var(--py)}

/* === beginner-friendly upgrades === */
.top-utility{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--text-muted);margin-left:auto}
.mode-toggle{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:14px;cursor:pointer;user-select:none;transition:all .15s}
.mode-toggle:hover{border-color:var(--text-muted);color:var(--text)}
.mode-toggle.on{background:rgba(63,185,80,.12);border-color:var(--py);color:var(--py)}
.mode-toggle .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);transition:background .2s}
.mode-toggle.on .dot{background:var(--py)}
.progress-wrap{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-tint)}
.progress-bar{height:6px;background:var(--track-bg);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--py),#56d364);width:0%;transition:width .4s ease}
.progress-text{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:6px;letter-spacing:.3px}
.chap{position:relative}
.chap.done .chap-title::after{content:" ✓";color:var(--green);font-weight:700;font-size:11px}
.chap.locked{opacity:.4;cursor:not-allowed}
.chap.locked::after{content:"🔒";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px;opacity:.7}
.chap.locked:hover{background:transparent}
.learn-box{background:rgba(121,192,255,.06);border-left:3px solid var(--cpp);padding:10px 14px;margin:14px 0;border-radius:0 5px 5px 0}
.learn-box .lh{font-size:11px;color:var(--cpp);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.learn-box ul{margin:4px 0 0 18px}
.learn-box li{font-size:13.5px;color:var(--text-soft);margin:3px 0}
.try-box{background:rgba(210,153,34,.07);border-left:3px solid var(--yellow);padding:10px 14px;margin:14px 0;border-radius:0 5px 5px 0}
.try-box .lh{font-size:11px;color:var(--yellow);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.try-box ol{margin:4px 0 0 22px}
.try-box li{font-size:13px;color:var(--text-soft);margin:5px 0;line-height:1.55}
.try-box code{background:var(--strong-hover-bg);padding:1px 5px;border-radius:3px;font-size:12px;color:var(--orange)}
.real-box{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.25);padding:14px;margin:16px 0;border-radius:6px}
.real-box .lh{font-size:11px;color:var(--cpp);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.real-box p{font-size:13.5px;color:var(--text-soft);margin:0 0 10px}
.real-code{background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:10px 12px;overflow-x:auto;font-size:12px;color:var(--text-soft);white-space:pre}
.quiz-box{background:rgba(63,185,80,.05);border:1px solid rgba(63,185,80,.25);padding:14px;margin:20px 0;border-radius:6px}
.quiz-box .lh{font-size:11px;color:var(--py);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.quiz-q{margin:14px 0 8px;font-weight:600;color:var(--text);font-size:13.5px}
.quiz-q:first-of-type{margin-top:0}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surface-tint);border:1px solid var(--border);padding:8px 12px;border-radius:5px;margin:4px 0;color:var(--text-soft);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.quiz-opt:hover:not(.locked){border-color:var(--text-muted);background:var(--hover-bg)}
.quiz-opt.correct{background:rgba(63,185,80,.18);border-color:var(--py);color:#fff}
.quiz-opt.wrong{background:rgba(248,81,73,.15);border-color:var(--red);color:#fff}
.quiz-opt.locked{cursor:default}
.quiz-explain{font-size:12px;color:var(--text-muted);margin:6px 0 10px;padding:8px 12px;background:rgba(0,0,0,.2);border-radius:4px;border-left:2px solid var(--text-muted)}
.quiz-status{font-size:12px;margin-top:12px;padding:8px 12px;border-radius:4px;text-align:center;font-weight:600}
.quiz-status.pass{background:rgba(63,185,80,.18);color:var(--py)}
.quiz-status.fail{background:rgba(248,81,73,.12);color:var(--red)}
.cq-task{font-size:13.5px;line-height:1.6;color:var(--text);margin-bottom:12px}
.cq-pyhint{background:rgba(255,193,7,.1);border-left:3px solid #ffc107;padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:#f0d878;border-radius:4px;line-height:1.5}
.cq-task code{background:var(--strong-hover-bg);padding:1px 5px;border-radius:3px;font-size:12.5px}
.cq-row{display:flex;gap:10px;margin-bottom:10px}
.cq-col{flex:1;min-width:0}
.cq-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cq-io{background:var(--code-bg);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-soft);margin:0;white-space:pre;overflow-x:auto}
.cq-none{font-size:12px;color:var(--text-muted)}
.cq-btn{background:var(--py);color:var(--button-on-accent);border:none;padding:8px 16px;border-radius:5px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;margin-top:4px}
.cq-btn:hover:not(:disabled){filter:brightness(1.1)}
.cq-btn:disabled{opacity:.6;cursor:wait}
.quiz-status.fail pre.cq-io{margin-top:6px}
.cq-diff{text-align:left}
.cq-diff .cq-line{display:block;min-height:1.4em}
.cq-diff .cq-line.bad{background:rgba(248,81,73,.22);border-radius:2px}
.cq-diff .cq-line small{color:var(--text-muted);font-weight:400}
.cq-diff-at{font-size:11px;margin-top:6px;text-align:left;font-weight:400}
.err-hint{margin-top:10px;padding:10px 12px;background:rgba(248,81,73,.08);border-left:3px solid var(--red);border-radius:0 4px 4px 0;font-size:12px;color:#ffb1ad;line-height:1.55}
.err-hint b{color:#ffd1ce}
.reading-drill{background:rgba(188,140,255,.05);border:1px solid rgba(188,140,255,.28);border-radius:6px;margin:20px 0;overflow:hidden}
.reading-drill summary{cursor:pointer;padding:12px 14px;color:var(--purple);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;list-style:none}
.reading-drill summary::-webkit-details-marker{display:none}
.reading-drill summary::after{content:"▾";float:right;color:var(--text-muted);transition:transform .15s}
.reading-drill[open] summary::after{transform:rotate(180deg)}
.reading-body{padding:0 14px 14px}
.reading-code{background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:9px 10px;overflow-x:auto;font-size:11.5px;color:var(--text-soft);white-space:pre;margin:8px 0}
.reading-meta{font-size:11px;color:var(--text-muted);margin-top:4px}
.intro-card{background:linear-gradient(135deg,rgba(63,185,80,.08),rgba(121,192,255,.06));border:1px solid rgba(63,185,80,.3);padding:16px 18px;border-radius:8px;margin:14px 0}
.intro-card h3{margin-top:0;color:var(--py)}
.intro-card p{font-size:13.5px;margin:6px 0}
.chapter-complete{display:flex;align-items:flex-start;gap:10px;background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.28);border-radius:7px;padding:12px 14px;margin:20px 0}
.chapter-complete input{margin-top:3px;width:17px;height:17px;accent-color:var(--green)}
.chapter-complete label{font-size:13px;color:var(--text-soft);cursor:pointer;line-height:1.55}
.chapter-complete label b{display:block;color:var(--text);font-size:13.5px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* === focus / keyboard accessibility === */
.lang-tab:focus-visible,.chap:focus-visible,.btn:focus-visible,.quiz-opt:focus-visible,.cq-btn:focus-visible{outline:2px solid var(--lang-color);outline-offset:-2px}

/* === responsive: tablet === */
@media (min-width:961px) and (max-width:1180px){
  .layout{grid-template-columns:220px 1fr 1fr}
}

/* === responsive: mobile === */
#mobile-nav{display:none}
@media (max-width:960px){
  :root{--mnav-h:54px}
  header{padding:0 12px;gap:8px}
  header .sub{display:none}
  .logo{font-size:15px;white-space:nowrap}
  .hright{gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none}
  .hright::-webkit-scrollbar{display:none}
  .hright>*{flex-shrink:0}
  .hright a{padding:4px 8px;white-space:nowrap}
  #status-text{display:none}
  .lang-tabs{overflow-x:auto}
  .lang-tab{padding:0 12px;font-size:11.5px;white-space:nowrap}

let CHAPTERS_EN_MAP = null;
let _enDataLoading = null;
function ensureEnData(){
  if (CHAPTERS_EN_MAP) return Promise.resolve();
  if (_enDataLoading) return _enDataLoading;
  _enDataLoading = Promise.all(['data/tutorial-chapters-en.js?v=20260717b', 'data/tutorial-lang-content-en.js?v=20260717b'].map(src =>
    new Promise((res, rej) => {

      s.onerror = () => { s.remove(); rej(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    })
  )).then(() => {
    CHAPTERS_EN_MAP = Object.fromEntries(CHAPTERS_EN_RAW.map(c=>[c.id,c]));
  }).catch(e => { _enDataLoading = null; throw e; });
  return _enDataLoading;
}

let cm = null;
let currentChap = null;
let currentLang = 'py';

// ── Python（Web Worker 執行，逾時可中斷，不會凍結頁面） ──────────────────────
const PY_TIMEOUT_MS = 30000;
const OUTPUT_LIMIT_CHARS = 200000;
let pyWorker = null, pyReady = false, pyFailed = false, pyReadyPromise = null;
let pyJobSeq = 0;
const pyJobs = new Map();

const PY_WRAPPER = [
  'import sys, io, traceback',
  'class _LimitedIO(io.StringIO):',
  '    def __init__(self, limit):',
  '        super().__init__(); self.limit = limit; self.truncated = False',
  '    def write(self, s):',
  '        s = str(s); left = self.limit - self.tell()',
  '        if left <= 0: self.truncated = True; return len(s)',
  '        if len(s) > left: self.truncated = True',
  '        super().write(s[:left]); return len(s)',
  '__out = _LimitedIO(200000); __err = _LimitedIO(200000)',
  '__old = (sys.stdin, sys.stdout, sys.stderr)',
  "__t = __stdin if (__stdin == '' or __stdin.endswith('\\n')) else __stdin + '\\n'",
  'sys.stdin = io.StringIO(__t); sys.stdout = __out; sys.stderr = __err',
  'try:',
  "    exec(compile(__code, '<user>', 'exec'), {'__name__': '__main__'})",
  'except SystemExit:',
  '    pass',
  'except BaseException:',
  '    traceback.print_exc(file=__err)',
  'finally:',
  '    sys.stdin, sys.stdout, sys.stderr = __old',
  '__r_out = __out.getvalue(); __r_err = __err.getvalue(); __r_truncated = __out.truncated or __err.truncated'
].join('\n');

const PY_WORKER_SRC =
  "importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');\n" +
  "const ready = loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });\n" +
  "ready.then(() => postMessage({ type: 'ready' }), (e) => postMessage({ type: 'ready', error: String(e) }));\n" +
  'const WRAP = ' + JSON.stringify(PY_WRAPPER) + ';\n' +
  'onmessage = async (e) => {\n' +
  '  const { id, code, stdin } = e.data;\n' +
  '  try {\n' +
  '    const py = await ready;\n' +
  "    py.globals.set('__code', code);\n" +
  "    py.globals.set('__stdin', stdin);\n" +
  '    await py.runPythonAsync(WRAP);\n' +
  "    postMessage({ id, out: py.globals.get('__r_out') || '', err: py.globals.get('__r_err') || '', truncated: !!py.globals.get('__r_truncated') });\n" +
  '  } catch (err) {\n' +
  "    postMessage({ id, out: '', err: String(err) });\n" +
  '  }\n' +
  '};\n';

function startPyWorker() {
  const blob = new Blob([PY_WORKER_SRC], { type: 'text/javascript' });
  const workerUrl = URL.createObjectURL(blob);
  try { pyWorker = new Worker(workerUrl); }
  finally { URL.revokeObjectURL(workerUrl); }
  pyReady = false;
  pyReadyPromise = new Promise((resolve, reject) => {
    pyWorker.onmessage = (e) => {
      const d = e.data || {};
      if (d.type === 'ready') {
        if (d.error) reject(new Error(d.error));
        else { pyReady = true; resolve(); }
        return;
      }
      const job = pyJobs.get(d.id);
      if (job) { pyJobs.delete(d.id); clearTimeout(job.timer); job.resolve(d); }
    };
    pyWorker.onerror = (e) => reject(new Error((e && e.message) || 'Worker error'));
  });
  return pyReadyPromise;
}

function killPyWorker() {
  if (pyWorker) pyWorker.terminate();
  pyWorker = null; pyReady = false; pyReadyPromise = null;
  for (const [, job] of pyJobs) { clearTimeout(job.timer); job.reject(new Error('terminated')); }
  pyJobs.clear();
}

async function runPython(code, stdin, timeoutMs) {
  if (!pyWorker) initPython();
  await pyReadyPromise;
  const w = pyWorker;
  return await new Promise((resolve, reject) => {
    const id = ++pyJobSeq;
    const timer = setTimeout(() => {
      pyJobs.delete(id);
      killPyWorker();
      initPython(); // 自動重建環境（背景重新下載，快取後很快）
      reject(new Error('PY_TIMEOUT'));
    }, timeoutMs);
    pyJobs.set(id, { resolve, reject, timer });
    w.postMessage({ id, code, stdin });
  });
}

function initPython() {
  if (pyWorker) return pyReadyPromise;
  pyFailed = false;
  const ldbar = document.getElementById('py-ldbar');
  if (ldbar) ldbar.style.display = 'inline-block';
  document.getElementById('status-dot').classList.remove('ready');

// 章節可見性：每個語言模式下只顯示適用的章節
// - py-only: 第 36–67 章（爬蟲 / pandas / Bot / pygame，Python 套件專屬）
// - cpp-only: 第 71–78 章（C++ 專項：STL / RAII / move 等）
// - c-only: 第 79–86 章（C 專項：指標 / malloc / Makefile 等）
// - java-only: 第 87–94 章（Java 專項：Collections / Stream / JVM 等）
const CHAP_LANG_VISIBILITY = (() => {
  const m = new Map();
  for(let i = 36; i <= 67; i++) m.set(i, new Set(['py']));
  for(let i = 71; i <= 78; i++) m.set(i, new Set(['cpp']));
  for(let i = 79; i <= 86; i++) m.set(i, new Set(['c']));
  for(let i = 87; i <= 94; i++) m.set(i, new Set(['java']));
  m.set(95, new Set(['py']));   // 物件模型（Python 專屬）
  m.set(96, new Set(['py']));   // 函式參數進階（Python 專屬）
  // 97 讀官方文件：所有語言可見
  return m;
})();
function isChapAvailable(id, lang){
  const allowed = CHAP_LANG_VISIBILITY.get(id);
  return !allowed || allowed.has(lang);
}

// 在非 py 模式下，把專項章節放在基礎 0–35 之後（顯示 36+），
// 高級題 68–70 排到最後。同時提供 id → 顯示章號的映射。
const _displayNumMap = new Map();
function getOrderedVisibleChapters(lang){
  const visible = CHAPTERS.filter(c => isChapAvailable(c.id, lang));
  if(lang === 'py') return visible;
  // 非 py：[0–35 基礎] → [71+ 該語言專項] → [68–70 高級題]
  return [
    ...visible.filter(c => c.id <= 35),
    ...visible.filter(c => c.id >= 71),
    ...visible.filter(c => c.id >= 68 && c.id <= 70),
  ];
}
function rebuildDisplayNumMap(){
  _displayNumMap.clear();
  if(currentLang === 'py') return;
  const ordered = getOrderedVisibleChapters(currentLang);
  ordered.forEach((c, i) => _displayNumMap.set(c.id, i));
}
function chapDisplayNum(id){
  return _displayNumMap.has(id) ? _displayNumMap.get(id) : id;
}

function switchLang(lang){
  flushDraft(); // 先保存目前語言下的草稿
  currentLang = lang;
  const cfg = LANG_CFG[lang];
  document.documentElement.style.setProperty('--lang-color', cfg.color);
  ['py','cpp','c','java'].forEach(l=>{
    document.getElementById('ltab-'+l).className = 'lang-tab' + (l===lang ? ' active-'+l : '');
  });
  document.getElementById('lang-note').textContent = uiLang === 'en' ? cfg.noteEn : cfg.note;
  const verEl = document.getElementById('lang-ver');
  if(verEl) verEl.textContent = cfg.ver;
  cm.setOption('mode', cfg.mode);
  if(typeof renderChapList === 'function') renderChapList();
  if(typeof updateProgress === 'function') updateProgress();
  // 若當前章節在新語言下不可見，跳到最近的可見章節
  if(currentChap && !isChapAvailable(currentChap.id, lang)){
    const visible = CHAPTERS.filter(c => isChapAvailable(c.id, lang));
    if(visible.length){
      // 找最接近的（不超過 currentChap.id 的最大者，否則取第一個）
      let target = visible.filter(c => c.id <= currentChap.id).pop() || visible[0];
      selectChap(target.id);
    }
  } else if(currentChap){
    selectChap(currentChap.id);
  }
}

function getExample(chap){
  if(currentLang==='py'){
    if(hasEN(chap)) return chEN(chap).example || chap.example;
    return chap.example;
  }
  const ex = MULTI_EXAMPLES[chap.id];
  const fallback = uiLang==='en'
    ? `// ${LANG_CFG[currentLang].name} example for this chapter is not ready yet\n// The concepts are the same as Python — see the lesson on the left`
    : `// 此章節的 ${LANG_CFG[currentLang].name} 範例尚未補齊\n// 概念與 Python 相同，請參考左側教學內容`;
  return (ex && ex[currentLang]) || fallback;
}
function getStdin(chap){
  if(currentLang==='py'){
    if(hasEN(chap)) return (chEN(chap).stdin) || chap.stdin || '';
    return chap.stdin || '';
  }
  const ex = MULTI_EXAMPLES[chap.id];
  return (ex && ex[currentLang+'_stdin']) || chap.stdin || '';
}

// ── 常見錯誤訊息翻譯 ─────────────────────────────────────────────────────
function translateError(raw){
  if(!raw) return '';
  const lines = raw.split('\n');
  let last = '';
  for(let i = lines.length - 1; i >= 0; i--){
    if(lines[i].trim()){ last = lines[i]; break; }
  }
  const rules = [
    {re:/NameError: name '(.+?)' is not defined/,
     msg:(m)=>`<b>變數沒定義</b>：你用了 <code>${m[1]}</code>，但前面從沒設定它的值。檢查拼字、或在使用前先 <code>${m[1]} = ...</code>。`,
     msgEn:(m)=>`<b>Variable not defined</b>: you used <code>${m[1]}</code>, but it was never assigned. Check the spelling, or set <code>${m[1]} = ...</code> before using it.`},
    {re:/IndentationError|unexpected indent|expected an indented block/,
     msg:()=>`<b>縮排錯了</b>：Python 用空白來分組，<code>if</code>/<code>for</code>/<code>def</code> 下一行一定要往內縮 4 個空白。同一段也要對齊。`,
     msgEn:()=>`<b>Indentation error</b>: Python groups code by whitespace — the line after <code>if</code>/<code>for</code>/<code>def</code> must be indented 4 spaces, and the same block must line up.`},
    {re:/SyntaxError: invalid syntax/,
     msg:()=>`<b>語法錯誤</b>：通常是漏冒號 <code>:</code>、漏括號、引號沒成對。看一下錯誤指到的那一行附近。`,
     msgEn:()=>`<b>Syntax error</b>: usually a missing colon <code>:</code>, missing bracket, or unmatched quotes. Check around the line the error points to.`},
    {re:/SyntaxError: EOL while scanning string literal|unterminated string/,
     msg:()=>`<b>字串沒收尾</b>：開了 <code>"</code> 或 <code>'</code> 但沒關起來。`,
     msgEn:()=>`<b>Unterminated string</b>: you opened a <code>"</code> or <code>'</code> but never closed it.`},
    {re:/ZeroDivisionError/,
     msg:()=>`<b>除以 0 了</b>：檢查除號右邊的值是不是 0，或先用 if 擋掉。`,
     msgEn:()=>`<b>Division by zero</b>: check whether the right side of the division is 0, or guard it with an if first.`},
    {re:/TypeError: unsupported operand type.*'(\w+)'.* and '(\w+)'/,
     msg:(m)=>`<b>型別不能相加 / 相減</b>：<code>${m[1]}</code> 和 <code>${m[2]}</code> 不能直接運算。常見：字串 + 數字 → 要先 <code>str()</code> 或 <code>int()</code>。`,
     msgEn:(m)=>`<b>Incompatible types</b>: <code>${m[1]}</code> and <code>${m[2]}</code> cannot be combined directly. Common case: string + number → convert with <code>str()</code> or <code>int()</code> first.`},
    {re:/TypeError: '(\w+)' object is not (subscriptable|iterable|callable)/,
     msg:(m)=>`<b>型別錯用</b>：<code>${m[1]}</code> 物件不能被「${m[2]==='subscriptable'?'用 []':m[2]==='iterable'?'用 for 走訪':'呼叫'}」。`,
     msgEn:(m)=>`<b>Wrong type usage</b>: a <code>${m[1]}</code> object cannot be ${m[2]==='subscriptable'?'indexed with []':m[2]==='iterable'?'looped over with for':'called like a function'}.`},
    {re:/TypeError/,
     msg:()=>`<b>型別錯誤</b>：兩邊型別不合（例如字串 + 數字）。用 <code>int(x)</code> / <code>str(x)</code> 轉換看看。`,
     msgEn:()=>`<b>Type error</b>: the types don't match (e.g. string + number). Try converting with <code>int(x)</code> / <code>str(x)</code>.`},
    {re:/ValueError: invalid literal for int\(\)/,
     msg:()=>`<b>int() 收到不是數字的字串</b>：例如 <code>int("abc")</code> 會錯。檢查 input 是不是有空白或非數字字元。`,
     msgEn:()=>`<b>int() got a non-numeric string</b>: e.g. <code>int("abc")</code> fails. Check whether the input has spaces or non-digit characters.`},
    {re:/ValueError/,
     msg:()=>`<b>值不合法</b>：函式收到它不接受的值。看看你傳了什麼。`,
     msgEn:()=>`<b>Invalid value</b>: a function received a value it cannot accept. Check what you passed in.`},
    {re:/IndexError: list index out of range/,
     msg:()=>`<b>list 索引超出範圍</b>：list 只有 0 到 len(list)-1。檢查迴圈條件是不是寫成 <code><=</code> 變成多跑一格。`,
     msgEn:()=>`<b>List index out of range</b>: valid indexes are 0 to len(list)-1. Check whether a loop condition uses <code><=</code> and runs one step too far.`},
    {re:/IndexError/,
     msg:()=>`<b>索引超出範圍</b>：要存取的位置不存在。`,
     msgEn:()=>`<b>Index out of range</b>: the position you tried to access does not exist.`},
    {re:/KeyError: '?(.+?)'?$/,
     msg:(m)=>`<b>字典找不到這個 key</b>：<code>${m[1]}</code> 不在字典裡。用 <code>d.get(key, 預設值)</code> 比較安全。`,
     msgEn:(m)=>`<b>Key not found in dict</b>: <code>${m[1]}</code> is not in the dictionary. <code>d.get(key, default)</code> is safer.`},
    {re:/AttributeError: '(\w+)' object has no attribute '(\w+)'/,
     msg:(m)=>`<b>物件沒這個方法</b>：<code>${m[1]}</code> 沒有 <code>.${m[2]}()</code>。檢查拼字，或是不是用錯型別（例如把 str 當 list 用）。`,
     msgEn:(m)=>`<b>No such attribute</b>: <code>${m[1]}</code> has no <code>.${m[2]}()</code>. Check the spelling, or whether you're using the wrong type (e.g. treating a str as a list).`},
    {re:/RecursionError/,
     msg:()=>`<b>遞迴太深</b>：函式呼叫自己沒有終止條件，或終止條件永遠到不了。檢查 base case。`,
     msgEn:()=>`<b>Recursion too deep</b>: the function calls itself without a base case, or the base case is never reached. Check your base case.`},
    {re:/ModuleNotFoundError|ImportError/,
     msg:()=>`<b>找不到模組</b>：可能是這個套件瀏覽器版 Python 沒有。試試標準函式庫的功能。`,
     msgEn:()=>`<b>Module not found</b>: this package may not exist in the browser build of Python. Try the standard library instead.`}
  ];
  for(const r of rules){
    const m = last.match(r.re);
    if(m) return `<div class="err-hint">💡 ${(uiLang === 'en' && r.msgEn) ? r.msgEn(m) : r.msg(m)}</div>`;
  }
  return '';
}

let beginnerMode = true;

function announceTutorial(msg){const el=document.getElementById('tutorial-status');if(el)el.textContent=msg||'';}

// ── 編輯器草稿自動保存（per 章節 + 語言；切章、切語言、重整都不會弄丟程式碼） ─
const DRAFTS_KEY = 'tut_drafts_v1';
const PROGRESS_IMPORT_MAX_BYTES = 12 * 1024 * 1024;
const MAX_TUTORIAL_DRAFTS = CHAPTERS.length * 4;
const MAX_TUTORIAL_DRAFT_CHARS = 200000;
const VALID_TUTORIAL_CHAPTER_IDS = new Set(CHAPTERS.map(chapter=>chapter.id));
function validTutorialDraftKey(key){
  const match=typeof key==='string'&&key.match(/^(\d{1,3})_(py|cpp|c|java)$/);
  return !!(match&&VALID_TUTORIAL_CHAPTER_IDS.has(Number(match[1])));
}
function sanitizeTutorialDrafts(value, strict){
  if(!value||typeof value!=='object'||Array.isArray(value)){
    if(strict)throw new Error('bad drafts');
    return {};
  }
  const entries=Object.entries(value);
  if(entries.length>MAX_TUTORIAL_DRAFTS){
    if(strict)throw new Error('too many drafts');
    entries.length=MAX_TUTORIAL_DRAFTS;
  }
  const clean={};
  for(const [key,draft] of entries){
    const valid=validTutorialDraftKey(key)&&typeof draft==='string'&&draft.length<=MAX_TUTORIAL_DRAFT_CHARS;
    if(!valid){if(strict)throw new Error('bad draft');continue;}
    if(draft.trim())clean[key]=draft;
  }
  return clean;
}
let drafts = {};
try {
  const _d = JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}');
  drafts = sanitizeTutorialDrafts(_d, false);
} catch(e) {}
let _draftKey = null;   // 目前編輯器內容所屬的 章id_語言
let _draftBase = null;  // 該章載入時的範例（與範例相同就不存草稿）
let draftTimer = null;
function scheduleDraftSave(){
  if(!_draftKey) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, 400);
}
function flushDraft(){
  clearTimeout(draftTimer); draftTimer = null;
  if(!_draftKey || !cm) return;
  const v = cm.getValue();
  if(v.trim() && v !== _draftBase) drafts[_draftKey] = v;
  else delete drafts[_draftKey];
  try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); } catch(e) {}
}
// 關閉/切走分頁時把防抖中的草稿立即寫入，避免最後 0.4 秒的輸入遺失
window.addEventListener('beforeunload', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
// 載入某章的草稿（沒有草稿就載入範例），並更新追蹤鍵
function loadDraftInto(chap){
  _draftKey = chap.id + '_' + currentLang;
  _draftBase = getExample(chap);
  cm.setValue(drafts[_draftKey] !== undefined ? drafts[_draftKey] : _draftBase);
}

// ── 進度匯出 / 匯入（換裝置、清快取時可帶走進度） ─────────────────────────
function exportProgress(){
  try{
    flushDraft(); // 草稿一併打包，換裝置時寫到一半的程式碼帶得走
    const isFull = typeof LearningState!=='undefined'&&typeof LearningState.exportBackup==='function';
    const data = isFull ? LearningState.exportBackup() : { app:'apcs-tutorial', v:2, exportedAt:new Date().toISOString(), done:[...completed], drafts };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = isFull ? `apcs-learning-backup-${new Date().toISOString().slice(0,10)}.json` : 'tutorial-progress.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }catch(err){alert(T().backupExportFail);}
}
function importProgress(){ document.getElementById('prog-file').click(); }
document.getElementById('prog-file').addEventListener('change', async e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  if(f.size>PROGRESS_IMPORT_MAX_BYTES){alert(T().progImportTooLarge);return;}
  try{
    const data = JSON.parse(await f.text());
    if(data.app==='apcs-learning-backup'){
      if(typeof LearningState==='undefined'||typeof LearningState.importBackup!=='function')throw new Error('backup unavailable');
      LearningState.importBackup(data);
      alert(T().backupImportOk);
      location.reload();
      return;
    }
    if(data.app !== 'apcs-tutorial' || !Array.isArray(data.done)) throw new Error('bad format');
    if(data.done.length>CHAPTERS.length||data.done.some(id=>!Number.isInteger(id)||!VALID_TUTORIAL_CHAPTER_IDS.has(id)))throw new Error('bad chapters');
    data.done.forEach(id=>completed.add(id));
    // 草稿合併：只補進本機沒有的（本機現有草稿優先，不被匯入檔覆蓋）
    if(data.drafts!==undefined){
      const incomingDrafts=sanitizeTutorialDrafts(data.drafts,true);
      for(const [k, v] of Object.entries(incomingDrafts)){
        if(drafts[k] === undefined) drafts[k] = v;
      }
      try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); } catch(e) {}
    }
    if(!saveState())throw new Error('STORAGE_FULL');
    updateProgress();
    renderChapList();
    alert(T().progImportOk.replace('{n}', String(completed.size)));
  }catch(err){

function readingCatForChapter(id){
  if(id <= 3) return ['基礎'];
  if(id <= 5) return ['流程','基礎'];
  if(id <= 8) return ['陣列字串'];
  if(id <= 10) return ['基礎','結構類別'];
  if(id <= 26 || (id >= 68 && id <= 70)) return ['演算法','函式遞迴','陣列字串'];
  if(id >= 98) return ['基礎','流程'];
  return ['基礎','流程','陣列字串'];
}
const _readingDrillCache = new Map();
function getReadingDrill(chapId){
  const key = chapId + ':' + currentLang;
  if(_readingDrillCache.has(key)) return _readingDrillCache.get(key);
  if(typeof TUTORIAL_READING_QUESTIONS === 'undefined') return [];
  const langMap = {py:'python', cpp:'cpp', c:'c', java:'java'};
  const lang = langMap[currentLang] || '';
  const cats = readingCatForChapter(chapId);
  const pool = TUTORIAL_READING_QUESTIONS.filter(q => {
    const langOk = !q.lang || q.lang === lang || (currentLang !== 'py' && q.lang === 'c' && (q.cat === '基礎' || q.cat === '流程'));
    return langOk && cats.includes(q.cat) && q.options && q.options.length === 4;
  });
  const fallback = TUTORIAL_READING_QUESTIONS.filter(q => (!q.lang || q.lang === lang) && q.options && q.options.length === 4);
  const src = pool.length >= 3 ? pool : fallback;
  const picked = [];
  for(let i = 0; i < src.length && picked.length < 3; i++){
    const q = src[(chapId * 7 + i * 13) % src.length];
    if(!picked.some(x => x.id === q.id)) picked.push(q);
  }
  _readingDrillCache.set(key, picked);
  return picked;
}
function renderReadingDrill(chap){

  const st = readingQuizState[chap.id] || {};
  let html = `<details class="reading-drill"><summary>${tTitle}</summary><div class="reading-body">`;
  qs.forEach((q, qi) => {
    const picked = st[q.id];
    html += `<div class="quiz-q">Q${qi + 1}. ${escapeHtml(q.q)}</div>`;
    if(q.code) html += `<pre class="reading-code">${escapeHtml(q.code)}</pre>`;
    html += `<div class="reading-meta">${escapeHtml([q.level, q.cat, q.topic].filter(Boolean).join(' · '))}</div>`;
    q.options.forEach((op, oi) => {
      let cls = 'quiz-opt', click = ` onclick="answerReadingQuiz(${chap.id},'${escapeHtml(q.id)}',${oi})"`;
      if(picked !== undefined){
        cls += ' locked'; click = '';
        if(oi === q.answer) cls += ' correct';
        else if(oi === picked) cls += ' wrong';
      }
      html += `<button class="${cls}"${click}>${escapeHtml(op)}</button>`;
    });
    if(picked !== undefined){
      const prefix = picked === q.answer ? (uiLang === 'en' ? '✅ Correct!' : '✅ 答對了！') : (uiLang === 'en' ? '❌ Not quite. Added to mistakes book.' : '❌ 不對喔，已加入錯題本。');
      html += `<div class="quiz-explain">${prefix} ${escapeHtml(q.explain || '')}</div>`;
    }
  });
  return html + '</div></details>';
}

    .trim()

  return base || 'section';
}

function enhanceLessonAnchors(body, chap){

    const raw = h.textContent.replace(/\s*🔗\s*$/, '');
    const slug = slugifyHeading(raw);
    const n = used.get(slug) || 0;
    used.set(slug, n + 1);

    btn.addEventListener('click', async e => {

// 逐行比對使用者輸出與預期輸出，差異行標紅並附「此行預期」提示
function renderOutputDiff(got, expect, t){
  const gotLines = normalizeOutput(got).split('\n');
  const wantLines = normalizeOutput(expect).split('\n');
  const n = Math.max(gotLines.length, wantLines.length);
  let firstBad = -1;
  let rows = '';
  for(let i = 0; i < n; i++){
    const g = i < gotLines.length ? gotLines[i] : null;
    const w = i < wantLines.length ? wantLines[i] : null;
    const same = g === w;
    if(!same && firstBad < 0) firstBad = i;
    if(g === null){
      rows += `<span class="cq-line bad"><i>${t.cqDiffMissing}</i> <small>← ${t.cqDiffExpected}：${escapeHtml(w)}</small></span>`;
    } else if(same){
      rows += `<span class="cq-line">${escapeHtml(g)}</span>`;
    } else if(w === null){
      rows += `<span class="cq-line bad">${escapeHtml(g)} <small>← ${t.cqDiffExtra}</small></span>`;
    } else {
      rows += `<span class="cq-line bad">${escapeHtml(g)} <small>← ${t.cqDiffExpected}：${escapeHtml(w)}</small></span>`;
    }
  }
  const at = firstBad >= 0 ? `<div class="cq-diff-at">${t.cqDiffAt.replace('{n}', firstBad + 1)}</div>` : '';
  return `${at}<pre class="cq-io cq-diff">${rows}</pre>`;
}

  }
}

const MAX_SOURCE_CHARS=100*1024;
const MAX_STDIN_CHARS=64*1024;
function limitRunnerOutput(value){
  const text=String(value||'');
  return {text:text.slice(0,OUTPUT_LIMIT_CHARS),truncated:text.length>OUTPUT_LIMIT_CHARS};
}
const JUDGE0_CONSENT_KEY='apcs_judge0_consent_v1';
function hasJudge0Consent(){try{return sessionStorage.getItem(JUDGE0_CONSENT_KEY)==='1';}catch(e){return false;}}
function requestJudge0Consent(){
  if(hasJudge0Consent())return true;
  if(!confirm(T().judgeDisclosure))return false;
  try{sessionStorage.setItem(JUDGE0_CONSENT_KEY,'1');}catch(e){}
  return true;
}
async function fetchWithTimeout(url,options,timeoutMs){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs||20000);
  try{return await fetch(url,Object.assign({},options||{},{signal:controller.signal}));}
  finally{clearTimeout(timer);}
}

async function executeCode(code, stdin, lang) {
  // returns {raw: full output text, stderr: boolean}
  if(String(code||'').length>MAX_SOURCE_CHARS)return{raw:T().errSourceLarge,stderr:true};
  if(String(stdin||'').length>MAX_STDIN_CHARS)return{raw:T().errInputLarge,stderr:true};
  if (lang === 'py') {
    try {
      const r = await runPython(code, stdin, PY_TIMEOUT_MS);
      const hasErr = !!(r.err && r.err.trim());
      const combined=limitRunnerOutput(r.out+(hasErr?(r.out?'\n':'')+r.err:''));
      const truncated=!!r.truncated||combined.truncated;
      return {raw:combined.text+(truncated?T().outputTruncated:''),stderr:hasErr||truncated};
    } catch (e) {
      if (e && e.message === 'PY_TIMEOUT') return { raw: T().pyTimeout, stderr: true };
      return { raw: String(e.message || e), stderr: true };
    }
  }
  // C / C++ / Java 走 Judge0 CE（Piston 公開 API 自 2026/02/15 起改白名單）
  if(!requestJudge0Consent())return{raw:T().judgeDeclined,stderr:true,cancelled:true};
  const JUDGE0_LANG = { cpp: 54, c: 50, java: 62 };
  try {
    const data = await judge0Submit(code, stdin, JUDGE0_LANG[lang]);
    // Judge0 status：3=正常結束, 5=TLE, 6=編譯錯誤, 7~12=執行期錯誤, 13/14=服務內部錯誤
    const sid = data.status && data.status.id;
    if (sid === 1 || sid === 2) return {raw: T().errService('request timeout'), stderr: true};
    if (sid === 5) return {raw: T().errTLE, stderr: true};
    if (sid === 6) { const compile=limitRunnerOutput(data.compile_output); return {raw:T().errCompile+compile.text+(compile.truncated?T().outputTruncated:''),stderr:true}; }
    if (sid >= 13) return {raw: T().errService((data.status && data.status.description) || sid), stderr: true};
    const stdout = limitRunnerOutput(data.stdout);
    const stderr = limitRunnerOutput(data.stderr || data.compile_output);
    const combined=limitRunnerOutput(stdout.text+(stderr.text?'\n[stderr]\n'+stderr.text:''));
    const truncated=stdout.truncated||stderr.truncated||combined.truncated;
    return {raw:combined.text+(truncated?T().outputTruncated:''),stderr:!!stderr.text||truncated};
  } catch (e) {
    return {raw: String(e.message || e), stderr: true};
  }
}

// 送交 Judge0；429（速率限制）與 5xx／網路錯誤時自動退避重試，共 3 次
async function judge0Submit(code, stdin, languageId) {
  const delays = [0, 1500, 4000];
  let lastErr = null;
  for (let attempt = 0; attempt < delays.length; attempt++) {
    if (delays[attempt]) await new Promise(r => setTimeout(r, delays[attempt]));
    let res;
    try {
      res = await fetchWithTimeout('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language_id: languageId, source_code: code, stdin: stdin || '', cpu_time_limit:5, wall_time_limit:10, memory_limit:262144, max_file_size:1024, ...(languageId === 50 ? { compiler_options: '-lm' } : {}) })
      },20000);
    } catch(e) {
      lastErr = T().errNet;
      continue;
    }
    if (res.status === 429) { lastErr = T().errBusy; continue; }
    if (res.status >= 500) { lastErr = T().err5xx(res.status); continue; }
    if (!res.ok) throw new Error(T().errResp(res.status));
    let data = await res.json();
    // wait=true 在服務忙碌時可能直接回 In Queue / Processing（status 1/2），改以 token 輪詢到完成
    for (let p = 0; p < 12 && data.status && data.status.id <= 2 && data.token; p++) {
      await new Promise(r => setTimeout(r, 1200));
      // 輪詢途中斷網不往外丟原始錯誤：中止輪詢，回傳目前已知狀態
      try {
        const r2 = await fetchWithTimeout('https://ce.judge0.com/submissions/' + data.token + '?base64_encoded=false',{},12000);
        if (!r2.ok) break;
        data = await r2.json();
      } catch (e) { break; }
    }
    return data;
  }
  throw new Error(lastErr || T().errNoResp);
}

let runBusy = false;
async function runCode() {
  if (runBusy) return; // 執行中不重複觸發（避免重疊送出 Judge0 / Pyodide）
  const code = cm.getValue();
  const stdin = document.getElementById('stdin-input').value;
  const out = document.getElementById('output-body');
  runBusy = true;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  out.textContent = T().running;
  try {
    const {raw} = await executeCode(code, stdin, currentLang);
    const result = raw || T().noOutput;
    const hint = currentLang === 'py' ? translateError(result) : '';
    if(hint){
      out.innerHTML = '';
      const pre = document.createElement('div');
      pre.textContent = result;
      out.appendChild(pre);
      const hintDiv = document.createElement('div');
      hintDiv.innerHTML = hint;
      out.appendChild(hintDiv);
    } else {
      out.textContent = result;
    }
  } catch (e) {
    out.textContent = T().errPrefix + (e.message || e);
  } finally {
    runBusy = false;
    btn.disabled = false;
  }
}

// ── 程式練習：執行使用者程式碼，比對 stdout 是否符合預期 ───────────────
function normalizeOutput(s){
  return (s || '').replace(/\r\n/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n+$/,'').trim();
}
async function checkAnswer(chapId){
  if(runBusy) return; // 與「▶ 執行」共用互鎖，避免同時送出兩個請求
  const meta = CHAPTER_META[chapId];
  if(!meta || !meta.code) return;
  runBusy = true;
  const btn = document.getElementById('check-btn-'+chapId);
  if(btn){ btn.disabled = true; btn.textContent = T().cqRunning; }
  try {
    const code = cm.getValue();
    let result;
    try {
      result = await executeCode(code, meta.code.stdin || '', currentLang);
    } catch(e){
      result = {raw: String(e.message||e), stderr: true};
    }
    const got = normalizeOutput(result.raw);
    const want = normalizeOutput(meta.code.expect);
    const passed = !result.stderr && got === want;
    codeQuizState[chapId] = {status: passed ? 'pass' : 'fail', got: result.raw || T().noOutput};
    if(passed && !completed.has(chapId)) markDone(chapId);
  } finally {
    runBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = T().cqCheck; }
  }
  if(currentChap && currentChap.id === chapId) selectChap(chapId, {preserveEditor:true});
}

// 版本指示器：顯示瀏覽器「實際載入」的章節數與資料版本，點擊強制破快取重載。
// 用途：更新後若仍看到舊內容，可一眼確認拿到的是不是最新版（HTML 本身無法用 ?v= 破快取，
// 只能靠硬重載或等 CDN 的 max-age=600 過期）。
(function(){
  const ver = ((document.querySelector('script[src*="tutorial-chapters-zh"]')||{}).src||'').match(/[?&]v=([\w.-]+)/)?.[1] || '?';
  const b = document.createElement('div');
  b.id = 'ver-badge';
  b.textContent = `${CHAPTERS.length} 章 · v${ver}`;
  b.title = '點此強制重新整理，取得最新版本（清掉舊快取）';
  b.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9999;font:10px/1.4 ui-monospace,monospace;color:var(--text-muted);background:var(--panel,#1118);border:1px solid var(--border);border-radius:10px;padding:2px 8px;opacity:.55;cursor:pointer;user-select:none';
  b.onmouseenter = () => b.style.opacity = '1';
  b.onmouseleave = () => b.style.opacity = '.55';
  b.onclick = () => location.replace(location.pathname + '?_t=' + Date.now());
  document.body.appendChild(b);
})();
