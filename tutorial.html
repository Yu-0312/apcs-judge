# 第 0 章：寫程式是什麼一回事？

歡迎！這是給**完全沒寫過程式**的你的第一章。讀完只要 5 分鐘。

## 🤔 程式 = 一份「給電腦看的食譜」

你寫好步驟 → 電腦照做 → 給你結果。就像炒菜的食譜：

\`\`\`
1. 把蛋打進碗裡
2. 加鹽
3. 倒進鍋子煎
\`\`\`

電腦的食譜長這樣：

\`\`\`python
name = "Alice"
print("Hello,", name)
\`\`\`

## 🧰 這個教學的三個區域

| 區域 | 用途 |
|------|------|
| **左側目錄** | 21 個章節，由淺到深，照順序點 |
| **中間（這裡）** | 教材文字 + 「動手試試」+ 小測驗 |
| **右側編輯器** | 真的可以改、可以執行的程式 |

## ▶️ 「執行」按鈕會發生什麼

右側上方有一顆綠色按鈕 **▶ 執行**。
- 按下去，電腦會「讀」右側的程式碼，照著做
- 結果會顯示在右下角的「📤 輸出」框
- **錯了也沒關係**！我們有自動把錯誤訊息翻譯成中文

## 🎯 你的目標（不用記）

讀完這 21 章，你會能：
- 看懂 Python 程式碼
- 寫程式解決小問題
- 準備好挑戰 APCS 初級的題目

> **小提示**：上方右邊有個「**新手模式**」開關（綠色就是開著）。開著時：
> - 只顯示 Python（不會被 C++/Java 干擾）
> - 必須通過每章小測驗，才能解鎖下一章
> - 程式出錯會自動翻譯成中文解釋
>
> 熟悉了之後可以關掉，就會解鎖所有章節跟其他語言。

## 👇 開始之前，先按一次「執行」

右邊已經幫你準備好一段「Hello」程式碼。按下右上角的 **▶ 執行**，看看會發生什麼。

# 第 1 章：變數與資料型別

## 1.1 什麼是變數
變數就是「會記住一個值的盒子」。在 Python 中，用 \`=\` 把右邊的值「貼」到左邊的名字上。

\`\`\`python
age = 17
name = "Alice"
height = 168.5
\`\`\`

## 1.2 四大基本型別

| 型別 | 名稱 | 範例 |
|------|------|------|
| int | 整數 | \`42\`, \`-7\`, \`0\` |
| float | 浮點數 | \`3.14\`, \`-0.5\` |
| str | 字串 | \`"hello"\`, \`'APCS'\` |
| bool | 布林 | \`True\`, \`False\` |

- \`str(42)\` → \`"42"\`（整數轉字串）

> **APCS 重點**：input() 讀進來都是字串，必須用 int() 或 float() 轉成數字才能運算！

# 第 3 章：運算子與表達式

## 3.1 算術運算子

## 3.2 比較與邏輯

\`==\` \`!=\` \`<\` \`>\` \`<=\` \`>=\` 結果為 \`True\` / \`False\`。

\`\`\`python

print(3 > 2 or 5 > 10)    # True

## 3.3 APCS 常見技巧

### 個位、十位數

### 連除取每一位

## 5.2 走訪 list / 字串（附拆包教學）


**手動維護索引的方法：**
\`\`\`python
my_list = [10, 20, 30]
i = 0
for x in my_list:
    print(i, x)
    i = i + 1

**使用 \`enumerate\`（更簡單）：**
\`\`\`python

    print(i, x)

\`enumerate\` 會產生「配對」：第一個配對是 (0, 10)，第二個是 (1, 20)……  
Python 允許直接把配對裡的兩個值分別放到 \`i\` 和 \`x\` 變數，這叫做**拆包 (unpacking)**。


**你也可以先拿整個配對，再手動拆：**
\`\`\`python
for pair in enumerate(my_list):
    i = pair[0]
    x = pair[1]
    print(i, x)

{id:6,title:"字串處理",tag:"資料",content:`
# 第 6 章：字串

## 6.1 字串基本

\`\`\`python
s = "Hello, APCS"
print(len(s))      # 11
print(s[0])        # H
print(s[-1])       # S
print(s.lower())   # hello, apcs
print(s.upper())   # HELLO, APCS
\`\`\`

## 6.2 切片 (slicing)
\`s[start:end]\`，取 start 到 end-1。

\`\`\`python
s = "ABCDEFG"
print(s[0:3])    # ABC
print(s[2:])     # CDEFG
print(s[:3])     # ABC
print(s[::-1])   # GFEDCBA  (反轉！)
\`\`\`

## 6.3 常用方法

| 方法 | 用途 |
|------|------|
| \`s.split()\` | 切成 list |
| \`s.strip()\` | 去頭尾空白 |
| \`s.replace(a,b)\` | 取代 |
| \`s.count(c)\` | 算 c 出現次數 |
| \`s.find(c)\` | 找位置 (找不到回 -1) |
| \`",".join(L)\` | list 接成字串 |
| \`s.isdigit()\` | 全是數字嗎？ |
| \`s.isalpha()\` | 全是字母嗎？ |

## 6.4 APCS 案例：秘密差
\`\`\`python
s = input()
A = sum(int(s[-i-1]) for i in range(len(s)) if i % 2 == 0)  # 奇數位
B = sum(int(s[-i-1]) for i in range(len(s)) if i % 2 == 1)  # 偶數位
print(abs(A - B))
\`\`\`

## 6.5 試試看


---

## 📝 補充說明（改進版）

## 6.2 切片 (slicing) － 從「迴圈反轉」到「切片魔法」


**先用迴圈手動反轉：**
\`\`\`python
s = "ABCDE"
reversed_str = ""
for ch in s:
    reversed_str = ch + reversed_str   # 把新的字母加到前面
print(reversed_str)   # "EDCBA"
\`\`\`


**Python 切片 (slice) 寫法：**
\`\`\`python
s = "ABCDE"
print(s[1:4])    # "BCD"  (索引 1 到 3)
print(s[::2])    # "ACE"  (步長 2)
print(s[::-1])   # "EDCBA" (步長 -1 → 從尾走到頭，反轉)
\`\`\`
切片的格式是 \`[起始:結束:步長]\`：
- 起始沒寫 → 從頭開始
- 結束沒寫 → 走到最後
- 步長為正：往右走；步長為負：往左走


> 🚫 **重要**：字串一旦建立就不能修改裡面的某個字元。  
> \`\`\`python
> s = "hello"
> s[0] = "H"   # ❌ TypeError
> \`\`\`
> 要修改只能建立新字串：\`s = "H" + s[1:]\`

`,
example:`s = "Hello APCS Python"
print("長度:", len(s))
print("反轉:", s[::-1])
print("大寫:", s.upper())
print("單字數:", len(s.split()))
print("把 APCS 換成 程式:", s.replace("APCS", "程式"))
`},

# 第 9 章：函式

## 9.1 為什麼要函式
- 重複利用同段邏輯
- 把複雜問題切小
- 容易測試與除錯

## 9.2 定義與呼叫
\`\`\`python
def add(a, b):
    return a + b

print(add(3, 5))   # 8
\`\`\`

## 9.3 多個回傳值
\`\`\`python
def min_max(lst):
    return min(lst), max(lst)

lo, hi = min_max([3, 1, 4, 1, 5, 9])
print(lo, hi)   # 1 9
\`\`\`

## 9.4 預設參數
\`\`\`python
def greet(name, greeting="Hello"):
    print(greeting, name)

greet("Alice")              # Hello Alice
greet("Bob", "Hi")          # Hi Bob
\`\`\`

## 9.5 APCS 案例：判斷質數
\`\`\`python
def is_prime(n):
    if n < 2: return False
    for i in range(2, int(n**0.5) + 1):
        if n % i == 0: return False
    return True

for x in range(2, 20):
    if is_prime(x):
        print(x, end=" ")
\`\`\`

> **APCS 技巧**：把判斷邏輯拆成 helper function，主程式就清楚很多。

## 9.6 遞迴入門
函式呼叫自己 = 遞迴。
\`\`\`python
def fact(n):
    if n <= 1: return 1
    return n * fact(n-1)

print(fact(5))   # 120
\`\`\`

## 9.7 試試看


---

## 📝 補充說明（改進版）

## 9.5 APCS 案例：判斷質數（含數學解釋）


\`\`\`python
def is_prime(n):
    if n < 2:
        return False


    # 只需要檢查到「平方根」就好，不用到 n-1
    # 為什麼？因為如果 n = a * b，其中一個因數一定 ≤ √n
    # 例如 36 = 6*6，檢查到 6 就夠了；36 = 4*9，4 ≤ 6
    limit = int(n ** 0.5)   # 例如 n=37, √37 ≈ 6.08, int=6
    # range(2, limit+1) 才會檢查 2,3,4,5,6
    for i in range(2, limit + 1):
        if n % i == 0:
            return False
    return True


print(is_prime(37))   # True
print(is_prime(36))   # False
\`\`\`


## 多個回傳值的拆包（tuple unpacking）


\`\`\`python
def min_max(lst):
    return min(lst), max(lst)


# 新手友善版
result = min_max([3,1,4])
small = result[0]   # 3
large = result[1]   # 4


# Pythonic 版（拆包）
small, large = min_max([3,1,4])

{id:11,title:"演算法基礎",tag:"進階",content:`
# 第 11 章：APCS 必備演算法

## 11.1 線性搜尋
\`\`\`python
def find(L, target):
    for i, x in enumerate(L):
        if x == target: return i
    return -1
\`\`\`

## 11.2 排序
Python 內建 \`sort()\` 就夠 APCS 初級用。

\`\`\`python
nums.sort()                       # 升冪
nums.sort(reverse=True)           # 降冪
nums.sort(key=lambda x: -x)       # 自訂排序鍵

# 多條件排序：先依分數降冪，分數同則名字升冪
students.sort(key=lambda x: (-x[1], x[0]))
\`\`\`

## 11.3 二分搜尋（中級）
適用於**已排序**的資料。

\`\`\`python
def bsearch(L, target):
    lo, hi = 0, len(L) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if L[mid] == target: return mid
        if L[mid] < target: lo = mid + 1
        else: hi = mid - 1
    return -1
\`\`\`

或用內建：\`from bisect import bisect_left\`

## 11.4 前綴和（中級）
讓「區間總和」變 O(1)。

\`\`\`python
a = [3, 1, 4, 1, 5, 9, 2, 6]
ps = [0]
for x in a:
    ps.append(ps[-1] + x)

# a[l..r] 總和（含 l, r, 0-indexed）
def range_sum(l, r):
    return ps[r+1] - ps[l]
\`\`\`

## 11.5 質數篩（埃氏篩）
\`\`\`python
N = 100
sieve = [True] * (N+1)
sieve[0] = sieve[1] = False
for i in range(2, int(N**0.5)+1):
    if sieve[i]:
        for j in range(i*i, N+1, i):
            sieve[j] = False
primes = [i for i in range(N+1) if sieve[i]]
\`\`\`

## 11.6 GCD / LCM
\`\`\`python
def gcd(a, b):
    while b:
        a, b = b, a % b
    return a

def lcm(a, b):
    return a * b // gcd(a, b)
\`\`\`

## 11.7 Kadane — 最大連續子陣列和 🔥【中級必備 / 高級題基石】
> 「**最大連續**子陣列和」這幾個關鍵字一出現，幾乎都是 Kadane。
> 一行核心思路：對每個位置 \`x\`，問自己「**接續**前面、還是**從這裡重啟**」。

\`\`\`python
def kadane(a):
    cur = best = a[0]
    for x in a[1:]:
        cur = max(x, cur + x)   # 要嘛重啟、要嘛延伸
        best = max(best, cur)
    return best
\`\`\`

**陷阱**：題目若要求「至少選 1 個」、且陣列全為負，答案是「最大的負數」而不是 0。
**進階（高級題）**：把它擴成 **2D Kadane**（固定左右兩欄、把列壓成 1D 再跑 Kadane）→ 第 24 章後段會用到。

## 11.8 試試看

## 📝 補充說明（改進版）

## 11.4 前綴和（從暴力到加速）


\`\`\`python
# 問題：經常需要問「陣列中從 L 到 R 的總和是多少？」
a = [3, 1, 4, 1, 5, 9, 2, 6]


# ---------- 方法1：每次直接加（慢，O(n) 每次查詢）----------
def range_sum_slow(L, R):
    total = 0
    for i in range(L, R+1):
        total += a[i]
    return total
print(range_sum_slow(2, 5))   # 4+1+5+9 = 19


# ---------- 方法2：前綴和（預先計算，查詢 O(1)）----------
# 前綴和陣列 ps[i] 表示 a[0] + a[1] + ... + a[i-1]
ps = [0]  # ps[0] = 0
for x in a:
    ps.append(ps[-1] + x)
# ps = [0, 3, 4, 8, 9, 14, 23, 25, 31]


def range_sum_fast(L, R):
    return ps[R+1] - ps[L]


print(range_sum_fast(2, 5))   # 19
\`\`\`


## 11.7 Kadane — 最大連續子陣列和（完整推導）


**問題**：找出一段連續的區間，讓總和最大。  
例如 \`[-2, 1, -3, 4, -1, 2, 1, -5, 4]\` 的答案是 6（子陣列 \`[4,-1,2,1]\`）。


**方法1：暴力枚舉 (O(n²))**
\`\`\`python
a = [-2, 1, -3, 4, -1, 2, 1, -5, 4]
n = len(a)
best = a[0]
for i in range(n):
    total = 0
    for j in range(i, n):
        total += a[j]
        if total > best:
            best = total
print("暴力法答案:", best)   # 6
\`\`\`


**方法2：Kadane 演算法 (O(n))**  
關鍵想法：當你走到第 i 個數字時，你可以選擇  
(1) 從這裡重新開始 (只取 a[i])  
(2) 繼續接上前面的區塊 (前面區塊總和 + a[i])  
取比較大的那個，就是「以 i 結尾的最佳子陣列和」。


\`\`\`python
cur = a[0]      # 以目前位置結尾的最大和
best = a[0]     # 整體最大和
for x in a[1:]:
    cur = max(x, cur + x)   # 要嘛重啟，要嘛延續
    best = max(best, cur)
print("Kadane 答案:", best)   # 6
\`\`\`


**手動追蹤表（讓你完全看懂）**


| i | a[i] | cur = max(a[i], 前cur+a[i]) | best |
|---|------|-----------------------------|------|
| 0 | -2   | -2                          | -2   |
| 1 | 1    | max(1, -2+1= -1) = 1        | 1    |
| 2 | -3   | max(-3, 1-3= -2) = -2       | 1    |
| 3 | 4    | max(4, -2+4=2) = 4          | 4    |
| 4 | -1   | max(-1, 4-1=3) = 3          | 4    |
| 5 | 2    | max(2, 3+2=5) = 5           | 5    |
| 6 | 1    | max(1, 5+1=6) = 6           | 6    |
| 7 | -5   | max(-5, 6-5=1) = 1          | 6    |
| 8 | 4    | max(4, 1+4=5) = 5           | 6    |

`,
example:`# 前綴和應用：找子陣列總和 = K 的個數
a = [1, 2, 3, 4, 5, 2, 1, 3]
K = 5

ps = [0]
for x in a:
    ps.append(ps[-1] + x)

cnt = 0
for i in range(len(a)):
    for j in range(i, len(a)):
        if ps[j+1] - ps[i] == K:
            cnt += 1
            print(f"  a[{i}..{j}] = {a[i:j+1]}")
print(f"\\n共 {cnt} 個子陣列總和為 {K}")
`},

# 第 15 章：遞迴 (Recursion)

## 16.1 什麼是遞迴？
函式呼叫自己。所有遞迴都需要：
1. **基礎情況 (base case)**：能直接答出的最小問題
2. **遞迴關係**：把問題化簡成更小的同類問題

## 16.2 階乘
\`\`\`python
def fact(n):
    if n <= 1: return 1       # base
    return n * fact(n-1)      # 遞迴
\`\`\`

## 16.3 費氏數列
\`\`\`python
def fib(n):
    if n < 2: return n
    return fib(n-1) + fib(n-2)
\`\`\`
> ⚠️ 直接遞迴算 fib(40) 會很慢！要加 memo。

## 16.4 加記憶（memoization）
\`\`\`python
from functools import lru_cache

@lru_cache
def fib(n):
    if n < 2: return n
    return fib(n-1) + fib(n-2)

print(fib(100))   # 瞬間
\`\`\`

## 16.5 河內塔
\`\`\`python
def hanoi(n, a, b, c):  # n 個盤從 a 經 b 移到 c
    if n == 0: return
    hanoi(n-1, a, c, b)
    print(f"移盤 {n}: {a} → {c}")
    hanoi(n-1, b, a, c)

hanoi(3, 'A', 'B', 'C')
\`\`\`

## 16.6 APCS 高頻：回溯 (Backtracking)
\`\`\`python
def perms(arr, path):
    if not arr:
        print(path); return
    for i in range(len(arr)):
        perms(arr[:i] + arr[i+1:], path + [arr[i]])

perms([1,2,3], [])
\`\`\`

## 📝 補充說明（改進版）

## 16.1 用縮排視覺化遞迴呼叫過程


\`\`\`python
def recite(n, depth=0):
    print("  " * depth + f"進入 recite({n})")
    if n <= 0:
        print("  " * depth + f"  base case, 回傳 1")
        return 1
    result = n * recite(n-1, depth+1)
    print("  " * depth + f"離開 recite({n}), 回傳 {result}")
    return result


recite(3)
\`\`\`


輸出會清楚看到每次呼叫的深度與返回順序。

`,
example:`# 8 皇后計數
def queens(n):
    count = [0]
    def solve(row, cols, d1, d2):
        if row == n:
            count[0] += 1
            return
        for c in range(n):
            if c in cols or row-c in d1 or row+c in d2:
                continue
            cols.add(c); d1.add(row-c); d2.add(row+c)
            solve(row+1, cols, d1, d2)
            cols.remove(c); d1.remove(row-c); d2.remove(row+c)
    solve(0, set(), set(), set())
    return count[0]

for n in range(4, 9):
    print(f"{n} 皇后有 {queens(n)} 種放法")
`},

# 第 16 章：枚舉與模擬

## 17.1 枚舉是什麼
當資料量小，直接「**試所有可能**」就能解。APCS 初級超過半數題目可用枚舉。

## 17.2 一維枚舉
\`\`\`python
# 找最佳分配
best = -1
for x in range(n+1):
    val = f(x, n-x)
    if val > best:
        best = val
print(best)
\`\`\`

## 17.3 二維枚舉（雙重 for）
\`\`\`python
# 在矩陣中找符合條件的子矩陣
for i in range(n):
    for j in range(n):
        if check(i, j):
            ...
\`\`\`

## 17.4 位元枚舉子集合
n 個物品有 2ⁿ 種子集合。

\`\`\`python
n = 4
for mask in range(1 << n):    # 0 ~ 15
    subset = [i for i in range(n) if mask & (1 << i)]
    print(subset)
\`\`\`

## 17.5 模擬題技巧
**讀清楚規則 → 一步步照做**。

例如：購物車流動、銀行排隊、機器人移動。
寫程式前先用紙筆模擬一次！

## 17.6 APCS 案例：機器人路徑
\`\`\`python
x, y = 0, 0
dx = {'N': 0, 'S': 0, 'E': 1, 'W': -1}
dy = {'N': 1, 'S': -1, 'E': 0, 'W': 0}

for c in input():
    x += dx[c]; y += dy[c]

print(x, y)
\`\`\`

## 17.4 位元枚舉子集合（白話版）


\`\`\`python
# 假設有 3 個物品：A, B, C
# 用 mask 的二進位表示「選哪些東西」：1 表示選，0 表示不選


for mask in range(1 << 3):   # 1<<3 = 8，mask 從 0 到 7
    items = []
    if mask & 1:   # 檢查最低位（代表 A）
        items.append("A")
    if mask & 2:   # 檢查第二位（代表 B）
        items.append("B")
    if mask & 4:   # 檢查第三位（代表 C）
        items.append("C")
    print(f"{mask:3} ({mask:03b}) → {items}")
# 輸出：
#   0 (000) → []
#   1 (001) → ['A']
#   2 (010) → ['B']
#   3 (011) → ['A', 'B']
#   4 (100) → ['C']
#   5 (101) → ['A', 'C']
#   6 (110) → ['B', 'C']
#   7 (111) → ['A', 'B', 'C']

{id:17,title:"進階資料結構",tag:"進階",content:`
# 第 17 章：進階資料結構

## 18.1 deque（雙端佇列）
從兩端都能 O(1) push/pop。

\`\`\`python
from collections import deque

q = deque([1, 2, 3])
q.append(4)        # [1,2,3,4]
q.appendleft(0)    # [0,1,2,3,4]
q.pop()            # 4
q.popleft()        # 0
\`\`\`

**用途**：BFS、滑動視窗。

## 18.2 heap（堆）
取最小值 O(log n)。Python 是「小堆」。

\`\`\`python
import heapq

h = []
heapq.heappush(h, 5)
heapq.heappush(h, 2)
heapq.heappush(h, 8)
print(heapq.heappop(h))   # 2 (最小)
\`\`\`

**用途**：Dijkstra、第 k 小、合併多串。

## 18.3 Counter
快速計數。
\`\`\`python
from collections import Counter
c = Counter("APCSAPCS")
print(c.most_common(2))   # [('A',2), ('P',2)]
\`\`\`

## 18.4 defaultdict
自動建立預設值。
\`\`\`python
from collections import defaultdict
d = defaultdict(list)
d["A"].append(1)
d["A"].append(2)
print(d["A"])   # [1, 2]
\`\`\`

## 18.5 BFS 模板
\`\`\`python
from collections import deque
def bfs(start, grid):
    n, m = len(grid), len(grid[0])
    q = deque([start])
    visited = {start}
    while q:
        x, y = q.popleft()
        for dx, dy in [(-1,0),(1,0),(0,-1),(0,1)]:
            nx, ny = x+dx, y+dy
            if 0<=nx<n and 0<=ny<m and grid[nx][ny]==0 and (nx,ny) not in visited:
                visited.add((nx,ny))
                q.append((nx,ny))
\`\`\`

## 18.6 試試看


---

## 📝 補充說明（改進版）

## 為什麼 BFS 要用 deque？


BFS 需要「從左邊拿元素（popleft）」，如果使用 list 的 \`pop(0)\`，每次會 O(n) 時間，非常慢。  
\`deque\`（雙端佇列）設計成兩端操作都 O(1)。


\`\`\`python
from collections import deque


queue = deque([1, 2, 3])
queue.append(4)      # 右邊加
queue.popleft()      # 左邊拿 → 2,3,4
\`\`\`

example:`# 用 heap 找前 3 大
import heapq
nums = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]
print("前 3 大:", heapq.nlargest(3, nums))
print("前 3 小:", heapq.nsmallest(3, nums))

# 用 Counter 找最常出現的字
from collections import Counter
s = "the quick brown fox jumps over the lazy dog"
c = Counter(s.split())
print("字頻 Top 2:", c.most_common(2))
`},

{id:18,title:"常見錯誤與除錯",tag:"進階",content:`
# 第 18 章：常見錯誤與除錯

## 19.1 縮排錯誤 IndentationError
**Python 用縮排定範圍。不可混用 tab 與空白。**
建議：永遠用 4 個空白。

## 19.2 名稱錯誤 NameError
\`\`\`python
print(x)   # NameError if x not defined
\`\`\`
通常是拼錯字或忘了宣告。

## 19.3 型別錯誤 TypeError
\`\`\`python
print("年齡:" + 17)   # TypeError: str + int
# 改成 print("年齡:" + str(17))
# 或    print(f"年齡:{17}")
\`\`\`

## 19.4 索引錯誤 IndexError
\`\`\`python
a = [1, 2, 3]
print(a[3])   # IndexError, 沒有索引 3
\`\`\`
記住：len(a) 個元素，索引是 0 ~ len(a)-1。

## 19.5 整數除法陷阱
\`\`\`python
print(7 / 2)    # 3.5 (浮點)
print(7 // 2)   # 3 (整除)
print(-7 // 2)  # -4 (向下取整，不是 -3！)
\`\`\`

## 19.6 2D list 的引用陷阱
\`\`\`python
g = [[0]*3] * 3
g[0][0] = 1
print(g)
# 期望: [[1,0,0],[0,0,0],[0,0,0]]
# 實際: [[1,0,0],[1,0,0],[1,0,0]]  全變了！
# 正解: g = [[0]*3 for _ in range(3)]
\`\`\`

## 19.7 除錯三招

1. **print 大法**：在關鍵位置印變數值
2. **小例子試**：n=1, n=2 邊界
3. **讀錯誤訊息**：行號通常準確

## 19.8 試試看：找 bug

## 📖 如何閱讀 Python 的錯誤訊息


當你的程式崩潰時，會出現類似這樣的紅色文字：


\`\`\`
Traceback (most recent call last):
  File "mycode.py", line 5, in <module>
    print(1/0)
ZeroDivisionError: division by zero
\`\`\`


**重點解讀：**
- 最後一行：**錯誤類型**（ZeroDivisionError）和 **簡短說明**（division by zero）
- 往上找 \`File "..."\` → 告訴你是哪個檔案的哪一行出錯（line 5）
- 再上一行是那一行的程式碼內容


> 🎯 **SOP**：
> 1. 先看最後一行，知道錯在哪種類型。
> 2. 看最上面的 \`File\` 行，找到檔案與行號。
> 3. 修正那一行程式碼。

{id:19,title:"綜合練習：完整 APCS 題",tag:"實戰",content:`
# 第 19 章：完整 APCS 題解析

## 20.1 解題流程示範

題目：**成績指標**（2016/03 APCS 初級）

> 讀入全班成績，排序後找出**不及格中的最高分**和**及格中的最低分**（60 分為及格界線）。

### Step 1：讀清楚題目
- 輸入：第一行人數 n，第二行 n 個分數
- 輸出：排序後分數 / 最高不及格 / 最低及格
- 找不到時印 best case 或 worst case

### Step 2：想小例子
輸入 \`[55, 88, 60, 30]\`
排序後 \`[30, 55, 60, 88]\`
不及格 \`[30, 55]\` → 最高 55
及格 \`[60, 88]\` → 最低 60

### Step 3：選資料結構與演算法
- 排序：\`sort()\` 或 \`sorted()\`
- 篩選：list comprehension

### Step 4：動手寫
\`\`\`python
n = int(input())
scores = sorted(map(int, input().split()))
print(*scores)

fail = [x for x in scores if x < 60]
print(max(fail) if fail else "best case")

passed = [x for x in scores if x >= 60]
print(min(passed) if passed else "worst case")
\`\`\`

### Step 5：測樣本與邊界
- 樣本 1：\`[0,11,22,33,55,66,77,99,88,44]\` ✅
- 樣本 2：\`[13]\` → 全不及格 → worst case ✅
- 樣本 3：\`[73,65]\` → 全及格 → best case + 65 ✅

## 20.2 APCS 應試節奏

| 時間 | 動作 |
|------|------|
| 0-2 分 | 讀題、圈關鍵字 |
| 2-5 分 | 思考演算法、確認邊界 |
| 5-15 分 | 寫程式 |
| 15-18 分 | 用樣本測試 |
| 18-20 分 | 測邊界值（n=1、全相同） |

## 20.3 試試看：完整流程


---

## 🧠 解題標準流程（填空練習）


1. **題目要我輸出什麼？**  
   → _________________________________


2. **輸入資料的大小（n 範圍）？**  
   → _________________________________


3. **如果 n 很大，不能用哪種寫法？**  
   → _________________________________


4. **手算一個小範例（例如 n=3）：**  
   輸入：_______  
   預期輸出：_______

# 輸入: 9 個整數 -2 1 -3 4 -1 2 1 -5 4

# 第 20 章：APCS 實戰技巧

## 12.1 讀入模板（背起來）

\`\`\`python
# 模板 1：固定行數
n = int(input())
nums = list(map(int, input().split()))

# 模板 2：n 行各一筆
n = int(input())
data = [input() for _ in range(n)]

# 模板 3：n x m 矩陣
n, m = map(int, input().split())
g = [list(map(int, input().split())) for _ in range(n)]

# 模板 4：讀到 EOF
import sys
for line in sys.stdin:
    line = line.strip()
    if not line: continue
    # 處理 line
\`\`\`

## 12.2 輸出格式

\`\`\`python
# 空白分隔
print(*nums)            # 1 2 3 4 5

# 換行分隔
print(*nums, sep="\\n")

# 自訂分隔
print(",".join(map(str, nums)))   # 1,2,3,4,5

# 浮點數兩位小數
print(f"{x:.2f}")
\`\`\`

## 12.3 常見錯誤

> ❌ \`int(input().split())\` — split 回傳 list，不能直接 int
> ✅ \`list(map(int, input().split()))\`

> ❌ \`a = b = [0]*5\` 後改 a，b 也變 — 它們指向同一個 list
> ✅ \`a, b = [0]*5, [0]*5\`

> ❌ \`[[0]*m]*n\` — n 個 row 指向同一個！
> ✅ \`[[0]*m for _ in range(n)]\`

## 12.4 解題流程（重要！）

1. **讀題**：圈關鍵詞 — 數量級、輸入格式、邊界條件
2. **想例子**：用小例子算一遍
3. **設計流程**：先寫註解，再寫程式
4. **動手寫**：先求對，再求快
5. **測樣本**：所有樣本都過才提交
6. **想邊界**：n=1？全相同？空輸入？

## 12.5 時間複雜度速覽

| 寫法 | 大致複雜度 | n 上限 |
|------|-----------|--------|
| 兩層 for | O(n²) | n ≤ 5000 |
| 一層 for + sort | O(n log n) | n ≤ 10⁶ |
| 一層 for | O(n) | n ≤ 10⁷ |
| 二分搜尋 | O(log n) | n ≤ 10⁹ |

{id:21,title:"樹的走訪",tag:"進階",content:`
# 第 21 章：樹的走訪 (Tree Traversal)

> 🎯 **APCS 考試準備**：樹是 3-4 級題的常客。先把走訪寫熟，DP on tree 就只是延伸。

## 21.1 樹是什麼？

樹 = **沒有環的連通圖**。最常見的表示法：

\`\`\`python
# children[u] = u 的所有子節點
children = {0:[1,2], 1:[3,4], 2:[], 3:[], 4:[]}
\`\`\`

或用「父節點陣列」：\`parent[i] = i 的父親\`。

## 21.2 三種走訪順序

對二元樹（左右子）：

| 順序 | 規則 | 用途 |
|------|------|------|
| 前序 (pre) | 根→左→右 | 複製樹、序列化 |
| 中序 (in) | 左→根→右 | BST 排序輸出 |
| 後序 (post) | 左→右→根 | 算子樹大小、釋放記憶體 |

## 21.3 一般樹用 DFS 走

\`\`\`python
def dfs(u, par=-1):
    # 進入 u 時做的事
    for v in children[u]:
        if v != par:
            dfs(v, u)
    # 離開 u 時做的事（後序處理）
\`\`\`

## 21.4 子樹大小（最常考）

\`\`\`python
size = [1]*n
def dfs(u, par):
    for v in children[u]:
        if v != par:
            dfs(v, u)
            size[u] += size[v]
\`\`\`

這就是「樹 DP」的雛形：子樹算完才能算自己。

## 21.5 注意事項

- **遞迴深度**：Python 預設 1000，深樹要 \`sys.setrecursionlimit(10**6)\`
- **不要重訪父節點**：用 \`par\` 參數擋住


---

## 📝 補充說明（改進版）

## 🌳 生活中哪裡有樹？


- **電腦的資料夾**：一個資料夾裡有檔案和子資料夾，子資料夾裡又有檔案… → 就是樹結構。
- **公司職位**：CEO → 部門主管 → 員工 → 也是樹。


樹的每個節點可以有很多個「孩子」，但不會有環（不會 A 是 B 的上司同時 B 也是 A 的上司）。

`,example:`
# 子樹大小範例
import sys
sys.setrecursionlimit(10**6)

# 樹：0─1─3
#       └─4
#     └─2
n = 5
children = {0:[1,2], 1:[3,4], 2:[], 3:[], 4:[]}

size = [1]*n
def dfs(u):
    for v in children[u]:
        dfs(v)
        size[u] += size[v]

dfs(0)
print(*size)  # 5 3 1 1 1
`},

# 第 22 章：圖論基礎 (BFS / DFS)

> 🎯 **APCS 考試準備**：迷宮、連通分量、最短步數，幾乎都是 BFS。

## 22.1 圖的表示

\`\`\`python
# 鄰接表（最常用）
graph = {0:[1,2], 1:[0,3], 2:[0,3], 3:[1,2]}
\`\`\`

讀邊：
\`\`\`python
from collections import defaultdict
g = defaultdict(list)
for _ in range(m):
    u, v = map(int, input().split())
    g[u].append(v)
    g[v].append(u)   # 無向圖才加這行
\`\`\`

## 22.2 BFS：找最短步數

\`\`\`python
from collections import deque
def bfs(start):
    dist = {start: 0}
    q = deque([start])
    while q:
        u = q.popleft()
        for v in g[u]:
            if v not in dist:
                dist[v] = dist[u] + 1
                q.append(v)
    return dist
\`\`\`

**為什麼 BFS = 最短步數？** 一層一層擴展，第一次碰到目標就是最少步數。

## 22.3 DFS：找連通分量

\`\`\`python
visited = set()
def dfs(u):
    visited.add(u)
    for v in g[u]:
        if v not in visited:
            dfs(v)

count = 0
for node in range(n):
    if node not in visited:
        dfs(node)
        count += 1
print(count)   # 連通分量數
\`\`\`

## 22.4 二維迷宮

把 \`grid[i][j]\` 想成圖中一個節點，四方向就是邊：
\`\`\`python
dr = [-1,1,0,0]; dc = [0,0,-1,1]
for d in range(4):
    ni, nj = i+dr[d], j+dc[d]
    if 0<=ni<R and 0<=nj<C and grid[ni][nj]=='.':
        ...
\`\`\`


---

## 📝 補充說明（改進版）

## 樹 vs 圖 對照表


| 特性 | 樹 (Tree) | 圖 (Graph) |
|------|-----------|-------------|
| 有沒有環 | 沒有 | 可能有 |
| 連通性 | 一定連通 | 可能不連通 |
| 走訪時注意 | 小心不要往回走（用 parent 參數） | 一定要記錄 visited |

`,example:`
# 連通分量數
n, m = 6, 4
edges = [(0,1),(1,2),(3,4)]   # 3 個連通分量: {0,1,2}, {3,4}, {5}

from collections import defaultdict
g = defaultdict(list)
for u,v in edges:
    g[u].append(v); g[v].append(u)

visited = set()
def dfs(u):
    visited.add(u)
    for v in g[u]:
        if v not in visited:
            dfs(v)

cnt = 0
for u in range(n):
    if u not in visited:
        dfs(u); cnt += 1
print(cnt)   # 3
`},
{id:23,title:"最短路徑與拓樸",tag:"進階",content:`
# 第 23 章：最短路徑 + 拓樸排序

> 🎯 **APCS 考試準備**：有權重就用 Dijkstra；DAG 排程就用拓樸排序。

## 23.1 Dijkstra：非負權重最短路

核心想法：每次取出「目前距離最短的點」展開。用最小堆（heapq）達成。

\`\`\`python
import heapq
def dijkstra(start, n):
    dist = [float('inf')] * n
    dist[start] = 0
    pq = [(0, start)]
    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]: continue
        for v, w in g[u]:           # g[u] = [(鄰居, 邊權)]
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
                heapq.heappush(pq, (dist[v], v))
    return dist
\`\`\`

時間：**O((n + m) log n)**

## 23.2 為什麼不用 BFS？

BFS 假設每條邊長度都是 1。一旦邊有不同權重（例：距離、花費），BFS 結果就錯了。

## 23.3 拓樸排序：DAG 的線性排程

「課程先修」、「工序相依」這類題目。Kahn 演算法（BFS 變形）：

\`\`\`python
from collections import deque
indeg = [0]*n
for u in range(n):
    for v in g[u]:
        indeg[v] += 1

q = deque([u for u in range(n) if indeg[u]==0])
order = []
while q:
    u = q.popleft()
    order.append(u)
    for v in g[u]:
        indeg[v] -= 1
        if indeg[v] == 0: q.append(v)

# 若 len(order) < n → 有環
\`\`\`

## 23.4 速查表

| 情境 | 演算法 | 複雜度 |
|------|--------|--------|
| 無權圖最短步數 | BFS | O(n+m) |
| 非負權最短路 | Dijkstra | O((n+m)log n) |
| 有負權 | Bellman-Ford | O(nm) |
| 全點對 | Floyd-Warshall | O(n³) |


---

## 📝 補充說明（改進版）

## 無權圖的最短路：用 BFS（先學這個）


\`\`\`python
from collections import deque


def bfs_shortest(graph, start, target):
    dist = {start: 0}
    q = deque([start])
    while q:
        u = q.popleft()
        if u == target: return dist[u]
        for v in graph[u]:
            if v not in dist:
                dist[v] = dist[u] + 1
                q.append(v)
    return -1
\`\`\`


**當邊有權重（不同距離）時，BFS 就不適用了，要用 Dijkstra。**

`,example:`
# Dijkstra 範例
import heapq

# 4 點圖：0─1(1)─3(1), 0─2(4)─3(1)
g = {0:[(1,1),(2,4)], 1:[(0,1),(3,1)], 2:[(0,4),(3,1)], 3:[(1,1),(2,1)]}
n = 4

dist = [float('inf')]*n
dist[0] = 0
pq = [(0, 0)]
while pq:
    d, u = heapq.heappop(pq)
    if d > dist[u]: continue
    for v, w in g[u]:
        if d + w < dist[v]:
            dist[v] = d + w
            heapq.heappush(pq, (dist[v], v))

print(*dist)   # 0 1 3 2
`},
{id:24,title:"進階 DP：LIS / 背包",tag:"進階",content:`
# 第 24 章：進階 DP（LIS、背包、LCS）

> 🎯 **APCS 考試準備**：DP 是 4 級題分水嶺。先把「狀態 / 轉移」想清楚。

## 24.1 DP 的三步驟

1. **定義狀態**：\`dp[i]\` 代表什麼？
2. **寫出轉移**：\`dp[i]\` 怎麼從前面算出來？
3. **初始 + 順序**：邊界值、計算順序

## 24.2 最長遞增子序列 (LIS)

**狀態**：\`dp[i]\` = 以 a[i] 結尾的最長遞增子序列長度

\`\`\`python
def lis(a):
    n = len(a)
    dp = [1]*n
    for i in range(n):
        for j in range(i):
            if a[j] < a[i]:
                dp[i] = max(dp[i], dp[j]+1)
    return max(dp)
\`\`\`
**O(n²)**。進階可用 \`bisect\` 做到 O(n log n) 👇

### 🔥【高級題】LIS O(n log n) — 耐心排序 + 二分搜
**直覺**：維護一個「目前最佳的尾巴序列」\`tails\`，新元素若大於尾端就 append；否則用二分搜把它**取代**第一個 ≥ 它的位置。\`tails\` 的長度即 LIS 長度（但內容不是真正的 LIS）。

\`\`\`python
from bisect import bisect_left
def lis_fast(a):
    tails = []
    for x in a:
        i = bisect_left(tails, x)
        if i == len(tails): tails.append(x)
        else: tails[i] = x
    return len(tails)
\`\`\`
\`bisect_left\` → 嚴格遞增；要非遞減改 \`bisect_right\`。

## 24.3 0/1 背包

n 個物品（重量 w[i]、價值 v[i]），背包容量 W，求最大價值總和。

**狀態**：\`dp[j]\` = 容量 j 時最大價值

\`\`\`python
def knapsack(w, v, W):
    dp = [0]*(W+1)
    for i in range(len(w)):
        for j in range(W, w[i]-1, -1):    # 注意倒序
            dp[j] = max(dp[j], dp[j-w[i]] + v[i])
    return dp[W]
\`\`\`

**為什麼倒序？** 正序的話會把同一個物品用兩次（變成完全背包）。

## 24.4 最長共同子序列 (LCS)

**狀態**：\`dp[i][j]\` = a[:i] 和 b[:j] 的 LCS 長度

\`\`\`python
def lcs(a, b):
    m, n = len(a), len(b)
    dp = [[0]*(n+1) for _ in range(m+1)]
    for i in range(1, m+1):
        for j in range(1, n+1):
            if a[i-1] == b[j-1]:
                dp[i][j] = dp[i-1][j-1] + 1
            else:
                dp[i][j] = max(dp[i-1][j], dp[i][j-1])
    return dp[m][n]
\`\`\`

## 24.5 🔥【高級題】完全背包（無限背包）
跟 0/1 背包**只差迴圈方向**：每個物品可以拿無限次，所以 j 由小到大跑（允許重用）。

\`\`\`python
def unbounded_knapsack(w, v, W):
    dp = [0]*(W+1)
    for i in range(len(w)):
        for j in range(w[i], W+1):    # 正序 → 同物品可重複加
            dp[j] = max(dp[j], dp[j-w[i]] + v[i])
    return dp[W]
\`\`\`

**口訣**：0/1 倒序、完全正序。

## 24.6 🔥【高級題】編輯距離 (Edit Distance / Levenshtein)
從字串 a 改成字串 b 的最少操作數（插入、刪除、替換各算 1 次）。

\`\`\`python
def edit_distance(a, b):
    m, n = len(a), len(b)
    dp = [[0]*(n+1) for _ in range(m+1)]
    for i in range(m+1): dp[i][0] = i      # 全刪
    for j in range(n+1): dp[0][j] = j      # 全插
    for i in range(1, m+1):
        for j in range(1, n+1):
            if a[i-1] == b[j-1]:
                dp[i][j] = dp[i-1][j-1]
            else:
                dp[i][j] = 1 + min(
                    dp[i-1][j],     # 刪
                    dp[i][j-1],     # 插
                    dp[i-1][j-1]    # 替換
                )
    return dp[m][n]
\`\`\`

跟 LCS 的關係：兩者都是 \`dp[i][j]\` + 字元比較，但**轉移方向不同**——LCS 取 max、Edit Distance 取 min+1。

## 24.7 🔥【高級題】區間 DP — 矩陣連乘 (Matrix Chain)
給定矩陣鏈 \`A1 (p0×p1) · A2 (p1×p2) · … · An (p(n-1)×pn)\`，求**最少純量乘法次數**。

**狀態**：\`dp[l][r]\` = 把 \`A_l … A_r\` 乘起來的最少代價。
**轉移**：枚舉切點 k，\`dp[l][r] = min(dp[l][k] + dp[k+1][r] + p[l-1]·p[k]·p[r])\`。

\`\`\`python
def matrix_chain(p):           # p = [p0, p1, ..., pn]，共 n 個矩陣
    n = len(p) - 1
    dp = [[0]*(n+1) for _ in range(n+1)]
    for length in range(2, n+1):                     # 區間長度由短到長
        for l in range(1, n - length + 2):
            r = l + length - 1
            dp[l][r] = float('inf')
            for k in range(l, r):                    # 切點
                cost = dp[l][k] + dp[k+1][r] + p[l-1]*p[k]*p[r]
                dp[l][r] = min(dp[l][r], cost)
    return dp[1][n]

print(matrix_chain([30, 35, 15, 5, 10, 20, 25]))     # 15125
\`\`\`

**所有區間 DP 的共同骨架**：**外層 by length、內層 by left、最內層 by split point**。看到「合併相鄰、求最佳代價」就想到它。


---

## 📝 補充說明（改進版）

## 以費氏數列為例：從遞迴到 DP


\`\`\`python
# 問題：第 n 個費氏數


# ---------- 方法1：純遞迴（慢，O(2^n)）----------
def fib_rec(n):
    if n <= 1: return n
    return fib_rec(n-1) + fib_rec(n-2)


# ---------- 方法2：遞迴 + 記憶化（memoization）----------
memo = {}
def fib_memo(n):
    if n in memo: return memo[n]
    if n <= 1: return n
    memo[n] = fib_memo(n-1) + fib_memo(n-2)
    return memo[n]


# ---------- 方法3：DP（迭代，從小到大，O(n)）----------
def fib_dp(n):
    if n <= 1: return n
    dp = [0] * (n+1)
    dp[1] = 1
    for i in range(2, n+1):
        dp[i] = dp[i-1] + dp[i-2]
    return dp[n]
# 這就是「動態規劃」的精髓：先算小問題，再用小問題答案組出大問題。
\`\`\`

`,example:`
# 0/1 背包範例
weights = [2, 3, 4, 5]
values  = [3, 4, 5, 6]
W = 5

dp = [0]*(W+1)
for i in range(len(weights)):
    for j in range(W, weights[i]-1, -1):
        dp[j] = max(dp[j], dp[j-weights[i]] + values[i])

print(dp[W])   # 7 (取 w=2 + w=3)
`},
{id:25,title:"Union-Find 並查集",tag:"進階",content:`
# 第 25 章：Union-Find（並查集）

> 🎯 **APCS 考試準備**：判斷連通、最小生成樹、離線查詢的萬用工具。

## 25.1 核心需求

兩件事，都要 O(近乎常數)：
1. \`find(x)\` — x 在哪個集合？
2. \`union(x, y)\` — 把 x 跟 y 合併成同一個集合

## 25.2 基本實作（路徑壓縮）

\`\`\`python
parent = list(range(n))    # 一開始每個人自成一群

def find(x):
    if parent[x] != x:
        parent[x] = find(parent[x])   # 路徑壓縮
    return parent[x]

def union(x, y):
    rx, ry = find(x), find(y)
    if rx != ry:
        parent[rx] = ry
        return True   # 真的合併了
    return False      # 早就在同一群
\`\`\`

## 25.3 經典應用：算連通分量數

\`\`\`python
n, m = map(int, input().split())
parent = list(range(n))
for _ in range(m):
    u, v = map(int, input().split())
    union(u, v)
print(len(set(find(i) for i in range(n))))
\`\`\`

## 25.4 進階：按秩合併

\`\`\`python
rank = [0]*n
def union(x, y):
    rx, ry = find(x), find(y)
    if rx == ry: return False
    if rank[rx] < rank[ry]: rx, ry = ry, rx
    parent[ry] = rx
    if rank[rx] == rank[ry]: rank[rx] += 1
    return True
\`\`\`

## 25.5 解什麼題？

- 朋友圈分組
- Kruskal 最小生成樹
- 動態加邊判斷連通
- 「最早什麼時候 a, b 連通」這種離線題


---

## 📝 補充說明（改進版）

## 👥 生活例子：朋友圈


假設有 5 個人：A、B、C、D、E。  
告訴你：  
- A 和 B 是朋友  
- B 和 C 是朋友  
- D 和 E 是朋友  


問：A 和 C 是不是朋友？（是，因為 A-B-C 連在一起）  
A 和 D 是不是朋友？（不是）  


這個問題要怎麼寫程式？  
- 可以用「集合」記錄每個人屬於哪個群組  
- 每次合併兩個群組（朋友的朋友）  
- **並查集就是專門做這件事的資料結構**。

`,example:`
# Union-Find 算連通分量
n = 6
edges = [(0,1),(1,2),(3,4)]

parent = list(range(n))
def find(x):
    if parent[x] != x:
        parent[x] = find(parent[x])
    return parent[x]
def union(x, y):
    rx, ry = find(x), find(y)
    if rx != ry:
        parent[rx] = ry

for u, v in edges:
    union(u, v)

groups = len({find(i) for i in range(n)})
print(groups)   # 3
`},
{id:26,title:"字串：hash 與 Trie",tag:"進階",content:`
# 第 26 章：字串演算法 — hash & Trie

> 🎯 **APCS 考試準備**：字串比對、前綴查詢的兩大利器。

## 26.1 字串 hash：把字串變數字

讓「比對兩段字串是否相同」變 O(1)。

\`\`\`python
MOD = 10**9 + 7
BASE = 131

def get_hashes(s):
    n = len(s)
    h = [0]*(n+1)
    p = [1]*(n+1)
    for i, c in enumerate(s):
        h[i+1] = (h[i]*BASE + ord(c)) % MOD
        p[i+1] = p[i]*BASE % MOD
    return h, p

def sub_hash(h, p, l, r):
    # s[l..r-1] 的 hash
    return (h[r] - h[l]*p[r-l]) % MOD
\`\`\`

預處理 O(n)，每次查詢 O(1)。

## 26.2 KMP（觀念）

「在字串 t 中找 pattern p 的位置」，O(n+m)。重點是 fail array：紀錄「失敗時可以跳到哪」。

實戰 Python 通常直接用 \`t.find(p)\` 或 \`re.search\`，但要懂 fail 函數的原理。

## 26.3 Trie（前綴樹）

存大量字串，快速查「有沒有某前綴開頭」。

\`\`\`python
trie = {}
def insert(word):
    node = trie
    for c in word:
        node = node.setdefault(c, {})
    node['$'] = True   # 結尾標記

def search(word):
    node = trie
    for c in word:
        if c not in node: return False
        node = node[c]
    return '$' in node

def starts_with(prefix):
    node = trie
    for c in prefix:
        if c not in node: return False
        node = node[c]
    return True
\`\`\`

每次操作 O(L)，L 為字串長度。

## 26.4 什麼時候用？

| 需求 | 解法 |
|------|------|
| 比較兩段子字串是否相等 | hash |
| 找出 p 在 t 出現的所有位置 | KMP |
| 自動補完、字典查詢 | Trie |
| 最長公共前綴 | Trie 或 hash |


---

## 📝 補充說明（改進版）

## 🔢 字串 hash 的白話文


我們想把字串變成一個數字，這樣比較兩個字串時只要比較數字（很快）。  
但不同字串可能算出相同數字嗎？有可能（碰撞），所以我們用很大的質數當 MOD 來減少碰撞。


例如：「abc」→ (97*131^2 + 98*131^1 + 99) mod 大數。  
只要 MOD 夠大，碰撞機率極低。

`,example:`
# Trie 範例
trie = {}
words = ["app", "apple", "ape", "bat"]
for w in words:
    node = trie
    for c in w:
        node = node.setdefault(c, {})
    node['$'] = True

def starts_with(prefix):
    node = trie
    for c in prefix:
        if c not in node: return False
        node = node[c]
    return True

print(starts_with("ap"))   # True
print(starts_with("ba"))   # True
print(starts_with("cat"))  # False
`},
{id:27,title:"檔案 I/O",tag:"實用",content:`
# 第 27 章：讀寫檔案

> 🛠 **實用程式**：APCS 用 stdin/stdout 就夠；做小工具就一定要會檔案 I/O。

## 27.1 讀整個檔案

\`\`\`python
with open("data.txt", "r", encoding="utf-8") as f:
    text = f.read()
print(text)
\`\`\`

\`with\` 是「結束自動關檔」的安全寫法，比 \`f.close()\` 不容易出錯。

## 27.2 一行一行讀（大檔案用這個）

\`\`\`python
with open("data.txt", "r", encoding="utf-8") as f:
    for line in f:
        line = line.rstrip("\\n")    # 去掉尾部換行
        print(line)
\`\`\`

## 27.3 寫檔案

\`\`\`python
with open("out.txt", "w", encoding="utf-8") as f:
    f.write("Hello\\n")
    f.write("APCS\\n")
\`\`\`

模式：
- \`"r"\` 讀 / \`"w"\` 寫（蓋掉）/ \`"a"\` 附加
- \`"rb"\` / \`"wb"\` 二進位（圖片、PDF 用）

## 27.4 處理路徑

\`\`\`python
from pathlib import Path
p = Path("data") / "scores.txt"
text = p.read_text(encoding="utf-8")     # 一行搞定
p.write_text("hello", encoding="utf-8")
\`\`\`

\`pathlib\` 比手拼字串路徑安全，自動處理跨平台分隔符。

## 27.5 JSON：結構化資料的最佳搭擋

\`\`\`python
import json
data = {"name": "Alice", "scores": [90, 85, 77]}
# 存
Path("data.json").write_text(json.dumps(data, ensure_ascii=False, indent=2))
# 讀
loaded = json.loads(Path("data.json").read_text())
print(loaded["scores"])
\`\`\`

> 💡 **本章練習用 stdin/stdout 模擬**（瀏覽器沙箱不能寫真正檔案）。回到本機再用 \`open()\`。


---

## 📝 補充說明（改進版）

## 為什麼要用 \`with\` 語句？


\`\`\`python
# 一般寫法（容易忘記關檔）
f = open("data.txt")
data = f.read()
f.close()   # 如果忘記，可能佔用資源


# with 寫法（離開縮排自動關閉，即使發生錯誤也會關）
with open("data.txt") as f:
    data = f.read()
# 離開 with 區塊後，檔案已自動關閉
\`\`\`

`,example:`
# 模擬「讀檔內容、算平均」
# 把 stdin 當成檔案內容
content = """Alice 90
Bob 85
Cathy 77"""

total, n = 0, 0
for line in content.splitlines():
    name, score = line.split()
    total += int(score); n += 1
print(round(total / n, 1))   # 84.0
`},
{id:28,title:"模組與套件",tag:"實用",content:`
# 第 28 章：模組與 import

> 🛠 **實用程式**：把程式拆成多檔案，才不會變一坨大義大利麵。

## 28.1 為什麼要拆檔案？

當一個檔案超過 200-300 行，找東西就會崩潰。拆成模組：
- \`main.py\` — 程式入口
- \`utils.py\` — 工具函式
- \`models.py\` — 資料結構

## 28.2 import 的三種寫法

\`\`\`python
import math
print(math.sqrt(16))             # 4.0

from math import sqrt, pi
print(sqrt(16), pi)              # 4.0 3.141...

from math import *                # 全部拉進來（不建議）
\`\`\`

## 28.3 自己寫模組

\`\`\`python
# utils.py
def gcd(a, b):
    return a if b == 0 else gcd(b, a % b)

PI = 3.14159
\`\`\`

\`\`\`python
# main.py
from utils import gcd, PI
print(gcd(12, 18))    # 6
\`\`\`

## 28.4 \`if __name__ == "__main__":\`

\`\`\`python
# tool.py
def main():
    print("Hello")

if __name__ == "__main__":
    main()
\`\`\`

意思是「**只有直接執行這個檔案時才跑 main()**，被別人 import 時不跑」。寫小工具務必加。

## 28.5 套件管理：pip

\`\`\`bash
pip install requests
pip install pandas matplotlib
pip list
pip freeze > requirements.txt
\`\`\`

\`requirements.txt\` 是專案的依賴清單，新環境 \`pip install -r requirements.txt\` 一次裝齊。

## 28.6 虛擬環境（避免套件互相打架）

\`\`\`bash
python -m venv .venv
source .venv/bin/activate    # mac/linux
.venv\\\\Scripts\\\\activate     # windows
\`\`\`

## \`if __name__ == "__main__"\` 的作用


\`\`\`python
# tool.py
def add(a, b):
    return a + b


def main():
    print(add(3, 5))


if __name__ == "__main__":
    # 只有「直接執行 python tool.py」時才會跑 main()
    # 如果是被別人 import，就不會自動執行
    main()
\`\`\`

`,example:`
# 用 math 模組
import math

print(math.sqrt(144))         # 12.0
print(math.gcd(12, 18))       # 6
print(round(math.pi, 4))      # 3.1416
