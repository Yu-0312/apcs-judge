{id:0,title:"什麼是程式？",tag:"入門",content:`
# 第 0 章：寫程式是什麼一回事？

歡迎！這是給**完全沒寫過程式**的你的第一章。讀完只要 5 分鐘。

## 🤔 程式 = 一份「給電腦看的食譜」

你寫好步驟 → 電腦照做 → 給你結果。就像炒菜的食譜：

\`\`\`
1. 把蛋打進碗裡
2. 加鹽
3. 倒進鍋子煎
\`\`\`

電腦的食譜長這樣：

\`\`\`python
name = "Alice"
print("Hello,", name)
\`\`\`

## 🧰 這個教學的三個區域

| 區域 | 用途 |
|------|------|
| **左側目錄** | 21 個章節，由淺到深，照順序點 |
| **中間（這裡）** | 教材文字 + 「動手試試」+ 小測驗 |
| **右側編輯器** | 真的可以改、可以執行的程式 |

## ▶️ 「執行」按鈕會發生什麼

右側上方有一顆綠色按鈕 **▶ 執行**。
- 按下去，電腦會「讀」右側的程式碼，照著做
- 結果會顯示在右下角的「📤 輸出」框
- **錯了也沒關係**！我們有自動把錯誤訊息翻譯成中文

## 🎯 你的目標（不用記）

讀完這 21 章，你會能：
- 看懂 Python 程式碼
- 寫程式解決小問題
- 準備好挑戰 APCS 初級的題目

> **小提示**：上方右邊有個「**新手模式**」開關（綠色就是開著）。開著時：
> - 只顯示 Python（不會被 C++/Java 干擾）
> - 必須通過每章小測驗，才能解鎖下一章
> - 程式出錯會自動翻譯成中文解釋

> 熟悉了之後可以關掉，就會解鎖所有章節跟其他語言。

接下來進入下方的「小測驗」，答對就能解鎖第 1 章。

{id:1,title:"變數與資料型別",tag:"基礎",content:`
# 第 1 章：變數與資料型別

## 1.1 什麼是變數
變數就是「會記住一個值的盒子」。在 Python 中，用 \`=\` 把右邊的值「貼」到左邊的名字上。

\`\`\`python
age = 17
name = "Alice"
height = 168.5
\`\`\`

## 1.2 四大基本型別

| 型別 | 名稱 | 範例 |
|------|------|------|
| int | 整數 | \`42\`, \`-7\`, \`0\` |
| float | 浮點數 | \`3.14\`, \`-0.5\` |
| str | 字串 | \`"hello"\`, \`'APCS'\` |
| bool | 布林 | \`True\`, \`False\` |

用 \`type()\` 可以看型別：

\`\`\`python
print(type(42))        # <class 'int'>
print(type(3.14))      # <class 'float'>
print(type("hi"))      # <class 'str'>
print(type(True))      # <class 'bool'>
\`\`\`

## 1.3 型別轉換
- \`int("42")\` → \`42\`（字串轉整數）
- \`str(42)\` → \`"42"\`（整數轉字串）
- \`float("3.14")\` → \`3.14\`

> **APCS 重點**：input() 讀進來都是字串，必須用 int() 或 float() 轉成數字才能運算！

## 1.4 試試看
按右側「執行」看看：
`,
example:`# 修改 age 試試
age = 17
name = "小明"
print(name, "今年", age, "歲")
print(name, "明年", age + 1, "歲")
`},

{id:2,title:"輸入與輸出",tag:"基礎",content:`
# 第 2 章：輸入與輸出 (I/O)

APCS 實作題九成都需要從 stdin 讀資料、用 print 輸出。

## 2.1 print() 輸出
\`\`\`python
print("Hello")           # Hello
print("a", "b", "c")     # a b c   (預設用空白分隔)
print(1, 2, sep=",")     # 1,2     (改成逗號分隔)
print("end", end="!")    # end!    (預設換行，改成 !)
\`\`\`

## 2.2 input() 輸入
\`input()\` 讀**一整行**，回傳**字串**。

\`\`\`python
name = input()             # 讀一行字串
age  = int(input())        # 讀一行，轉成整數
\`\`\`

## 2.3 一行多數字
最常見題型：第一行 n，第二行 n 個數字。
\`\`\`python
n = int(input())
nums = list(map(int, input().split()))
print(nums)
\`\`\`

\`split()\` 把字串依空白切成串列，\`map(int, ...)\` 把每個元素都轉成 int。

## 2.4 多行輸入

n = int(input())
for _ in range(n):
    line = input()
    print(line)

> **APCS 陷阱**：題目若沒給 n，可能要讀到 EOF。

{id:3,title:"運算子與表達式",tag:"基礎",content:`
# 第 3 章：運算子與表達式

## 3.1 算術運算子

| 運算子 | 意義 | 範例 | 結果 |
|--------|------|------|------|
| \`+\` | 加 | \`3+2\` | 5 |
| \`-\` | 減 | \`3-2\` | 1 |
| \`*\` | 乘 | \`3*2\` | 6 |
| \`/\` | 除（浮點） | \`7/2\` | 3.5 |
| \`//\` | 整除 | \`7//2\` | 3 |
| \`%\` | 取餘數 | \`7%2\` | 1 |
| \`**\` | 次方 | \`2**10\` | 1024 |

## 3.2 比較與邏輯

\`==\` \`!=\` \`<\` \`>\` \`<=\` \`>=\` 結果為 \`True\` / \`False\`。

\`\`\`python
print(3 > 2 and 5 < 10)   # True
print(3 > 2 or 5 > 10)    # True
print(not True)           # False
\`\`\`

## 3.3 APCS 常見技巧

### 個位、十位數
\`\`\`python
n = 263
print(n % 10)     # 3 (個位)
print(n // 10 % 10)  # 6 (十位)
print(n // 100)   # 2 (百位)
\`\`\`

### 奇偶判斷
\`\`\`python
if n % 2 == 0:
    print("偶數")
\`\`\`

### 連除取每一位
\`\`\`python
n = 12345
while n > 0:
    print(n % 10)  # 5, 4, 3, 2, 1
    n //= 10
\`\`\`

## 3.4 試試看
`,
example:`# 把一個三位數拆開
n = 752
hundreds = n // 100
tens = n // 10 % 10
ones = n % 10
print(f"百位={hundreds}, 十位={tens}, 個位={ones}")
print(f"加總={hundreds+tens+ones}")
`},

# 第 4 章：條件判斷

## 4.1 基本語法

if score >= 60:
    print("及格")
elif score >= 50:
    print("補考")
else:

\`\`\`python
a, b, c = sorted(map(int, input().split()))

elif a*a + b*b > c*c:

# 第 5 章：迴圈

## 5.1 for 迴圈

for i in range(5):       # 0,1,2,3,4
    print(i)

for i in range(1, 6):    # 1,2,3,4,5

## 5.4 break / continue
- \`break\`：直接離開迴圈
- \`continue\`：跳過剩下，進下一輪

# 第 6 章：字串

## 6.1 字串基本

\`\`\`python
s = "Hello, APCS"

print(s[2:])     # CDEFG

print(s[::-1])   # GFEDCBA  (反轉！)

## 6.3 常用方法

| 方法 | 用途 |
|------|------|
| \`s.split()\` | 切成 list |

## 6.4 APCS 案例：秘密差

s = input()
A = sum(int(s[-i-1]) for i in range(len(s)) if i % 2 == 0)  # 奇數位

# 第 7 章：List

List 是 APCS 最重要的資料結構，存「一串」資料。

## 7.1 建立 list
\`\`\`python
a = [10, 20, 30, 40]
b = list(map(int, input().split()))   # 從輸入讀
c = [0] * 5                            # [0,0,0,0,0]

## 7.2 存取與修改
\`\`\`python
a[0] = 100
print(a[-1])   # 最後一個
print(len(a))
\`\`\`

## 7.3 常用方法

| 方法 | 用途 | 範例 |
|------|------|------|
| \`a.append(x)\` | 尾端加 | \`[1,2].append(3)\` → \`[1,2,3]\` |
| \`a.pop()\` | 尾端移除 | |
| \`a.sort()\` | 原地排序 | |
| \`sorted(a)\` | 回傳新 list | |
| \`a.reverse()\` | 反轉 | |
| \`a.count(x)\` | 計數 | |
| \`a.index(x)\` | 找位置 | |
| \`sum(a)\` \`max(a)\` \`min(a)\` | | |

## 7.4 APCS 案例：成績指標

n = int(input())

{id:9,title:"函式 def",tag:"結構",content:`
# 第 9 章：函式

## 9.1 為什麼要函式
- 重複利用同段邏輯
- 把複雜問題切小
- 容易測試與除錯

## 9.2 定義與呼叫
\`\`\`python
def add(a, b):
    return a + b

print(add(3, 5))   # 8
\`\`\`

## 9.3 多個回傳值
\`\`\`python
def min_max(lst):
    return min(lst), max(lst)

lo, hi = min_max([3, 1, 4, 1, 5, 9])
print(lo, hi)   # 1 9
\`\`\`

## 9.4 預設參數
\`\`\`python
def greet(name, greeting="Hello"):
    print(greeting, name)

greet("Alice")              # Hello Alice
greet("Bob", "Hi")          # Hi Bob
\`\`\`

## 9.5 APCS 案例：判斷質數
\`\`\`python
def is_prime(n):
    if n < 2: return False
    for i in range(2, int(n**0.5) + 1):
        if n % i == 0: return False
    return True

for x in range(2, 20):
    if is_prime(x):
        print(x, end=" ")
\`\`\`

> **APCS 技巧**：把判斷邏輯拆成 helper function，主程式就清楚很多。

## 9.6 遞迴入門
函式呼叫自己 = 遞迴。
\`\`\`python
def fact(n):
    if n <= 1: return 1
    return n * fact(n-1)

print(fact(5))   # 120
\`\`\`

{id:10,title:"字典 Dict 與集合 Set",tag:"資料",content:`
# 第 10 章：字典與集合

## 10.1 Dict（鍵-值對）
\`\`\`python
score = {"Alice": 90, "Bob": 75}
print(score["Alice"])         # 90
score["Cathy"] = 88           # 新增
score["Alice"] = 100          # 修改

走訪：

    print(name, s)

## 10.2 計數神器：Counter / get
APCS 經常要算「每個字出現幾次」：

\`\`\`python
s = "ABBCAAB"
cnt = {}
for c in s:
    cnt[c] = cnt.get(c, 0) + 1
print(cnt)   # {'A': 3, 'B': 3, 'C': 1}

更簡潔：

from collections import Counter

## 10.3 Set（集合，去重）
\`\`\`python
nums = [1, 2, 2, 3, 3, 3, 4]

print(len(set(nums)))    # 4 (相異元素數)

## 10.4 APCS 案例：最少相異字母
\`\`\`python
n = int(input())
best = None
for _ in range(n):
    s = input()
    k = len(set(s))   # 相異字母數

words = "the quick brown fox jumps over the lazy dog the fox".split()

{id:11,title:"演算法基礎",tag:"進階",content:`
# 第 11 章：APCS 必備演算法

## 11.1 線性搜尋
\`\`\`python
def find(L, target):
    for i, x in enumerate(L):
        if x == target: return i
    return -1
\`\`\`

## 11.2 排序
Python 內建 \`sort()\` 就夠 APCS 初級用。

\`\`\`python
nums.sort()                       # 升冪
nums.sort(reverse=True)           # 降冪
nums.sort(key=lambda x: -x)       # 自訂排序鍵

# 多條件排序：先依分數降冪，分數同則名字升冪
students.sort(key=lambda x: (-x[1], x[0]))
\`\`\`

## 11.3 二分搜尋（中級）
適用於**已排序**的資料。

\`\`\`python
def bsearch(L, target):
    lo, hi = 0, len(L) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if L[mid] == target: return mid
        if L[mid] < target: lo = mid + 1
        else: hi = mid - 1
    return -1
\`\`\`

或用內建：\`from bisect import bisect_left\`

## 11.4 前綴和（中級）
讓「區間總和」變 O(1)。

\`\`\`python
a = [3, 1, 4, 1, 5, 9, 2, 6]
ps = [0]
for x in a:
    ps.append(ps[-1] + x)

# a[l..r] 總和（含 l, r, 0-indexed）
def range_sum(l, r):
    return ps[r+1] - ps[l]
\`\`\`

## 11.5 質數篩（埃氏篩）
\`\`\`python
N = 100
sieve = [True] * (N+1)
sieve[0] = sieve[1] = False
for i in range(2, int(N**0.5)+1):
    if sieve[i]:
        for j in range(i*i, N+1, i):
            sieve[j] = False
primes = [i for i in range(N+1) if sieve[i]]
\`\`\`

## 11.6 GCD / LCM
\`\`\`python
def gcd(a, b):
    while b:
        a, b = b, a % b
    return a

def lcm(a, b):
    return a * b // gcd(a, b)
\`\`\`

## 11.7 試試看
`,
example:`# 前綴和應用：找子陣列總和 = K 的個數
a = [1, 2, 3, 4, 5, 2, 1, 3]
K = 5

ps = [0]
for x in a:
    ps.append(ps[-1] + x)

cnt = 0
for i in range(len(a)):
    for j in range(i, len(a)):
        if ps[j+1] - ps[i] == K:
            cnt += 1
            print(f"  a[{i}..{j}] = {a[i:j+1]}")
print(f"\\n共 {cnt} 個子陣列總和為 {K}")
`},

# 第 12 章：巢狀迴圈

## 13.1 雙層迴圈

        if a[i] + a[j] == K:
            print(i, j); break

    for j in range(i+1, n):
        for k in range(j+1, n):
            ...

example:`# 印帕斯卡三角形

for i in range(1, n):

        g[i].insert(j, g[i-1][j-1] + g[i-1][j])

    print(' '.join(f"{x:2}" for x in g[i]))

{id:13,title:"List Comprehension 進階",tag:"資料",content:`
# 第 13 章：List Comprehension

## 14.1 基本形式
\`[expr for x in iterable]\`

\`\`\`python
squares = [x*x for x in range(10)]
\`\`\`

## 14.2 加條件過濾
\`\`\`python
evens = [x for x in range(20) if x % 2 == 0]
\`\`\`

## 14.3 條件運算式（三元）
\`\`\`python
labels = ['偶' if x % 2 == 0 else '奇' for x in range(10)]
\`\`\`

## 14.4 雙層 list comprehension
\`\`\`python
pairs = [(i, j) for i in range(3) for j in range(3) if i != j]

## 14.5 攤平 2D
\`\`\`python
g = [[1,2,3],[4,5,6]]
flat = [x for row in g for x in row]  # [1,2,3,4,5,6]

{id:15,title:"遞迴入門",tag:"進階",content:`
# 第 15 章：遞迴 (Recursion)

## 16.1 什麼是遞迴？
函式呼叫自己。所有遞迴都需要：
1. **基礎情況 (base case)**：能直接答出的最小問題
2. **遞迴關係**：把問題化簡成更小的同類問題

## 16.2 階乘
\`\`\`python
def fact(n):
    if n <= 1: return 1       # base
    return n * fact(n-1)      # 遞迴
\`\`\`

## 16.3 費氏數列
\`\`\`python
def fib(n):
    if n < 2: return n
    return fib(n-1) + fib(n-2)
\`\`\`
> ⚠️ 直接遞迴算 fib(40) 會很慢！要加 memo。

## 16.4 加記憶（memoization）
\`\`\`python
from functools import lru_cache

@lru_cache
def fib(n):
    if n < 2: return n
    return fib(n-1) + fib(n-2)

print(fib(100))   # 瞬間
\`\`\`

## 16.5 河內塔
\`\`\`python
def hanoi(n, a, b, c):  # n 個盤從 a 經 b 移到 c
    if n == 0: return
    hanoi(n-1, a, c, b)
    print(f"移盤 {n}: {a} → {c}")
    hanoi(n-1, b, a, c)

hanoi(3, 'A', 'B', 'C')
\`\`\`

## 16.6 APCS 高頻：回溯 (Backtracking)
\`\`\`python
def perms(arr, path):
    if not arr:
        print(path); return
    for i in range(len(arr)):
        perms(arr[:i] + arr[i+1:], path + [arr[i]])

perms([1,2,3], [])
\`\`\`

## 16.7 試試看
`,
example:`# 8 皇后計數
def queens(n):
    count = [0]
    def solve(row, cols, d1, d2):
        if row == n:
            count[0] += 1
            return
        for c in range(n):
            if c in cols or row-c in d1 or row+c in d2:
                continue
            cols.add(c); d1.add(row-c); d2.add(row+c)
            solve(row+1, cols, d1, d2)
            cols.remove(c); d1.remove(row-c); d2.remove(row+c)
    solve(0, set(), set(), set())
    return count[0]

for n in range(4, 9):
    print(f"{n} 皇后有 {queens(n)} 種放法")
`},

{id:17,title:"進階資料結構",tag:"進階",content:`
# 第 17 章：進階資料結構

## 18.1 deque（雙端佇列）
從兩端都能 O(1) push/pop。

\`\`\`python
from collections import deque

q = deque([1, 2, 3])
q.append(4)        # [1,2,3,4]
q.appendleft(0)    # [0,1,2,3,4]
q.pop()            # 4
q.popleft()        # 0
\`\`\`

**用途**：BFS、滑動視窗。

## 18.2 heap（堆）
取最小值 O(log n)。Python 是「小堆」。

\`\`\`python
import heapq

h = []
heapq.heappush(h, 5)
heapq.heappush(h, 2)
heapq.heappush(h, 8)
print(heapq.heappop(h))   # 2 (最小)
\`\`\`

**用途**：Dijkstra、第 k 小、合併多串。

## 18.3 Counter
快速計數。
\`\`\`python
from collections import Counter
c = Counter("APCSAPCS")
print(c.most_common(2))   # [('A',2), ('P',2)]
\`\`\`

## 18.4 defaultdict
自動建立預設值。
\`\`\`python
from collections import defaultdict
d = defaultdict(list)
d["A"].append(1)
d["A"].append(2)
print(d["A"])   # [1, 2]
\`\`\`

## 18.5 BFS 模板
\`\`\`python
from collections import deque
def bfs(start, grid):
    n, m = len(grid), len(grid[0])
    q = deque([start])
    visited = {start}
    while q:
        x, y = q.popleft()
        for dx, dy in [(-1,0),(1,0),(0,-1),(0,1)]:
            nx, ny = x+dx, y+dy
            if 0<=nx<n and 0<=ny<m and grid[nx][ny]==0 and (nx,ny) not in visited:
                visited.add((nx,ny))
                q.append((nx,ny))
\`\`\`

## 18.6 試試看
`,
example:`# 用 heap 找前 3 大
import heapq
nums = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]
print("前 3 大:", heapq.nlargest(3, nums))
print("前 3 小:", heapq.nsmallest(3, nums))

# 用 Counter 找最常出現的字
from collections import Counter
s = "the quick brown fox jumps over the lazy dog"
c = Counter(s.split())
print("字頻 Top 2:", c.most_common(2))
`},

{id:18,title:"常見錯誤與除錯",tag:"進階",content:`
# 第 18 章：常見錯誤與除錯

## 19.1 縮排錯誤 IndentationError
**Python 用縮排定範圍。不可混用 tab 與空白。**
建議：永遠用 4 個空白。

## 19.2 名稱錯誤 NameError
\`\`\`python
print(x)   # NameError if x not defined
\`\`\`
通常是拼錯字或忘了宣告。

## 19.3 型別錯誤 TypeError
\`\`\`python
print("年齡:" + 17)   # TypeError: str + int
# 改成 print("年齡:" + str(17))
# 或    print(f"年齡:{17}")
\`\`\`

## 19.4 索引錯誤 IndexError
\`\`\`python
a = [1, 2, 3]
print(a[3])   # IndexError, 沒有索引 3
\`\`\`
記住：len(a) 個元素，索引是 0 ~ len(a)-1。

## 19.5 整數除法陷阱
\`\`\`python
print(7 / 2)    # 3.5 (浮點)
print(7 // 2)   # 3 (整除)
print(-7 // 2)  # -4 (向下取整，不是 -3！)
\`\`\`

## 19.6 2D list 的引用陷阱
\`\`\`python
g = [[0]*3] * 3
g[0][0] = 1
print(g)
# 期望: [[1,0,0],[0,0,0],[0,0,0]]
# 實際: [[1,0,0],[1,0,0],[1,0,0]]  全變了！
# 正解: g = [[0]*3 for _ in range(3)]
\`\`\`

## 19.7 除錯三招

1. **print 大法**：在關鍵位置印變數值
2. **小例子試**：n=1, n=2 邊界
3. **讀錯誤訊息**：行號通常準確

## 19.8 試試看：找 bug
`,
example:`# 這支程式想算 1+2+3+...+n 但有 bug
# 試著修正
def sum_to(n):
    total = 0
    for i in range(n):
        total += i
    return total

# 預期: sum_to(5) = 15
print(sum_to(5))   # 應該是 15 但實際是？

# 提示：range(n) 是 0..n-1
# 修正方法（取消註解）:
# def sum_to(n):
#     total = 0
#     for i in range(1, n+1):
#         total += i
#     return total

{id:19,title:"綜合練習：完整 APCS 題",tag:"實戰",content:`
# 第 19 章：完整 APCS 題解析

## 20.1 解題流程示範

題目：**成績指標**（2016/03 APCS 初級）

> 讀入全班成績，排序後找出**不及格中的最高分**和**及格中的最低分**（60 分為及格界線）。

### Step 1：讀清楚題目
- 輸入：第一行人數 n，第二行 n 個分數
- 輸出：排序後分數 / 最高不及格 / 最低及格
- 找不到時印 best case 或 worst case

### Step 2：想小例子
輸入 \`[55, 88, 60, 30]\`
排序後 \`[30, 55, 60, 88]\`
不及格 \`[30, 55]\` → 最高 55
及格 \`[60, 88]\` → 最低 60

### Step 3：選資料結構與演算法
- 排序：\`sort()\` 或 \`sorted()\`
- 篩選：list comprehension

### Step 4：動手寫
\`\`\`python
n = int(input())
scores = sorted(map(int, input().split()))
print(*scores)

fail = [x for x in scores if x < 60]
print(max(fail) if fail else "best case")

passed = [x for x in scores if x >= 60]
print(min(passed) if passed else "worst case")
\`\`\`

### Step 5：測樣本與邊界
- 樣本 1：\`[0,11,22,33,55,66,77,99,88,44]\` ✅
- 樣本 2：\`[13]\` → 全不及格 → worst case ✅
- 樣本 3：\`[73,65]\` → 全及格 → best case + 65 ✅

## 20.2 APCS 應試節奏

| 時間 | 動作 |
|------|------|
| 0-2 分 | 讀題、圈關鍵字 |
| 2-5 分 | 思考演算法、確認邊界 |
| 5-15 分 | 寫程式 |
| 15-18 分 | 用樣本測試 |
| 18-20 分 | 測邊界值（n=1、全相同） |

## 20.3 試試看：完整流程
`,
example:`# 試做：找最大連續子陣列和 (Kadane 演算法)
# 輸入: 9 個整數 -2 1 -3 4 -1 2 1 -5 4
# 輸出: 6 (子陣列 [4,-1,2,1])

stdin = "9\\n-2 1 -3 4 -1 2 1 -5 4\\n"
import io, sys
sys.stdin = io.StringIO(stdin)

n = int(input())
a = list(map(int, input().split()))

cur = best = a[0]
for x in a[1:]:
    cur = max(x, cur + x)
    best = max(best, cur)

print(f"輸入: {a}")
print(f"最大連續和: {best}")
`},

# 第 20 章：APCS 實戰技巧

## 12.1 讀入模板（背起來）

\`\`\`python
# 模板 1：固定行數
n = int(input())
nums = list(map(int, input().split()))

# 模板 2：n 行各一筆
n = int(input())
data = [input() for _ in range(n)]

# 模板 3：n x m 矩陣

g = [list(map(int, input().split())) for _ in range(n)]

# 模板 4：讀到 EOF
import sys
for line in sys.stdin:
    line = line.strip()
    if not line: continue
    # 處理 line
\`\`\`

## 12.2 輸出格式

\`\`\`python
# 空白分隔
print(*nums)            # 1 2 3 4 5

# 換行分隔
print(*nums, sep="\\n")

# 自訂分隔
print(",".join(map(str, nums)))   # 1,2,3,4,5

# 浮點數兩位小數
print(f"{x:.2f}")
\`\`\`

## 12.3 常見錯誤

> ❌ \`int(input().split())\` — split 回傳 list，不能直接 int
> ✅ \`list(map(int, input().split()))\`

> ❌ \`a = b = [0]*5\` 後改 a，b 也變 — 它們指向同一個 list
> ✅ \`a, b = [0]*5, [0]*5\`

> ❌ \`[[0]*m]*n\` — n 個 row 指向同一個！
> ✅ \`[[0]*m for _ in range(n)]\`

## 12.4 解題流程（重要！）

1. **讀題**：圈關鍵詞 — 數量級、輸入格式、邊界條件
2. **想例子**：用小例子算一遍
3. **設計流程**：先寫註解，再寫程式
4. **動手寫**：先求對，再求快
5. **測樣本**：所有樣本都過才提交
6. **想邊界**：n=1？全相同？空輸入？

## 12.5 時間複雜度速覽

| 寫法 | 大致複雜度 | n 上限 |
|------|-----------|--------|
| 兩層 for | O(n²) | n ≤ 5000 |
| 一層 for + sort | O(n log n) | n ≤ 10⁶ |
| 一層 for | O(n) | n ≤ 10⁷ |
| 二分搜尋 | O(log n) | n ≤ 10⁹ |

// ── 常見錯誤訊息翻譯 ─────────────────────────────────────────────────────
function translateError(raw){
  if(!raw) return '';
  const lines = raw.split('\n');
  let last = '';
  for(let i = lines.length - 1; i >= 0; i--){
    if(lines[i].trim()){ last = lines[i]; break; }
  }
  const rules = [
    {re:/NameError: name '(.+?)' is not defined/, msg:(m)=>`<b>變數沒定義</b>：你用了 <code>${m[1]}</code>，但前面從沒設定它的值。檢查拼字、或在使用前先 <code>${m[1]} = ...</code>。`},
    {re:/IndentationError|unexpected indent|expected an indented block/, msg:()=>`<b>縮排錯了</b>：Python 用空白來分組，<code>if</code>/<code>for</code>/<code>def</code> 下一行一定要往內縮 4 個空白。同一段也要對齊。`},
    {re:/SyntaxError: invalid syntax/, msg:()=>`<b>語法錯誤</b>：通常是漏冒號 <code>:</code>、漏括號、引號沒成對。看一下錯誤指到的那一行附近。`},
    {re:/SyntaxError: EOL while scanning string literal|unterminated string/, msg:()=>`<b>字串沒收尾</b>：開了 <code>"</code> 或 <code>'</code> 但沒關起來。`},
    {re:/ZeroDivisionError/, msg:()=>`<b>除以 0 了</b>：檢查除號右邊的值是不是 0，或先用 if 擋掉。`},
    {re:/TypeError: unsupported operand type.*'(\w+)'.* and '(\w+)'/, msg:(m)=>`<b>型別不能相加 / 相減</b>：<code>${m[1]}</code> 和 <code>${m[2]}</code> 不能直接運算。常見：字串 + 數字 → 要先 <code>str()</code> 或 <code>int()</code>。`},
    {re:/TypeError: '(\w+)' object is not (subscriptable|iterable|callable)/, msg:(m)=>`<b>型別錯用</b>：<code>${m[1]}</code> 物件不能被「${m[2]==='subscriptable'?'用 []':m[2]==='iterable'?'用 for 走訪':'呼叫'}」。`},
    {re:/TypeError/, msg:()=>`<b>型別錯誤</b>：兩邊型別不合（例如字串 + 數字）。用 <code>int(x)</code> / <code>str(x)</code> 轉換看看。`},
    {re:/ValueError: invalid literal for int\(\)/, msg:()=>`<b>int() 收到不是數字的字串</b>：例如 <code>int("abc")</code> 會錯。檢查 input 是不是有空白或非數字字元。`},
    {re:/ValueError/, msg:()=>`<b>值不合法</b>：函式收到它不接受的值。看看你傳了什麼。`},
    {re:/IndexError: list index out of range/, msg:()=>`<b>list 索引超出範圍</b>：list 只有 0 到 len(list)-1。檢查迴圈條件是不是寫成 <code><=</code> 變成多跑一格。`},
    {re:/IndexError/, msg:()=>`<b>索引超出範圍</b>：要存取的位置不存在。`},
    {re:/KeyError: '?(.+?)'?$/, msg:(m)=>`<b>字典找不到這個 key</b>：<code>${m[1]}</code> 不在字典裡。用 <code>d.get(key, 預設值)</code> 比較安全。`},
    {re:/AttributeError: '(\w+)' object has no attribute '(\w+)'/, msg:(m)=>`<b>物件沒這個方法</b>：<code>${m[1]}</code> 沒有 <code>.${m[2]}()</code>。檢查拼字，或是不是用錯型別（例如把 str 當 list 用）。`},
    {re:/RecursionError/, msg:()=>`<b>遞迴太深</b>：函式呼叫自己沒有終止條件，或終止條件永遠到不了。檢查 base case。`},
    {re:/ModuleNotFoundError|ImportError/, msg:()=>`<b>找不到模組</b>：可能是這個套件瀏覽器版 Python 沒有。試試標準函式庫的功能。`}
  ];
  for(const r of rules){
    const m = last.match(r.re);
    if(m) return `<div class="err-hint">💡 ${r.msg(m)}</div>`;
  }
  return '';
}

// ── 進度與新手模式 ────────────────────────────────────────────────────────
let beginnerMode = (localStorage.getItem('tut_beginner') ?? '1') === '1';
let completed = new Set(JSON.parse(localStorage.getItem('tut_done') || '[]'));
function saveState(){
  localStorage.setItem('tut_beginner', beginnerMode ? '1' : '0');
  localStorage.setItem('tut_done', JSON.stringify([...completed]));
}
function isUnlocked(id){
  if(!beginnerMode) return true;
  if(id <= 0) return true;
  return completed.has(id - 1);
}
function markDone(id){
  if(!completed.has(id)){
    completed.add(id);
    saveState();
    updateProgress();
    renderChapList();
  }
}
function updateProgress(){
  const total = CHAPTERS.length;
  const done = [...completed].filter(x => x >= 0 && x < total).length;
  const pct = Math.round(done / total * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-count').textContent = `${done} / ${total} 章`;
  document.getElementById('prog-pct').textContent = pct + '%';
}
function toggleBeginnerMode(){
  beginnerMode = !beginnerMode;
  saveState();
  const t = document.getElementById('mode-toggle');
  t.classList.toggle('on', beginnerMode);
  document.getElementById('mode-label').textContent = beginnerMode ? '新手模式' : '完整模式';
  document.body.classList.toggle('beginner', beginnerMode);
  if(beginnerMode && currentLang !== 'py') switchLang('py');
  renderChapList();
  if(currentChap) selectChap(currentChap.id);
}

// ── 小測驗渲染與互動 ──────────────────────────────────────────────────────
let quizState = {};   // {chapId: {qIdx: pickedIdx}}
function renderMeta(chap){
  const meta = CHAPTER_META[chap.id];
  if(!meta) return '';
  let html = '';
  if(meta.learn?.length){
    html += `<div class="learn-box"><div class="lh">🎯 這章你會學到</div><ul>${meta.learn.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  if(meta.try?.length){
    html += `<div class="try-box"><div class="lh">✋ 動手試試（改右邊程式碼）</div><ol>${meta.try.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
  }
  if(meta.quiz?.length){
    const state = quizState[chap.id] || {};
    html += `<div class="quiz-box"><div class="lh">📝 小測驗${beginnerMode?'（答對全部解鎖下一章）':''}</div>`;
    meta.quiz.forEach((q, qi) => {
      html += `<div class="quiz-q">Q${qi+1}. ${q.q}</div>`;
      q.opts.forEach((opt, oi) => {
        const picked = state[qi];
        let cls = 'quiz-opt';
        if(picked !== undefined){
          cls += ' locked';
          if(oi === q.ans) cls += ' correct';
          else if(oi === picked) cls += ' wrong';
        }
        html += `<button class="${cls}" onclick="pickQuiz(${chap.id},${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
      });
      if(state[qi] !== undefined){
        html += `<div class="quiz-explain">💡 ${q.why}</div>`;
      }
    });
    const answered = meta.quiz.every((q, qi) => state[qi] !== undefined);
    if(answered){
      const allRight = meta.quiz.every((q, qi) => state[qi] === q.ans);
      if(allRight){
        html += `<div class="quiz-status pass">🎉 全對！${chap.id < CHAPTERS.length-1 ? '已解鎖第 ' + (chap.id+1) + ' 章' : '你已經完成全部教學！'}</div>`;
        if(!completed.has(chap.id)) setTimeout(()=>markDone(chap.id), 100);
      } else {
        const wrongCount = meta.quiz.filter((q,qi)=>state[qi]!==q.ans).length;
        html += `<div class="quiz-status fail">還有 ${wrongCount} 題不對。看完解釋後，重新整理頁面再試一次。</div>`;
      }
    }
    html += `</div>`;
  }
  return html;
}
function pickQuiz(chapId, qi, oi){
  if(!quizState[chapId]) quizState[chapId] = {};
  if(quizState[chapId][qi] !== undefined) return; // 已作答
  quizState[chapId][qi] = oi;
  if(currentChap && currentChap.id === chapId) selectChap(chapId);
}

cpp:`#include <iostream>\nusing namespace std;\nint N, cnt;\nvoid solve(int row, int cols, int d1, int d2){\n    if (row == N) { cnt++; return; }\n    for (int c = 0; c < N; c++) {\n        int cb = 1 << c;\n        int d1b = 1 << (row - c + N);\n        int d2b = 1 << (row + c);\n        if ((cols & cb) || (d1 & d1b) || (d2 & d2b)) continue;\n        solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n    }\n}\nint main(){\n    for (N = 4; N <= 8; N++) {\n        cnt = 0;\n        solve(0, 0, 0, 0);\n        cout << N << " 皇后有 " << cnt << " 種放法\\n";\n    }\n    return 0;\n}`,
c:`#include <stdio.h>\nint N, cnt;\nvoid solve(int row, int cols, int d1, int d2){\n    if (row == N) { cnt++; return; }\n    for (int c = 0; c < N; c++) {\n        int cb = 1 << c;\n        int d1b = 1 << (row - c + N);\n        int d2b = 1 << (row + c);\n        if ((cols & cb) || (d1 & d1b) || (d2 & d2b)) continue;\n        solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n    }\n}\nint main(){\n    for (N = 4; N <= 8; N++) {\n        cnt = 0;\n        solve(0, 0, 0, 0);\n        printf("%d 皇后有 %d 種放法\\n", N, cnt);\n    }\n    return 0;\n}`,
java:`public class Main {\n    static int N, cnt;\n    static void solve(int row, int cols, int d1, int d2) {\n        if (row == N) { cnt++; return; }\n        for (int c = 0; c < N; c++) {\n            int cb = 1 << c;\n            int d1b = 1 << (row - c + N);\n            int d2b = 1 << (row + c);\n            if ((cols & cb) != 0 || (d1 & d1b) != 0 || (d2 & d2b) != 0) continue;\n            solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n        }\n    }\n    public static void main(String[] args) {\n        for (N = 4; N <= 8; N++) {\n            cnt = 0;\n            solve(0, 0, 0, 0);\n            System.out.println(N + " 皇后有 " + cnt + " 種放法");\n        }\n    }\n}`

c:`/* C 沒有 priority_queue，用 sort + 取前 K 個 */\n#include <stdio.h>\n#include <stdlib.h>\nint cmp(const void* a, const void* b){return *(int*)a - *(int*)b;}\nint main(){\n    int nums[] = {3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5};\n    int n = 11;\n    int sorted[20];\n    for (int i = 0; i < n; i++) sorted[i] = nums[i];\n    qsort(sorted, n, sizeof(int), cmp);\n    printf("前 3 小: ");\n    for (int i = 0; i < 3; i++) printf("%d ", sorted[i]);\n    printf("\\n前 3 大: ");\n    for (int i = n-1; i >= n-3; i--) printf("%d ", sorted[i]);\n    printf("\\n");\n    return 0;\n}`,

function renderChapList() {
  const list = document.getElementById('chap-list');
  list.innerHTML = '';
  CHAPTERS.forEach(c => {
    const div = document.createElement('div');
    const locked = !isUnlocked(c.id);
    const done = completed.has(c.id);
    div.className = 'chap' + (done ? ' done' : '') + (locked ? ' locked' : '');
    div.onclick = () => { if(!locked) selectChap(c.id); };
    div.id = 'chap-' + c.id;
    div.innerHTML = `<div class="chap-num">第 ${c.id} 章 · ${c.tag}</div><div class="chap-title">${c.title}</div>`;
    list.appendChild(div);
  });
}

function selectChap(id) {
  currentChap = CHAPTERS.find(c => c.id === id);
  if(!currentChap) return;
  document.querySelectorAll('.chap').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('chap-' + id);
  if(el) el.classList.add('active');
  document.getElementById('lesson-title').textContent = `第 ${currentChap.id} 章：${currentChap.title}`;
  document.getElementById('lesson-tag').textContent = currentChap.tag;
  document.getElementById('lesson-body').innerHTML = marked.parse(currentChap.content) + renderMeta(currentChap);
  cm.setValue(getExample(currentChap));
  document.getElementById('stdin-input').value = getStdin(currentChap);
  document.getElementById('output-body').textContent = '點擊上方「執行」測試程式';
  // 滾回頂端
  document.getElementById('lesson-body').scrollTop = 0;
}

function clearEditor() { cm.setValue(''); }
function resetExample() {
  if (currentChap) {
    cm.setValue(getExample(currentChap));
    document.getElementById('stdin-input').value = getStdin(currentChap);
  }
}

async function runCode() {
  const code = cm.getValue();
  const stdin = document.getElementById('stdin-input').value;
  const out = document.getElementById('output-body');
  out.textContent = '執行中...';

  try {
    if (currentLang === 'py') {
      if (!pyodide) { out.textContent = 'Pyodide 尚未載入'; return; }
      pyodide.globals.set('__user_stdin', stdin);
      pyodide.globals.set('__user_code', code);
      await pyodide.runPythonAsync(`
import sys, io, traceback
__buf = io.StringIO()
__old_in, __old_out, __old_err = sys.stdin, sys.stdout, sys.stderr
sys.stdin = io.StringIO(__user_stdin)
sys.stdout = __buf
sys.stderr = __buf
try:
    exec(__user_code, {'__name__': '__main__'})
except SystemExit:
    pass
except BaseException:
    traceback.print_exc(file=__buf)
finally:
    sys.stdin, sys.stdout, sys.stderr = __old_in, __old_out, __old_err
__result = __buf.getvalue()
`);
      const result = pyodide.globals.get('__result') || '(無輸出)';
      const hint = translateError(result);
      if(hint){
        out.innerHTML = '';
        const pre = document.createElement('div');
        pre.textContent = result;
        out.appendChild(pre);
        const hintDiv = document.createElement('div');
        hintDiv.innerHTML = hint;
        out.appendChild(hintDiv);
      } else {
        out.textContent = result;
      }
    } else if (currentLang === 'cpp' || currentLang === 'c') {
      let buf = '';
      try {
        JSCPP.run(code, stdin, { stdio: { write: s => { buf += s; } } });
        out.textContent = buf || '(無輸出)';
      } catch (e) {
        out.textContent = (buf ? buf + '\n' : '') + 'JSCPP 錯誤：\n' + String(e.message || e).split('\n').slice(0, 6).join('\n');
      }
    } else { // java
      const res = await fetch('https://emkc.org/api/v2/piston/execute', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: 'java', version: '15.0.2', files: [{ name: 'Main.java', content: code }], stdin, run_timeout: 8000 })
      });
      const data = await res.json();
      const stdout = data.run?.stdout || '';
      const stderr = data.run?.stderr || data.compile?.stderr || '';
      out.textContent = (stdout + (stderr ? '\n[stderr]\n' + stderr : '')) || '(無輸出)';
    }
  } catch (e) {
    out.textContent = '錯誤：\n' + (e.message || e);
  }
}
