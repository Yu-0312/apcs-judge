c:`# Chapter 37: Dynamic Memory — malloc / free

When you don't know the data size, or need to decide size at runtime, use \`malloc\` to request memory from the system.

## 37.1 malloc / free Basics

\`\`\`c
#include <stdlib.h>

int *arr = malloc(n * sizeof(int));
if (arr == NULL) { /* allocation failed */ exit(1); }

for (int i = 0; i < n; i++) arr[i] = i;

free(arr);            // always return when done
arr = NULL;           // prevent subsequent misuse
\`\`\`

> \`sizeof(int)\` is usually 4. \`malloc(n)\` gets n bytes; for n ints use \`n * sizeof(int)\`.

## 37.2 calloc — Allocate + Zero-Initialize

\`\`\`c
int *arr = calloc(n, sizeof(int));     // auto-initialized to 0
\`\`\`

\`malloc\` content is garbage values; \`calloc\` guarantees 0.

## 37.3 realloc — Resize

\`\`\`c
arr = realloc(arr, new_n * sizeof(int));
\`\`\`

May move to a new location — original \`arr\` pointer is invalid; use the return value to update.

## 37.4 2D Arrays: Array of Arrays

\`\`\`c
int **grid = malloc(rows * sizeof(int *));
for (int i = 0; i < rows; i++) {
    grid[i] = malloc(cols * sizeof(int));
}
// free one by one when done
for (int i = 0; i < rows; i++) free(grid[i]);
free(grid);
\`\`\`

> 10× more painful than Python's \`[[0]*cols for _ in range(rows)]\` — but flexible.

## 37.5 Common Mistakes

| Mistake | Consequence |
|---------|-------------|
| Forgot \`free\` | Memory leak |
| \`free\` twice | Program crash or corrupt heap |
| Using pointer after \`free\` | Undefined (dangling pointer) |
| Writing beyond \`malloc\` range | Heap overflow, may not fail immediately |
| \`free(p+1)\` | Undefined, can only free the original pointer returned by malloc |

**Most common pain point**: function \`malloc\`s but forgets to \`free\` → program grows larger over time (leak).

## 37.6 valgrind — Leak Detection Tool

\`\`\`bash
valgrind --leak-check=full ./prog
\`\`\`

Every malloc without a corresponding free is listed, pointing to the exact line.

## 37.7 Stack vs Heap

| | stack | heap |
|---|---|---|
| Allocation | Automatic (local variables) | \`malloc\` |
| Release | Automatic (leaving function) | \`free\` |
| Speed | Very fast | Slow |
| Size | Small (usually ~8MB) | Large (GB scale) |
| Failure | StackOverflow | malloc returns NULL |

\`\`\`c
int big[10000000];   // ❌ stack overflow (exceeds stack size)
int *big = malloc(10000000 * sizeof(int));   // ✅ heap is fine
\`\`\`

> For APCS problems, arrays of 10^6 or more should be global or use malloc, not local variables inside functions.

## 37.8 Custom Simple Memory Pool

malloc/free in hot loops is slow — allocate one large block and manage it yourself:

\`\`\`c
char pool[1<<20];
int pool_used = 0;
void* my_alloc(size_t n){
    void* p = pool + pool_used;
    pool_used += n;
    return p;
}
\`\`\`

Common technique in OI competitions for Trie/segment trees, several times faster than dynamic malloc.

c:`# Chapter 38: Advanced struct and union

## 38.1 struct Basics

\`\`\`c
struct Point { int x, y; };
struct Point p = {3, 4};
printf("%d %d\\n", p.x, p.y);
\`\`\`

Or use \`typedef\` to simplify:
\`\`\`c
typedef struct { int x, y; } Point;
Point p = {3, 4};
\`\`\`

## 38.2 Designated Field Initialization (C99+)

\`\`\`c
Point p = {.x = 3, .y = 4};
\`\`\`

Order doesn't matter; unspecified fields default to 0.

## 38.3 Nested structs

\`\`\`c
typedef struct {
    Point top_left;
    Point bot_right;
} Rect;
Rect r = {{0, 0}, {10, 5}};
printf("%d\\n", r.top_left.x);
\`\`\`

## 38.4 struct Size and Padding

\`\`\`c
struct A { char c; int i; };
printf("%zu\\n", sizeof(struct A));   // usually 8, not 5
\`\`\`

CPU alignment rules: int usually starts at multiples of 4. So 3 bytes of padding are inserted after char.

> **Ordering fields wisely** (large ones first) can save space.

## 38.5 union — Sharing Memory

\`\`\`c
union Data {
    int i;
    float f;
    char s[4];
};
union Data d;
d.i = 0x41424344;
printf("%s\\n", d.s);     // "DCBA" or "ABCD" (depends on endianness)
\`\`\`

All fields share the same memory block; size = size of the largest field. Common use: type-punning hack, variants.

## 38.6 Tagged union

\`\`\`c
typedef struct {
    enum { TYPE_INT, TYPE_STR } type;
    union {
        int i;
        char *s;
    } data;
} Variant;
\`\`\`

Simulating "dynamic typing" — Python variables can hold anything; in C you do it this way by hand.

## 38.7 Bit Fields — Packed struct

Memory-efficient compressed struct:

\`\`\`c
struct Flags {
    unsigned int is_open  : 1;
    unsigned int is_dirty : 1;
    unsigned int level    : 4;   // 0..15
    unsigned int type     : 2;   // 0..3
};   // entire struct is 8 bits = 1 byte (compiler decides padding)
\`\`\`

Common in device drivers and network packet parsing.

## 38.8 Anonymous struct/union (C11)

\`\`\`c
struct {
    int kind;
    union {
        int i;
        char *s;
    };   // no name needed!
} x;
x.kind = 1;
x.i = 42;       // write directly, no need for x.data.i
\`\`\`

Makes tagged unions cleaner to use.

c:`# Chapter 39: Function Pointers and Callbacks

C has no lambdas, no closures — function abstraction relies on **function pointers**.

## 39.1 Function Pointer Declaration

\`\`\`c
int add(int a, int b) { return a + b; }

int main(void) {
    int (*f)(int, int) = add;    // f is a "pointer to a function taking two ints and returning int"
    printf("%d\\n", f(3, 5));     // 8
    return 0;
}
\`\`\`

**Reading rule**: frame the name — \`(*f)\` = f is a pointer, \`(int, int)\` = points to two-parameter function, \`int\` = returns int.

## 39.2 typedef Makes Declarations Readable

\`\`\`c
typedef int (*BinOp)(int, int);
BinOp f = add;
\`\`\`

\`BinOp\` is the type "function pointer taking two ints and returning int".

## 39.3 qsort Uses Function Pointers

\`\`\`c
#include <stdlib.h>

int cmp(const void *a, const void *b) {
    return *(int*)a - *(int*)b;
}

int main(void) {
    int arr[] = {3, 1, 4, 1, 5};
    qsort(arr, 5, sizeof(int), cmp);   // 4th argument is function pointer
}
\`\`\`

qsort doesn't know what's in your array → it calls your provided cmp to compare.

## 39.4 Callback Pattern

\`\`\`c
void forEach(int *arr, int n, void (*action)(int)) {
    for (int i = 0; i < n; i++) action(arr[i]);
}
void print_it(int x) { printf("%d\\n", x); }
forEach(arr, n, print_it);
\`\`\`

Like Python's \`map(f, list)\` — much more verbose in C.

## 39.5 No Closures

C function pointers **cannot capture outer variables**. To have "state", use globals or pass an extra \`void *context\`:

\`\`\`c
void forEach(int *arr, int n, void (*action)(int, void*), void *ctx) {
    for (int i = 0; i < n; i++) action(arr[i], ctx);
}
\`\`\`

\`pthread_create\` / \`qsort_r\` all follow this pattern — standard functions accept void* context.

## 39.6 Function Pointer Arrays: Dispatch Table

Replace switch with table lookup:

\`\`\`c
int add(int a, int b){ return a+b; }
int sub(int a, int b){ return a-b; }
int mul(int a, int b){ return a*b; }

int (*ops[])(int, int) = {add, sub, mul};
const char *names[] = {"add", "sub", "mul"};

int op = 1;
printf("%s = %d\\n", names[op], ops[op](10, 3));   // sub = 7
\`\`\`

Interpreters, state machines, and virtual machines all use this technique to dispatch instructions.

c:`# Chapter 40: String Handling — strcpy / strtok

C has no string type — \`char []\` + trailing \`'\\0'\`. All "string operations" are functions.

## 40.1 Essential string.h Functions

\`\`\`c
#include <string.h>

strlen(s);             // length (not including \\0)
strcpy(dst, src);      // copy
strncpy(dst, src, n);  // copy at most n chars
strcat(dst, src);      // append to dst
strcmp(a, b);          // compare: 0=equal, <0=a<b, >0=a>b
strstr(s, sub);        // find substring, returns pointer or NULL
\`\`\`

## 40.2 strcpy Pitfall

\`\`\`c
char dst[5];
strcpy(dst, "hello world");   // ❌ writes past 5 bytes, buffer overflow
\`\`\`

Use \`strncpy\` or check length yourself. **Buffer overflow is the biggest source of C security vulnerabilities**.

## 40.3 strtok — Split String

\`\`\`c
char s[] = "apple,banana,cherry";
char *tok = strtok(s, ",");
while (tok != NULL) {
    printf("%s\\n", tok);
    tok = strtok(NULL, ",");   // first argument is NULL for subsequent calls
}
\`\`\`

> ⚠️ **strtok modifies s** (replaces delimiter with \`\\0\`) — cannot use on string literals.
> ⚠️ **strtok is not thread-safe** (uses global state) — use \`strtok_r\` in multithreaded code.

## 40.4 sprintf — Format to String

\`\`\`c
char buf[100];
sprintf(buf, "%d + %d = %d", 1, 2, 3);   // buf = "1 + 2 = 3"
\`\`\`

Safer version: \`snprintf(buf, sizeof(buf), "...", ...)\` — won't write past bounds.

## 40.5 String ↔ Number Conversion

\`\`\`c
int n = atoi("42");
double d = atof("3.14");
sprintf(buf, "%d", n);     // int → string
\`\`\`

> \`atoi\` returns 0 on failure, can't distinguish "real 0" from "failure". For strict usage, use \`strtol\` with errno.

## 40.6 Common String Comparison Mistake

\`\`\`c
if (s == "hello") { ... }    // ❌ compares pointers
if (strcmp(s, "hello") == 0) { ... }   // ✅ compares content
\`\`\`

## 40.7 Dynamic Strings: Roll Your Own String Builder

When concatenating many tokens and worried about overflow, manage the buffer yourself:

\`\`\`c
typedef struct { char *buf; size_t len, cap; } Str;
void str_append(Str *s, const char *t) {
    size_t tlen = strlen(t);
    if (s->len + tlen + 1 > s->cap) {
        s->cap = (s->cap + tlen + 1) * 2;
        s->buf = realloc(s->buf, s->cap);
    }
    memcpy(s->buf + s->len, t, tlen);
    s->len += tlen;
    s->buf[s->len] = '\\0';
}
\`\`\`

C++'s \`string\` works roughly this way underneath; in C you start from scratch.

## 40.8 String Hashing (Advanced APCS)

\`\`\`c
unsigned long hash(const char *s){
    unsigned long h = 5381;
    int c;
    while ((c = *s++)) h = ((h << 5) + h) + c;   // h*33 + c
    return h;
}
\`\`\`

djb2 is the most well-known fast string hash. Essential for making your own hash maps.

c:`# Chapter 41: Advanced Macros: Conditional Compilation and Variadic Macros

\`#define\` is C's metaprogramming — the preprocessor does **textual substitution** before the compiler sees it.

## 41.1 Constant Macros

\`\`\`c
#define MAX 1000005
#define PI 3.14159
int arr[MAX];
\`\`\`

> Modern C can use \`const int MAX = 1000005;\` — but macros can be used for array sizes (const variables don't work in some compilers).

## 41.2 Function-like Macros

\`\`\`c
#define MIN(a, b) ((a) < (b) ? (a) : (b))
\`\`\`

**Every parameter needs parentheses** — otherwise \`MIN(x+1, y)\` expands oddly.

## 41.3 Macro Pitfall: Side Effects

\`\`\`c
int i = 5;
int m = MIN(i++, 10);   // i becomes 7 (evaluated twice)
\`\`\`

Macros are textual substitution; \`i++\` is really expanded twice. **Using \`static inline\` functions is safer**.

## 41.4 Conditional Compilation

\`\`\`c
#ifdef DEBUG
    printf("[debug] x = %d\\n", x);
#endif

#if defined(__linux__)
    // linux-specific code
#elif defined(_WIN32)
    // windows-specific code
#endif
\`\`\`

Compiling with \`gcc -DDEBUG ...\` includes debug messages. Without it → entire section disappears, zero overhead.

## 41.5 Variadic Macros (C99+)

\`\`\`c
#define LOG(fmt, ...) fprintf(stderr, "[log] " fmt "\\n", __VA_ARGS__)
LOG("x = %d, y = %d", 1, 2);
\`\`\`

\`...\` accepts any number of arguments, \`__VA_ARGS__\` expands them.

## 41.6 Stringification and Concatenation

\`\`\`c
#define STR(x) #x
#define CAT(a, b) a##b

STR(hello)      // "hello"
CAT(my, var)    // myvar (identifier)
\`\`\`

## 41.7 Standard Header Guard

\`\`\`c
#ifndef MYHEADER_H
#define MYHEADER_H
// header content
#endif
\`\`\`

Prevents duplicate declarations from including the same .h file twice.

## 41.8 X-Macro Pattern

Generate multiple types of code from a single data source:

\`\`\`c
#define COLORS \\
    X(RED,   0xFF0000) \\
    X(GREEN, 0x00FF00) \\
    X(BLUE,  0x0000FF)

// 1) Generate enum
enum Color {
#define X(name, val) name,
    COLORS
#undef X
};

// 2) Generate name string table
const char *color_name[] = {
#define X(name, val) #name,
    COLORS
#undef X
};
\`\`\`

Adding \`YELLOW\` only requires changing the COLORS line; enum and string table sync automatically.

## 41.9 Comparison with C++ Templates

| | C macro | C++ template |
|---|---|---|
| Phase | Preprocessor (textual substitution) | Compile time (type-safe) |
| Error messages | Expanded gibberish | Template gibberish |
| Side effect safety | ❌ | ✅ |
| Works across types | ✅ (crude) | ✅ (type parameterized) |

For new projects, prefer \`static inline\` / templates; only use macros for legacy C code.

c:`# Chapter 42: Introduction to System Calls — read / write / fork

C is the language for writing **operating systems, embedded systems, and drivers**. Talking directly to the OS requires system calls.

> ⚠️ This chapter applies only to Linux/macOS; Windows requires the Win32 API.

## 42.1 Standard I/O vs System Calls

| | Standard I/O | System calls |
|---|---|---|
| Functions | \`fopen / fread / fwrite\` | \`open / read / write\` |
| Headers | \`<stdio.h>\` | \`<unistd.h> <fcntl.h>\` |
| Object | \`FILE *\` | Integer file descriptor (fd) |
| Buffering | Yes (library level) | No (direct to kernel) |

## 42.2 open / read / write

\`\`\`c
#include <unistd.h>
#include <fcntl.h>

int fd = open("data.txt", O_RDONLY);
if (fd < 0) { perror("open"); return 1; }
char buf[1024];
ssize_t n = read(fd, buf, sizeof(buf));   // returns number of bytes read
write(STDOUT_FILENO, buf, n);             // STDOUT_FILENO = 1
close(fd);
\`\`\`

- 0 = stdin, 1 = stdout, 2 = stderr
- read returns 0 to indicate EOF
- write may not write everything; loop until fully written

## 42.3 fork — Create a Process

\`\`\`c
#include <sys/wait.h>
pid_t pid = fork();
if (pid == 0) {
    // child process
    printf("I'm child\\n");
    _exit(0);
} else if (pid > 0) {
    // parent process
    int status;
    waitpid(pid, &status, 0);
    printf("Child done\\n");
}
\`\`\`

\`fork\` makes a complete copy of the current process; parent and child continue from the same line.

## 42.4 exec Family — Replace Yourself

\`\`\`c
execl("/bin/ls", "ls", "-l", NULL);
// if successful, never returns
\`\`\`

Usually \`fork\` + child \`exec\` — this is how shells run commands.

## 42.5 pipe — Communication Between Two Processes

\`\`\`c
int fd[2];
pipe(fd);             // fd[0] read end, fd[1] write end
// after fork, parent writes to fd[1], child reads from fd[0]
\`\`\`

## 42.6 errno — Error Codes

\`\`\`c
#include <errno.h>
#include <string.h>
if (open(...) < 0) {
    printf("Error: %s\\n", strerror(errno));
}
\`\`\`

Every failing system call sets errno; \`strerror\` converts it to human-readable text.

## 42.7 signal — Receive Signals

\`\`\`c
#include <signal.h>
void handler(int sig) {
    write(1, "got SIGINT\\n", 11);
    _exit(0);
}
signal(SIGINT, handler);   // triggered by Ctrl+C
\`\`\`

> ⚠️ Signal handlers can only call **async-signal-safe** functions (write is OK, printf is not).

## 42.8 mmap — Use Files as Memory

\`\`\`c
#include <sys/mman.h>
int fd = open("big.bin", O_RDONLY);
struct stat st; fstat(fd, &st);
char *p = mmap(NULL, st.st_size, PROT_READ, MAP_PRIVATE, fd, 0);
// p is read like a normal array
munmap(p, st.st_size);
\`\`\`

No need to read large files into a buffer — kernel pages on demand, extremely fast.

c:`# Chapter 43: Makefile and Multi-File Compilation

For C projects with multiple files, typing \`gcc a.c b.c c.c -o prog\` every time is tedious. Makefile automates it.

## 43.1 Simple Makefile

\`\`\`make
prog: main.o utils.o
	gcc -o prog main.o utils.o

main.o: main.c utils.h
	gcc -c main.c

utils.o: utils.c utils.h
	gcc -c utils.c

clean:
	rm -f *.o prog
\`\`\`

> ⚠️ Indentation **must use Tab**, not 4 spaces! This is the most common Makefile pitfall.

## 43.2 Rule Format

\`\`\`
target: dependencies
	command
\`\`\`

- target = the file you want to produce
- dependencies = files that target depends on
- command = how to produce target (runs when dependencies are updated)

Running \`make prog\` checks if prog needs rebuilding.

## 43.3 Variables

\`\`\`make
CC = gcc
CFLAGS = -Wall -O2 -g
OBJS = main.o utils.o

prog: $(OBJS)
	$(CC) -o prog $(OBJS)

%.o: %.c
	$(CC) $(CFLAGS) -c $<
\`\`\`

- \`$<\` = first dependency
- \`$@\` = current target
- \`%.o: %.c\` = pattern rule (any .c compiles to same-named .o)

## 43.4 Phony Targets .PHONY

\`\`\`make
.PHONY: clean all
all: prog
clean:
	rm -f *.o prog
\`\`\`

\`clean\` is not a real file → mark as .PHONY, prevents breakage if someone creates a file named "clean".

## 43.5 Automatic Dependencies

In practice, \`gcc -M\` is used to auto-generate dependency graphs, avoiding manually maintaining \`main.o: main.c utils.h\`.

## 43.6 The Post-Makefile Era

Modern C/C++ projects often use **CMake** (cross-platform, generates Makefile/Ninja/VS projects) or **Meson**. But understanding Makefile is still foundational engineering knowledge.

## 43.7 Separating Header and Implementation Files

\`\`\`c
// utils.h
#ifndef UTILS_H
#define UTILS_H
int gcd(int a, int b);   // declaration only
#endif

// utils.c
#include "utils.h"
int gcd(int a, int b){ return b ? gcd(b, a%b) : a; }   // implementation

// main.c
#include "utils.h"
int main(){ gcd(12, 18); }
\`\`\`

Rules:
- .h contains only **declarations** (function prototypes, struct definitions, macros)
- .c contains **implementations** (function bodies)
- Any .c using a declaration must \`#include\` the corresponding .h

## 43.8 Compiler Flags Quick Reference

| Flag | Purpose |
|------|---------|
| \`-Wall -Wextra\` | Enable all warnings |
| \`-O2\` | Production optimization |
| \`-g\` | Include debug symbols |
| \`-fsanitize=address\` | AddressSanitizer to catch buffer overflow |
| \`-fsanitize=undefined\` | UBSan to catch undefined behavior |
| \`-std=c11\` | Specify C standard version |

During development, use \`-Wall -Wextra -g -fsanitize=address\`; 90% of C bugs are caught at compile/runtime.

java:`# Chapter 36: Collections Framework

Java's \`java.util.*\` is more organized than C++ STL — everything is designed around interfaces.

## 36.1 Three Main Interfaces

\`\`\`
Collection
├── List   ordered, allows duplicates  → ArrayList, LinkedList
├── Set    no duplicates               → HashSet, TreeSet, LinkedHashSet
└── Queue  queue                       → ArrayDeque, PriorityQueue

Map<K,V>   key-value pairs             → HashMap, TreeMap, LinkedHashMap
\`\`\`

## 36.2 List

\`\`\`java
import java.util.*;
List<Integer> list = new ArrayList<>();
list.add(1); list.add(2); list.add(3);
list.get(0);           // 1
list.set(0, 10);       // modify at index 0
list.size();           // 3
list.remove(0);        // remove at index 0 (O(n))
for (int x : list) System.out.println(x);
\`\`\`

**ArrayList vs LinkedList**:
- ArrayList — random access O(1), amortized O(1) append to end, O(n) insert in middle
- LinkedList — O(1) add at both ends, O(n) random access

In practice, **use ArrayList 99% of the time** — LinkedList is almost always slower on modern hardware (cache misses).

## 36.3 Map

\`\`\`java
Map<String, Integer> map = new HashMap<>();
map.put("apple", 1);
map.put("apple", 2);              // overwrites
map.get("apple");                 // 2
map.getOrDefault("nope", 0);      // 0
map.containsKey("apple");         // true
for (Map.Entry<String, Integer> e : map.entrySet()) {
    System.out.println(e.getKey() + " " + e.getValue());
}
\`\`\`

- **HashMap** — average O(1), unordered
- **TreeMap** — O(log n), keys auto-sorted
- **LinkedHashMap** — O(1), preserves **insertion order**

## 36.4 Set

\`\`\`java
Set<Integer> s = new HashSet<>();
s.add(1); s.add(2); s.add(1);     // auto-dedup
s.contains(1);                    // true
s.size();                         // 2
\`\`\`

## 36.5 Queue / Deque

\`\`\`java
Deque<Integer> dq = new ArrayDeque<>();
dq.offerFirst(1); dq.offerLast(2);
dq.pollFirst(); dq.pollLast();
\`\`\`

Java recommends **ArrayDeque** as stack/queue (faster than both \`Stack\` and \`LinkedList\`).

## 36.6 PriorityQueue (heap)

\`\`\`java
PriorityQueue<Integer> pq = new PriorityQueue<>();   // min-heap by default
pq.offer(3); pq.offer(1); pq.offer(2);
pq.poll();                          // 1

PriorityQueue<Integer> maxPq = new PriorityQueue<>(Comparator.reverseOrder());
\`\`\`

## 36.7 Sorting and Comparator

\`\`\`java
List<int[]> pairs = ...;
pairs.sort((a, b) -> a[0] - b[0]);                  // ascending by first column
pairs.sort(Comparator.comparingInt(a -> a[0])
    .thenComparingInt(a -> -a[1]));                  // multi-key
\`\`\`

> ⚠️ \`a[0] - b[0]\` can overflow with large numbers! Use \`Integer.compare(a[0], b[0])\` for safety.

## 36.8 Immutable Collections (Java 9+)

\`\`\`java
List<Integer> immut = List.of(1, 2, 3);     // immutable, doesn't accept null
Map<String,Integer> m = Map.of("a", 1, "b", 2);
\`\`\`

Modification throws UnsupportedOperationException. Very convenient as constant tables.

## 36.9 Comparison with C++ STL

| Feature | C++ | Java |
|---------|-----|------|
| Dynamic array | vector | ArrayList |
| Hash table | unordered_map | HashMap |
| Red-black tree map | map | TreeMap |
| Heap | priority_queue | PriorityQueue |
| Double-ended | deque | ArrayDeque |
| Iteration | iterator / range for | Iterator / for-each |

Almost one-to-one semantics, just different names.

java:`# Chapter 37: Generics

Generics let you write **type-parameterized** classes/methods — type safety guaranteed at compile time.

## 37.1 Why Generics Are Needed

Before generics (pre-Java 5):
\`\`\`java
List list = new ArrayList();
list.add("hello");
String s = (String) list.get(0);    // requires cast, may throw ClassCastException
\`\`\`

With generics:
\`\`\`java
List<String> list = new ArrayList<>();
list.add("hello");
String s = list.get(0);             // compiler knows it's a String
list.add(42);                       // compile error
\`\`\`

## 37.2 Generic Methods

\`\`\`java
public static <T> T myMax(T a, T b, Comparator<T> cmp) {
    return cmp.compare(a, b) > 0 ? a : b;
}
\`\`\`

\`<T>\` before the return type; T is auto-inferred.

## 37.3 Generic Classes

\`\`\`java
class Box<T> {
    private T value;
    public Box(T v) { value = v; }
    public T get() { return value; }
}
Box<Integer> bi = new Box<>(42);
Box<String> bs = new Box<>("hello");
\`\`\`

## 37.4 Wildcards \`?\`

\`\`\`java
void print(List<?> list) { ... }            // List of any type
void sum(List<? extends Number> list) { ... } // Number or subclasses
void add(List<? super Integer> list) { ... }  // Integer or parent classes
\`\`\`

**PECS principle**: **P**roducer **E**xtends, **C**onsumer **S**uper.
- Want to **read** from list → \`? extends T\`
- Want to **write** to list → \`? super T\`

## 37.5 Type Erasure

Java generics **only exist at compile time**. At runtime \`List<Integer>\` and \`List<String>\` are the same class.

\`\`\`java
List<Integer> a = new ArrayList<>();
List<String> b = new ArrayList<>();
System.out.println(a.getClass() == b.getClass());    // true!
\`\`\`

> This is different from C++ templates (C++ truly generates different classes for each type).

## 37.6 Limitations

Cannot:
\`\`\`java
T t = new T();                    // ❌ cannot new a generic type
T[] arr = new T[10];              // ❌ cannot new a generic array
if (x instanceof List<String>)    // ❌ cannot instanceof with generics
\`\`\`

## 37.7 Multiple Parameters + Constraints

\`\`\`java
class Pair<K extends Comparable<K>, V> {
    K key; V value;
    int compareTo(Pair<K, V> o){ return key.compareTo(o.key); }
}
\`\`\`

\`<K extends Comparable<K>>\` forces K to be comparable.

## 37.8 Comparison with C++ Templates

| | Java generics | C++ template |
|---|---|---|
| Compiled output | One copy (erased) | One copy per type |
| Runtime type visible | ❌ | ❌ (unless RTTI) |
| Primitive support | ❌ (requires boxing) | ✅ |
| Compile speed | Fast | Slow |
| Error messages | Normal | Nightmare |

Java can't do \`List<int>\` — only \`List<Integer>\`, each element is boxed → slow and memory-heavy. For APCS, just use \`int[]\` arrays directly.

java:`# Chapter 38: Stream API

Introduced in Java 8 — functional-style collection processing. Similar to Python's list comprehensions.

## 38.1 Three Steps: Source → Intermediate Operations → Terminal Operation

\`\`\`java
import java.util.stream.*;

List<Integer> nums = List.of(1, 2, 3, 4, 5);
int sumOfSquares = nums.stream()
    .filter(n -> n % 2 == 0)        // intermediate: keep even numbers
    .mapToInt(n -> n * n)           // intermediate: square
    .sum();                          // terminal: sum up
System.out.println(sumOfSquares);   // 4 + 16 = 20
\`\`\`

## 38.2 Common Intermediate Operations

\`\`\`java
nums.stream()
    .filter(n -> n > 0)           // filter
    .map(n -> n * 2)              // transform
    .distinct()                   // remove duplicates
    .sorted()                     // sort
    .limit(10)                    // take first 10
    .skip(5);                     // skip first 5
\`\`\`

## 38.3 Common Terminal Operations

\`\`\`java
.count()                          // count
.sum() / .max() / .min()          // numeric statistics
.collect(Collectors.toList())     // collect into List
.collect(Collectors.toSet())
.collect(Collectors.toMap(...))
.forEach(System.out::println)     // for each element
.reduce(0, Integer::sum)          // custom reduction
\`\`\`

## 38.4 groupingBy — Java's groupby

\`\`\`java
Map<String, List<Person>> byCity = people.stream()
    .collect(Collectors.groupingBy(Person::getCity));

Map<String, Long> cntByCity = people.stream()
    .collect(Collectors.groupingBy(Person::getCity, Collectors.counting()));
\`\`\`

## 38.5 Method Reference \`::\`

\`\`\`java
list.forEach(System.out::println);          // same as x -> System.out.println(x)
list.stream().map(String::toUpperCase);     // same as s -> s.toUpperCase()
list.stream().map(Person::new);             // constructor reference
\`\`\`

## 38.6 Notes

- Stream **can only be consumed once** — after use it's spent; create a new .stream() to use again
- Stream **does not modify the original collection**
- Intermediate operations are **lazily evaluated** — won't run without a terminal operation

## 38.7 Parallel Stream

\`\`\`java
nums.parallelStream().filter(...).sum();
\`\`\`

Opens multiple threads to process. Note: **data must have no shared state**, otherwise it breaks.

## 38.8 Advanced Collectors

\`\`\`java
// partitioningBy: split into two groups
Map<Boolean, List<Integer>> oddEven = nums.stream()
    .collect(Collectors.partitioningBy(n -> n % 2 == 1));

// toMap: convert to Map
Map<String, Integer> lens = words.stream()
    .collect(Collectors.toMap(w -> w, String::length));

// summarizingInt: get count/sum/min/max/avg in one call
IntSummaryStatistics stat = nums.stream()
    .collect(Collectors.summarizingInt(Integer::intValue));
System.out.println(stat.getAverage());
\`\`\`

## 38.9 Comparison with Python

| Python | Java |
|--------|------|
| \`[x*2 for x in xs if x>0]\` | \`xs.stream().filter(x->x>0).map(x->x*2).collect(toList())\` |
| \`sum(xs)\` | \`xs.stream().mapToInt(...).sum()\` |
| \`max(xs, key=f)\` | \`xs.stream().max(comparingInt(f::apply))\` |
| \`{k: list(g) for k,g in groupby(xs, key)}\` | \`xs.stream().collect(groupingBy(key))\` |

Python list comprehensions are shorter; Java Stream chaining is longer but **after JIT compilation is as fast as hand-written for loops**, and supports \`.parallelStream()\` to automatically distribute across cores.

java:`# Chapter 39: Optional and Null Safety

Tony Hoare called null references his "billion-dollar mistake". Java 8 added \`Optional\` to mitigate this.

## 39.1 The Pain of NullPointerException

\`\`\`java
User user = findUser(id);
String name = user.getName();    // if user is null → crash
String upper = name.toUpperCase();
\`\`\`

Requires a chain of null checks:
\`\`\`java
if (user != null) {
    String name = user.getName();
    if (name != null) {
        String upper = name.toUpperCase();
        // ...
    }
}
\`\`\`

## 39.2 Optional Expresses "Might Not Exist"

\`\`\`java
import java.util.Optional;

Optional<User> userOpt = findUser(id);     // function returns Optional
userOpt.ifPresent(u -> System.out.println(u.getName()));
String name = userOpt.map(User::getName).orElse("Unknown");
\`\`\`

## 39.3 Creating Optional

\`\`\`java
Optional<String> a = Optional.of("hello");        // cannot hold null
Optional<String> b = Optional.ofNullable(maybeNull); // accepts null
Optional<String> c = Optional.empty();
\`\`\`

## 39.4 Getting Values

\`\`\`java
opt.get();                       // throws NoSuchElementException if empty — don't use!
opt.orElse("default");
opt.orElseGet(() -> compute());  // only computes when empty
opt.orElseThrow(() -> new ...);
opt.ifPresent(v -> ...);
opt.isPresent();
opt.isEmpty();                   // Java 11+
\`\`\`

## 39.5 map / flatMap / filter

\`\`\`java
Optional<Integer> length = findUser(id)
    .map(User::getName)              // get name (still Optional)
    .map(String::length);

Optional<User> result = findUser(id)
    .flatMap(this::findManager)      // findManager also returns Optional
    .filter(u -> u.getAge() > 18);
\`\`\`

## 39.6 How NOT to Use Optional

❌ As class fields (breaks serialization)
❌ As function parameters (better to pass null directly or use overloading)
❌ Wrapping primitive types (use OptionalInt / OptionalLong / OptionalDouble)

✅ As function return values (clearly indicates "might not exist")

## 39.7 Chained Optional Example

\`\`\`java
String city = Optional.ofNullable(user)
    .map(User::getAddress)
    .map(Address::getCity)
    .map(String::toUpperCase)
    .orElse("UNKNOWN");
\`\`\`

If any link in the chain is null → result is "UNKNOWN", no NPE. Equivalent to Kotlin's \`user?.address?.city?.uppercase() ?: "UNKNOWN"\`.

## 39.8 Optional vs null vs Exception

| Situation | Recommendation |
|-----------|---------------|
| Function might not find a result | \`Optional<T>\` |
| Internal field not yet initialized | null + private |
| Should never happen error | throw RuntimeException |
| Expected error (file not found) | checked exception |

Don't use Optional as a cure-all for every null — overuse makes code long and messy.

## 39.9 Try It`

java:`# Chapter 40: Multithreading — Thread / Runnable

Java has supported multithreading from day one.

## 40.1 Two Ways to Start

\`\`\`java
// 1. Implement Runnable
Runnable task = () -> System.out.println("hello from " + Thread.currentThread().getName());
Thread t1 = new Thread(task);
t1.start();          // start; t1.run() runs in another thread

// 2. Extend Thread (not recommended — can only extend one class)
class MyThread extends Thread {
    public void run() { System.out.println("running"); }
}
new MyThread().start();
\`\`\`

> ⚠️ **\`start()\` vs \`run()\`**: start() truly creates a new thread; run() is just a normal function call in the current thread.

## 40.2 Waiting for Thread to Finish

\`\`\`java
Thread t = new Thread(task);
t.start();
t.join();           // blocks until t finishes
\`\`\`

## 40.3 The Problem with Shared Data

\`\`\`java
class Counter {
    int n = 0;
    void inc() { n++; }      // not atomic!
}
Counter c = new Counter();
Runnable task = () -> { for (int i = 0; i < 100000; i++) c.inc(); };
Thread t1 = new Thread(task), t2 = new Thread(task);
t1.start(); t2.start(); t1.join(); t2.join();
System.out.println(c.n);     // might not be 200000
\`\`\`

## 40.4 synchronized Solves It

\`\`\`java
synchronized void inc() { n++; }
\`\`\`

Or block form:
\`\`\`java
void inc() {
    synchronized(this) { n++; }
}
\`\`\`

> synchronized is a Java built-in keyword that auto-manages locks — safer than a mutex API.

## 40.5 ExecutorService — Don't Manage Threads Yourself

\`\`\`java
import java.util.concurrent.*;

ExecutorService pool = Executors.newFixedThreadPool(4);
for (int i = 0; i < 10; i++) {
    int id = i;
    pool.submit(() -> System.out.println("task " + id));
}
pool.shutdown();
pool.awaitTermination(1, TimeUnit.MINUTES);
\`\`\`

**Modern Java concurrent code uses pools, not direct new Thread**.

## 40.6 Future — Getting Return Values

\`\`\`java
Future<Integer> future = pool.submit(() -> {
    Thread.sleep(1000);
    return 42;
});
Integer result = future.get();   // blocks waiting for result
\`\`\`

## 40.7 volatile and Memory Model

\`\`\`java
volatile boolean stop = false;   // changes by other threads are immediately visible
\`\`\`

Without \`volatile\`, the compiler/CPU may optimize \`while(!stop)\` to read once and cache. \`volatile\` forces reading from main memory every time.

> volatile only guarantees **visibility**, not **atomicity**! For atomic operations use AtomicInteger.

## 40.8 ThreadLocal

Each thread has its own copy:

\`\`\`java
ThreadLocal<SimpleDateFormat> fmt = ThreadLocal.withInitial(
    () -> new SimpleDateFormat("yyyy-MM-dd"));
String s = fmt.get().format(new Date());
\`\`\`

SimpleDateFormat is not thread-safe → use ThreadLocal to give each thread its own copy, avoiding sharing issues.

## 40.9 Virtual Threads (Java 21+)

\`\`\`java
Thread.startVirtualThread(() -> System.out.println("virtual"));
\`\`\`

A million virtual threads is no problem — corresponds to Go's goroutines. A game changer for I/O-intensive tasks.

## 40.10 Try It`

java:`# Chapter 41: Concurrency Tools — Lock / Atomic

\`java.util.concurrent\` provides more flexible concurrency tools than synchronized.

## 41.1 ReentrantLock

More powerful than synchronized:
\`\`\`java
import java.util.concurrent.locks.*;

Lock lock = new ReentrantLock();

void inc() {
    lock.lock();
    try {
        n++;
    } finally {
        lock.unlock();       // must unlock in finally
    }
}
\`\`\`

Features:
- \`tryLock()\` — try to acquire lock, doesn't block on failure
- \`tryLock(1, TimeUnit.SECONDS)\` — wait 1 second
- \`lockInterruptibly()\` — can be interrupted

## 41.2 ReadWriteLock

When reads far outnumber writes:
\`\`\`java
ReadWriteLock rwLock = new ReentrantReadWriteLock();
Lock readLock = rwLock.readLock();
Lock writeLock = rwLock.writeLock();
\`\`\`

Multiple reader threads can hold read lock simultaneously; write lock is exclusive.

## 41.3 AtomicInteger / AtomicReference

\`\`\`java
import java.util.concurrent.atomic.*;

AtomicInteger counter = new AtomicInteger(0);
counter.incrementAndGet();          // atomic ++
counter.compareAndSet(5, 10);       // if value is 5, set to 10 (CAS)
\`\`\`

> Implemented with CAS — much faster than synchronized.

## 41.4 ConcurrentHashMap

\`\`\`java
ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();
map.put("a", 1);
map.compute("a", (k, v) -> v + 1);       // atomic update
map.merge("b", 1, Integer::sum);         // if absent put 1, else add 1
\`\`\`

Replaces HashMap under concurrency — uses segment locking internally.

## 41.5 CountDownLatch — Wait for Multiple Threads

\`\`\`java
CountDownLatch latch = new CountDownLatch(3);
for (int i = 0; i < 3; i++) {
    new Thread(() -> {
        // do work
        latch.countDown();
    }).start();
}
latch.await();        // waits until all 3 have called countDown
\`\`\`

## 41.6 Semaphore — Limit Concurrency

\`\`\`java
Semaphore sem = new Semaphore(5);     // at most 5 running simultaneously
sem.acquire();
try { /* restricted resource */ }
finally { sem.release(); }
\`\`\`

## 41.7 BlockingQueue — Producer-Consumer

\`\`\`java
BlockingQueue<Integer> q = new LinkedBlockingQueue<>();
// producer
new Thread(() -> { q.put(42); }).start();
// consumer
new Thread(() -> { Integer x = q.take(); }).start();
\`\`\`

\`take()\` blocks when queue is empty; \`put()\` blocks when full.

## 41.8 CompletableFuture — Chained Async

\`\`\`java
CompletableFuture
    .supplyAsync(() -> fetchUser(id))
    .thenApply(User::getName)
    .thenAccept(System.out::println)
    .exceptionally(e -> { e.printStackTrace(); return null; });
\`\`\`

Similar to JavaScript Promise — doesn't block the main thread. Common in microservices and I/O pipelines.

## 41.9 Concurrency Tools Quick Reference

| Goal | Use |
|------|-----|
| Mutual exclusion | synchronized / ReentrantLock |
| Counter | AtomicInteger / LongAdder |
| Wait for multiple threads | CountDownLatch / Phaser |
| Rate limiting | Semaphore |
| Producer-consumer | BlockingQueue |
| Async result | Future / CompletableFuture |
| Thread-safe Map | ConcurrentHashMap |
| Shared boolean | AtomicBoolean / volatile |

java:`# Chapter 42: Annotations and Reflection

Java's two main metaprogramming tools: annotations + reflection.

## 42.1 Built-in Annotations

\`\`\`java
@Override               // tells compiler: this overrides parent class
@Deprecated             // marks as deprecated
@SuppressWarnings("unchecked")    // suppress specific warnings
@FunctionalInterface    // marks interface with exactly one abstract method
\`\`\`

Not writing \`@Override\` still runs, but if you misspell the name and don't actually override — the compiler catches it for you.

## 42.2 Reflection: Get Type Info at Runtime

\`\`\`java
Class<?> cls = obj.getClass();
String name = cls.getName();
Field[] fields = cls.getDeclaredFields();
Method[] methods = cls.getDeclaredMethods();

// Dynamic invocation
Method m = cls.getMethod("hello", String.class);
m.invoke(obj, "world");

// Dynamic instantiation
Constructor<?> ctor = cls.getConstructor();
Object inst = ctor.newInstance();
\`\`\`

> Reflection is slow and bypasses compile-time checks — but frameworks (Spring, JUnit) use it extensively.

## 42.3 Custom Annotations

\`\`\`java
import java.lang.annotation.*;

@Retention(RetentionPolicy.RUNTIME)    // visible at runtime
@Target(ElementType.METHOD)             // only for methods
@interface Test {
    String name() default "";
}

class Demo {
    @Test(name = "addition")
    void test1() { ... }
}
\`\`\`

## 42.4 Processing Annotations with Reflection

\`\`\`java
for (Method m : Demo.class.getDeclaredMethods()) {
    Test t = m.getAnnotation(Test.class);
    if (t != null) {
        System.out.println("Running test: " + t.name());
        m.invoke(new Demo());
    }
}
\`\`\`

JUnit works roughly this way — finds methods marked with \`@Test\` and executes them automatically.

## 42.5 Common Uses of Reflection

- **DI containers** (Spring): inject objects based on \`@Autowired\`
- **ORM** (Hibernate): map database based on \`@Entity\` \`@Column\`
- **Serialization** (Jackson, Gson): convert JSON ↔ Object based on field names and types
- **Test frameworks** (JUnit): find methods marked with \`@Test\`

## 42.6 The Cost

- 10–100× slower than normal calls
- Compile-time errors become runtime errors
- IDE struggles to trace call relationships

> Business logic **should not** use reflection; it's a good tool when used appropriately at the framework layer.

## 42.7 Dynamic Proxy

\`\`\`java
import java.lang.reflect.*;

InvocationHandler h = (proxy, method, args) -> {
    System.out.println("calling " + method.getName());
    return null;
};
Runnable r = (Runnable) Proxy.newProxyInstance(
    cl.getClassLoader(), new Class[]{Runnable.class}, h);
r.run();   // prints "calling run"
\`\`\`

Spring AOP and Mockito both use this to intercept method calls.

## 42.8 Reflection Performance Tips

- **Cache** \`Method\` objects — don't call \`getMethod\` every time
- Use \`MethodHandle\` (Java 7+) — 5–10× faster than reflection
- JIT inlines repeated reflection calls on hot paths, so it's not as bad as you'd think

java:`# Chapter 43: JVM and GC Fundamentals

Understanding the JVM is key to writing high-performance Java.

## 43.1 From .java to Execution

\`\`\`
.java  --javac-->  .class (bytecode)  --java-->  JVM interpret/JIT compile  -->  CPU
\`\`\`

1. \`javac\` compiles source code into bytecode (cross-platform intermediate code)
2. \`java\` command starts the JVM, loads .class
3. JVM interprets bytecode; hot paths are JIT-compiled to machine code

## 43.2 Memory Regions

| Region | Contents | On failure |
|--------|----------|------------|
| **Heap** | Objects (created with \`new\`) | OutOfMemoryError |
| **Stack** | Local variables, function calls | StackOverflowError |
| **Metaspace** | Class and method metadata | OutOfMemoryError |
| **PC Register** | Current execution position | - |

\`-Xms512m -Xmx2g\` = heap starts at 512MB, maximum 2GB.

## 43.3 Object Lifecycle

\`\`\`java
String s = new String("hello");   // on heap
\`\`\`

When nothing references it → **garbage**, waiting to be collected by GC.

> The biggest difference between Java and C/C++: **no need to free manually**. But the cost is GC pauses.

## 43.4 How GC Works

Mainstream: **Generational GC**
- **Young Generation** (Eden + 2 Survivors): newly created objects
- **Old Generation**: long-lived objects

**New objects die quickly** → Young GC is frequent but fast (copy algorithm)
**Survivors** → promoted to Old → Full GC less frequent but slow

## 43.5 GC Algorithms

| GC | Characteristics |
|----|----------------|
| **Serial** | Single-threaded, stop-the-world |
| **Parallel** | Multi-threaded, throughput-oriented |
| **G1** | Region-based, predictable pauses (default since Java 9) |
| **ZGC / Shenandoah** | Pauses <10ms, suitable for large heaps |

## 43.6 Common Issues

**OutOfMemoryError**:
- Not enough heap → increase \`-Xmx\`, find memory leak
- Not enough Metaspace → too many dynamically loaded classes

**Long GC pauses**:
- Check GC log: \`-Xlog:gc*\`
- Switch to G1 or ZGC
- Reduce object allocation (pool reuse)

**Memory Leak in a GC Language**:
Static collections, unclosed resources, listeners not removed — all keep objects alive when they shouldn't be.

## 43.7 Comparison with Python

| | Python | Java |
|---|---|---|
| Compilation | bytecode (.pyc) | bytecode (.class) |
| Execution | CPython interpretation | JVM interpretation + JIT |
| GC | reference counting + GC | pure GC |
| Startup speed | Fast | Slow (JVM warm-up) |
| Long-running | Not much optimization | JIT gets faster over time |

## 43.8 Tools for Observing the JVM

| Tool | Purpose |
|------|---------|
| \`jps\` | List JVM processes |
| \`jstack <pid>\` | Dump thread stack (find deadlocks) |
| \`jmap -heap <pid>\` | Heap usage status |
| \`jhsdb jmap --histo --pid <pid>\` | Object count histogram (find leaks) |
| \`jfr\` (Java Flight Recorder) | Low-overhead profiler |
| VisualVM / JConsole | Graphical monitoring |
| \`-verbose:gc\` | Print log on each GC |

## 43.9 OutOfMemoryError Investigation SOP

1. \`-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./dump.hprof\` to capture dump
2. Open dump with **MAT** (Eclipse Memory Analyzer) to find objects with largest retained heap
3. Trace back who holds them (dominator tree)
4. Fix: release references, move to weak references (WeakHashMap), limit collection size

## 43.10 Tips for Writing High-Performance Java

- **Allocate less** — object pools, reuse StringBuilder
- **Avoid boxing** — \`int\` is 5× faster than \`Integer\`
- **Small functions** — give JIT opportunities to inline
- **Profile before optimizing** — don't optimize by gut feeling`

cpp:`#include <iostream>\nusing namespace std;\nint N, cnt;\nvoid solve(int row, int cols, int d1, int d2){\n    if (row == N) { cnt++; return; }\n    for (int c = 0; c < N; c++) {\n        int cb = 1 << c;\n        int d1b = 1 << (row - c + N);\n        int d2b = 1 << (row + c);\n        if ((cols & cb) || (d1 & d1b) || (d2 & d2b)) continue;\n        solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n    }\n}\nint main(){\n    for (N = 4; N <= 8; N++) {\n        cnt = 0;\n        solve(0, 0, 0, 0);\n        cout << N << " 皇后有 " << cnt << " 種放法\\n";\n    }\n    return 0;\n}`,
c:`#include <stdio.h>\nint N, cnt;\nvoid solve(int row, int cols, int d1, int d2){\n    if (row == N) { cnt++; return; }\n    for (int c = 0; c < N; c++) {\n        int cb = 1 << c;\n        int d1b = 1 << (row - c + N);\n        int d2b = 1 << (row + c);\n        if ((cols & cb) || (d1 & d1b) || (d2 & d2b)) continue;\n        solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n    }\n}\nint main(){\n    for (N = 4; N <= 8; N++) {\n        cnt = 0;\n        solve(0, 0, 0, 0);\n        printf("%d 皇后有 %d 種放法\\n", N, cnt);\n    }\n    return 0;\n}`,
java:`public class Main {\n    static int N, cnt;\n    static void solve(int row, int cols, int d1, int d2) {\n        if (row == N) { cnt++; return; }\n        for (int c = 0; c < N; c++) {\n            int cb = 1 << c;\n            int d1b = 1 << (row - c + N);\n            int d2b = 1 << (row + c);\n            if ((cols & cb) != 0 || (d1 & d1b) != 0 || (d2 & d2b) != 0) continue;\n            solve(row + 1, cols | cb, d1 | d1b, d2 | d2b);\n        }\n    }\n    public static void main(String[] args) {\n        for (N = 4; N <= 8; N++) {\n            cnt = 0;\n            solve(0, 0, 0, 0);\n            System.out.println(N + " 皇后有 " + cnt + " 種放法");\n        }\n    }\n}`

c:`/* C 沒有 priority_queue，用 sort + 取前 K 個 */\n#include <stdio.h>\n#include <stdlib.h>\nint cmp(const void* a, const void* b){return *(int*)a - *(int*)b;}\nint main(){\n    int nums[] = {3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5};\n    int n = 11;\n    int sorted[20];\n    for (int i = 0; i < n; i++) sorted[i] = nums[i];\n    qsort(sorted, n, sizeof(int), cmp);\n    printf("前 3 小: ");\n    for (int i = 0; i < 3; i++) printf("%d ", sorted[i]);\n    printf("\\n前 3 大: ");\n    for (int i = n-1; i >= n-3; i--) printf("%d ", sorted[i]);\n    printf("\\n");\n    return 0;\n}`,

c:`#include <stdio.h>\n#include <string.h>\nint nxt[100][26], nodes = 1;\nvoid init(){ for(int i=0;i<100;i++) for(int j=0;j<26;j++) nxt[i][j] = -1; }\nvoid insertWord(const char* s){\n    int u = 0;\n    for(int i=0;s[i];i++){\n        int c = s[i] - 'a';\n        if(nxt[u][c] == -1) nxt[u][c] = nodes++;\n        u = nxt[u][c];\n    }\n}\nint startsWith(const char* s){\n    int u = 0;\n    for(int i=0;s[i];i++){\n        int c = s[i] - 'a';\n        if(nxt[u][c] == -1) return 0;\n        u = nxt[u][c];\n    }\n    return 1;\n}\nint main(){\n    init();\n    insertWord(\"app\"); insertWord(\"apple\"); insertWord(\"ape\"); insertWord(\"bat\");\n    printf(\"%s\\n\", startsWith(\"ap\") ? \"True\" : \"False\");\n    printf(\"%s\\n\", startsWith(\"ba\") ? \"True\" : \"False\");\n    printf(\"%s\\n\", startsWith(\"cat\") ? \"True\" : \"False\");\n    return 0;\n}`,
java:`import java.util.*;\npublic class Main {\n    static class Node { int[] next = new int[26]; Node(){ Arrays.fill(next, -1); } }\n    static ArrayList<Node> trie = new ArrayList<>();\n    static void insert(String s){\n        int u = 0;\n        for(char ch : s.toCharArray()){\n            int c = ch - 'a';\n            if(trie.get(u).next[c] == -1){ trie.get(u).next[c] = trie.size(); trie.add(new Node()); }\n            u = trie.get(u).next[c];\n        }\n    }\n    static boolean startsWith(String s){\n        int u = 0;\n        for(char ch : s.toCharArray()){\n            int c = ch - 'a';\n            if(trie.get(u).next[c] == -1) return false;\n            u = trie.get(u).next[c];\n        }\n        return true;\n    }\n    public static void main(String[] args){\n        trie.add(new Node());\n        for(String s : new String[]{\"app\",\"apple\",\"ape\",\"bat\"}) insert(s);\n        System.out.println(startsWith(\"ap\") ? \"True\" : \"False\");\n        System.out.println(startsWith(\"ba\") ? \"True\" : \"False\");\n        System.out.println(startsWith(\"cat\") ? \"True\" : \"False\");\n    }\n}`

cpp:`#include <iostream>\n#include <vector>\n#include <map>\n#include <set>\n#include <queue>\n#include <unordered_map>\n#include <algorithm>\nusing namespace std;\nint main(){\n    // 1) vector 動態陣列\n    vector<int> v = {3, 1, 4, 1, 5, 9, 2, 6};\n    sort(v.begin(), v.end());\n    cout << "vec:";\n    for(int x : v) cout << ' ' << x;\n    cout << "\\n";\n\n    // 2) map 字母統計 (自動排序)\n    map<char,int> cnt;\n    string s; cin >> s;\n    for(char c : s) cnt[c]++;\n    cout << "letter counts:\\n";\n    for(auto& [k,c] : cnt) cout << "  " << k << ": " << c << "\\n";\n\n    // 3) set 去重\n    set<int> uniq(v.begin(), v.end());\n    cout << "unique: " << uniq.size() << "\\n";\n\n    // 4) priority_queue 大根堆\n    priority_queue<int> pq;\n    for(int x : v) pq.push(x);\n    cout << "top3:";\n    for(int i=0;i<3 && !pq.empty();i++){ cout << ' ' << pq.top(); pq.pop(); }\n    cout << "\\n";\n\n    // 5) unordered_map hash O(1)\n    unordered_map<string,int> price = {{\"apple\",10},{\"banana\",5}};\n    cout << "apple=" << price[\"apple\"] << "\\n";\n    return 0;\n}`,

cpp:`#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// 函式模板：對任何可比大小的型別找最大值\ntemplate<typename T>\nT myMax(T a, T b){ return a > b ? a : b; }\n\n// 類別模板：泛型容器\ntemplate<typename T>\nclass Stack {\n    vector<T> data;\npublic:\n    void push(T x){ data.push_back(x); }\n    T pop(){ T x = data.back(); data.pop_back(); return x; }\n    bool empty() const { return data.empty(); }\n    int size() const { return (int)data.size(); }\n};\n\nint main(){\n    // auto 自動推導\n    auto x = myMax(3, 7);             // int\n    auto y = myMax(1.5, 2.7);          // double\n    auto z = myMax(string(\"apple\"), string(\"banana\"));\n    cout << x << ' ' << y << ' ' << z << "\\n";\n\n    // 同一份 Stack 程式可裝任何型別\n    Stack<int> si;\n    si.push(10); si.push(20); si.push(30);\n    cout << \"stack size=\" << si.size() << \" top=\" << si.pop() << \"\\n\";\n\n    Stack<string> ss;\n    ss.push(\"hello\"); ss.push(\"world\");\n    while(!ss.empty()) cout << ss.pop() << ' ';\n    cout << \"\\n\";\n\n    // 結構化綁定 (C++17)\n    pair<int,string> p = {1, \"one\"};\n    auto [k, v] = p;\n    cout << k << \"=\" << v << \"\\n\";\n    return 0;\n}`

cpp:`#include <iostream>\n#include <vector>\n#include <utility>\n#include <chrono>\nusing namespace std;\nusing namespace chrono;\n\nvector<int> makeBig(int n){\n    vector<int> v(n);\n    for(int i=0;i<n;i++) v[i] = i;\n    return v;   // C++11 起：自動 move，不再深拷貝\n}\n\nint main(){\n    // 1) move 把 lvalue 變 rvalue：偷光內部資源\n    vector<int> v = {1,2,3,4,5};\n    vector<int> w = move(v);\n    cout << \"after move: v.size=\" << v.size() << \" w.size=\" << w.size() << \"\\n\";\n\n    // 2) 函式回傳大物件：靠 move 不會慢\n    auto t1 = high_resolution_clock::now();\n    auto big = makeBig(1000000);\n    auto t2 = high_resolution_clock::now();\n    cout << \"build 1M ints in \" << duration_cast<microseconds>(t2-t1).count() << \" us\\n\";\n    cout << \"big[999999]=\" << big[999999] << \"\\n\";\n\n    // 3) emplace_back vs push_back\n    vector<pair<int,string>> vec;\n    vec.emplace_back(1, \"one\");      // 原地建構\n    vec.push_back({2, \"two\"});       // 建臨時物件再 move\n    for(auto& [k,s] : vec) cout << k << ':' << s << ' ';\n    cout << \"\\n\";\n    return 0;\n}`

cpp:`#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <functional>\nusing namespace std;\nint main(){\n    vector<int> v = {3, 1, 4, 1, 5, 9, 2, 6, 5};\n\n    // 1) lambda 排序：由大到小\n    sort(v.begin(), v.end(), [](int a, int b){ return a > b; });\n    cout << \"desc:\"; for(int x : v) cout << ' ' << x; cout << \"\\n\";\n\n    // 2) 值捕獲 vs 參考捕獲\n    int threshold = 4;\n    int cntByVal = count_if(v.begin(), v.end(), [threshold](int x){ return x > threshold; });\n    int cntByRef = count_if(v.begin(), v.end(), [&threshold](int x){ return x > threshold; });\n    cout << \"by val=\" << cntByVal << \" by ref=\" << cntByRef << \"\\n\";\n\n    // 3) mutable lambda 可改自己的捕獲副本\n    auto counter = [n=0]() mutable { return ++n; };\n    cout << counter() << ' ' << counter() << ' ' << counter() << \"\\n\";\n\n    // 4) std::function 萬用容器\n    function<int(int)> sq = [](int x){ return x*x; };\n    cout << \"3^2=\" << sq(3) << \"\\n\";\n\n    // 5) 遞迴 lambda (要明寫型別)\n    function<int(int)> fact = [&](int n){ return n <= 1 ? 1 : n * fact(n-1); };\n    cout << \"5!=\" << fact(5) << \"\\n\";\n    return 0;\n}`

cpp:`#include <iostream>\n#include <thread>\n#include <mutex>\n#include <atomic>\n#include <vector>\n#include <future>\nusing namespace std;\n\nmutex mtx;\nint counterMtx = 0;\natomic<int> counterAtom{0};\n\nvoid incMtx(int loops){\n    for(int i=0;i<loops;i++){\n        lock_guard<mutex> lk(mtx);\n        counterMtx++;\n    }\n}\nvoid incAtom(int loops){\n    for(int i=0;i<loops;i++) counterAtom++;\n}\n\nint main(){\n    const int N = 100000, T = 4;\n\n    // 1) mutex 保護\n    vector<thread> ts;\n    for(int i=0;i<T;i++) ts.emplace_back(incMtx, N);\n    for(auto& t : ts) t.join();\n    cout << \"mutex result=\" << counterMtx << \" (expected \" << N*T << \")\\n\";\n\n    // 2) atomic 原子操作\n    ts.clear();\n    for(int i=0;i<T;i++) ts.emplace_back(incAtom, N);\n    for(auto& t : ts) t.join();\n    cout << \"atomic result=\" << counterAtom.load() << \"\\n\";\n\n    // 3) async + future 取回傳值\n    auto fut = async(launch::async, [](int n){\n        long long s = 0;\n        for(int i=1;i<=n;i++) s += i;\n        return s;\n    }, 1000000);\n    cout << \"sum 1..1e6 = \" << fut.get() << \"\\n\";\n    return 0;\n}`

c:`#include <stdio.h>\n\nvoid swap(int* a, int* b){ int t = *a; *a = *b; *b = t; }\n\nint main(){\n    // 1) 取址 / 解參考\n    int x = 42;\n    int* p = &x;\n    printf(\"x=%d, *p=%d, &x=%p\\n\", x, *p, (void*)&x);\n    *p = 100;\n    printf(\"after *p=100, x=%d\\n\", x);\n\n    // 2) 函式參數傳指標 (call by reference)\n    int a = 1, b = 2;\n    swap(&a, &b);\n    printf(\"swap: a=%d b=%d\\n\", a, b);\n\n    // 3) 陣列名 = 指向首元素的指標\n    int arr[5] = {10, 20, 30, 40, 50};\n    int* q = arr;\n    for(int i=0;i<5;i++) printf(\"arr[%d]=%d *(q+%d)=%d\\n\", i, arr[i], i, *(q+i));\n\n    // 4) 指標算術\n    printf(\"q points to %d, q+2 points to %d\\n\", *q, *(q+2));\n\n    // 5) 指向指標 (二維)\n    int** pp = &p;\n    printf(\"**pp=%d\\n\", **pp);\n    return 0;\n}`

c:`#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint main(){\n    int n;\n    scanf(\"%d\", &n);\n\n    // 1) malloc 動態配置陣列\n    int* arr = (int*)malloc(n * sizeof(int));\n    if(!arr){ fprintf(stderr, \"malloc failed\\n\"); return 1; }\n    for(int i=0;i<n;i++) arr[i] = i * i;\n    printf(\"squares:\");\n    for(int i=0;i<n;i++) printf(\" %d\", arr[i]);\n    printf(\"\\n\");\n\n    // 2) realloc 擴大空間\n    arr = (int*)realloc(arr, 2*n * sizeof(int));\n    for(int i=n;i<2*n;i++) arr[i] = -i;\n    printf(\"after realloc(%d):\", 2*n);\n    for(int i=0;i<2*n;i++) printf(\" %d\", arr[i]);\n    printf(\"\\n\");\n\n    // 3) calloc 初始為 0\n    int* zeros = (int*)calloc(5, sizeof(int));\n    printf(\"calloc:\");\n    for(int i=0;i<5;i++) printf(\" %d\", zeros[i]);\n    printf(\"\\n\");\n\n    // 4) 二維動態陣列\n    int rows = 3, cols = 4;\n    int** grid = (int**)malloc(rows * sizeof(int*));\n    for(int i=0;i<rows;i++){\n        grid[i] = (int*)malloc(cols * sizeof(int));\n        for(int j=0;j<cols;j++) grid[i][j] = i*cols + j;\n    }\n    for(int i=0;i<rows;i++){\n        for(int j=0;j<cols;j++) printf(\"%3d \", grid[i][j]);\n        printf(\"\\n\");\n    }\n\n    // 5) 釋放 (避免 leak)\n    for(int i=0;i<rows;i++) free(grid[i]);\n    free(grid); free(arr); free(zeros);\n    return 0;\n}`,

c:`#include <stdio.h>\n#include <stdlib.h>\n\nint cmpAsc(const void* a, const void* b){ return *(int*)a - *(int*)b; }\nint cmpDesc(const void* a, const void* b){ return *(int*)b - *(int*)a; }\n\nint apply(int x, int (*op)(int)){ return op(x); }\nint sq(int x){ return x * x; }\nint cube(int x){ return x * x * x; }\n\nint main(){\n    // 1) qsort + 函式指標比較器\n    int arr[] = {3, 1, 4, 1, 5, 9, 2, 6, 5};\n    int n = sizeof(arr)/sizeof(arr[0]);\n    qsort(arr, n, sizeof(int), cmpAsc);\n    printf(\"asc:\"); for(int i=0;i<n;i++) printf(\" %d\", arr[i]); printf(\"\\n\");\n    qsort(arr, n, sizeof(int), cmpDesc);\n    printf(\"desc:\"); for(int i=0;i<n;i++) printf(\" %d\", arr[i]); printf(\"\\n\");\n\n    // 2) 把函式當參數傳\n    printf(\"sq(5)=%d\\n\", apply(5, sq));\n    printf(\"cube(3)=%d\\n\", apply(3, cube));\n\n    // 3) 函式指標陣列 (dispatch table)\n    int (*ops[])(int) = {sq, cube};\n    const char* names[] = {\"sq\", \"cube\"};\n    for(int i=0;i<2;i++) printf(\"%s(4)=%d\\n\", names[i], ops[i](4));\n\n    // 4) 計算機範例\n    int add(int a, int b){ return a+b; }   // C 不支援巢狀，改成全域 (略)\n    return 0;\n}\n// 註：C 不支援巢狀函式 (GCC 擴充除外)，所以 add 不能寫在 main 裡`

c:`#include <stdio.h>\n\n// 1) 物件式巨集\n#define PI 3.14159\n#define MAX_N 1000\n\n// 2) 函式式巨集 (記得加括號避免運算順序錯誤)\n#define SQ(x) ((x) * (x))\n#define MAX(a, b) ((a) > (b) ? (a) : (b))\n\n// 3) 條件編譯\n#define DEBUG 1\n#if DEBUG\n  #define DBG(fmt, ...) fprintf(stderr, \"[DBG] \" fmt \"\\n\", ##__VA_ARGS__)\n#else\n  #define DBG(...) ((void)0)\n#endif\n\n// 4) 字串化 # 與 token 串接 ##\n#define PRINT_VAR(v) printf(#v \" = %d\\n\", v)\n#define MAKE_FN(name) int fn_##name(int x){ return x + 1; }\nMAKE_FN(one)\nMAKE_FN(two)\n\nint main(){\n    double area = PI * SQ(5);\n    printf(\"area=%.4f\\n\", area);\n    printf(\"MAX(3, 7) = %d\\n\", MAX(3, 7));\n\n    int n = 42;\n    PRINT_VAR(n);                    // -> printf(\"n = %d\\n\", n)\n    DBG(\"value of n: %d\", n);\n\n    printf(\"fn_one(5)=%d fn_two(10)=%d\\n\", fn_one(5), fn_two(10));\n\n    // ⚠️ 陷阱：SQ(1+2) = (1+2)*(1+2) = 9，沒加括號就會變 1+2*1+2 = 5\n    printf(\"SQ(1+2)=%d (correct=9)\\n\", SQ(1+2));\n    return 0;\n}`

c:`#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n\nint main(int argc, char* argv[]){\n    // 1) 命令列參數 argc / argv\n    printf(\"argc=%d\\n\", argc);\n    for(int i=0;i<argc;i++) printf(\"  argv[%d]=%s\\n\", i, argv[i]);\n\n    // 2) 環境變數\n    char* home = getenv(\"HOME\");\n    char* user = getenv(\"USER\");\n    printf(\"HOME=%s USER=%s\\n\", home ? home : \"(null)\", user ? user : \"(null)\");\n\n    // 3) 檔案 I/O (FILE*)\n    FILE* f = fopen(\"/tmp/c_test.txt\", \"w\");\n    if(f){\n        fprintf(f, \"hello from C\\n\");\n        fprintf(f, \"line 2\\n\");\n        fclose(f);\n        printf(\"wrote /tmp/c_test.txt\\n\");\n    }\n    f = fopen(\"/tmp/c_test.txt\", \"r\");\n    if(f){\n        char line[256];\n        while(fgets(line, sizeof(line), f)) printf(\"  > %s\", line);\n        fclose(f);\n    }\n\n    // 4) time() / clock() 計時\n    time_t t = time(NULL);\n    printf(\"unix time=%ld\\n\", (long)t);\n\n    clock_t c1 = clock();\n    long s = 0;\n    for(int i=1;i<=10000000;i++) s += i;\n    clock_t c2 = clock();\n    printf(\"sum 1..1e7 = %ld in %.3f sec\\n\", s, (double)(c2-c1)/CLOCKS_PER_SEC);\n\n    // 5) exit code\n    return 0;\n}`

c:`#include <stdio.h>\n// 示範：模擬一個多檔案專案的 main\n//\n// 真實專案會有:\n//   math_utils.h   <-- 宣告\n//   math_utils.c   <-- 實作\n//   main.c         <-- 用它們\n//\n// Makefile 範例:\n//   CC = gcc\n//   CFLAGS = -Wall -O2 -std=c11\n//   OBJS = main.o math_utils.o\n//\n//   all: program\n//   program: $(OBJS)\n//   \\t$(CC) $(CFLAGS) -o $@ $(OBJS)\n//   %.o: %.c\n//   \\t$(CC) $(CFLAGS) -c $<\n//   clean:\n//   \\trm -f *.o program\n//\n// 編譯指令:\n//   gcc -Wall -O2 -c math_utils.c -o math_utils.o\n//   gcc -Wall -O2 -c main.c -o main.o\n//   gcc -o program main.o math_utils.o\n//\n// 或一次 build:\n//   gcc -Wall -O2 main.c math_utils.c -o program\n\n// 在這個單檔示範裡，把宣告 + 實作都寫在一起：\nint gcd(int a, int b);\nint lcm(int a, int b);\n\nint gcd(int a, int b){ return b ? gcd(b, a%b) : a; }\nint lcm(int a, int b){ return a / gcd(a, b) * b; }\n\nint main(){\n    int a = 12, b = 18;\n    printf(\"gcd(%d,%d)=%d\\n\", a, b, gcd(a, b));\n    printf(\"lcm(%d,%d)=%d\\n\", a, b, lcm(a, b));\n    printf(\"\\n見註解理解 Makefile 寫法。\\n\");\n    return 0;\n}`

java:`import java.util.*;\npublic class Main {\n    public static void main(String[] args){\n        // 1) ArrayList 動態陣列\n        List<Integer> list = new ArrayList<>(Arrays.asList(3, 1, 4, 1, 5, 9, 2, 6));\n        Collections.sort(list);\n        System.out.println(\"sorted: \" + list);\n\n        // 2) HashMap 字母計數\n        Map<Character, Integer> cnt = new HashMap<>();\n        String s = \"mississippi\";\n        for(char c : s.toCharArray()) cnt.merge(c, 1, Integer::sum);\n        System.out.println(\"counts: \" + new TreeMap<>(cnt));\n\n        // 3) HashSet 去重\n        Set<Integer> uniq = new HashSet<>(list);\n        System.out.println(\"unique: \" + uniq.size());\n\n        // 4) PriorityQueue 最小堆\n        PriorityQueue<Integer> pq = new PriorityQueue<>(list);\n        System.out.print(\"top3 smallest:\");\n        for(int i=0;i<3 && !pq.isEmpty();i++) System.out.print(\" \" + pq.poll());\n        System.out.println();\n\n        // 5) Deque (ArrayDeque 同時當 stack/queue)\n        Deque<Integer> dq = new ArrayDeque<>();\n        dq.push(1); dq.push(2); dq.push(3);\n        System.out.println(\"stack pop: \" + dq.pop());\n        dq.offer(99);\n        System.out.println(\"queue poll: \" + dq.poll());\n\n        // 6) TreeMap 自動排序 key\n        TreeMap<String,Integer> tm = new TreeMap<>();\n        tm.put(\"banana\", 5); tm.put(\"apple\", 10); tm.put(\"cherry\", 3);\n        System.out.println(\"first: \" + tm.firstKey() + \" last: \" + tm.lastKey());\n    }\n}`

java:`import java.util.*;\npublic class Main {\n    // 1) 泛型類別\n    static class Pair<A, B> {\n        A first; B second;\n        Pair(A a, B b){ first = a; second = b; }\n        public String toString(){ return \"(\" + first + \", \" + second + \")\"; }\n    }\n\n    // 2) 泛型方法 + bounded type\n    static <T extends Comparable<T>> T maxOf(List<T> list){\n        T best = list.get(0);\n        for(T x : list) if(x.compareTo(best) > 0) best = x;\n        return best;\n    }\n\n    // 3) 通配符 (wildcard) - 唯讀讀取\n    static double sumOfNumbers(List<? extends Number> list){\n        double s = 0;\n        for(Number n : list) s += n.doubleValue();\n        return s;\n    }\n\n    public static void main(String[] args){\n        Pair<String, Integer> p = new Pair<>(\"age\", 17);\n        System.out.println(p);\n\n        System.out.println(\"max int: \" + maxOf(Arrays.asList(3, 1, 4, 1, 5, 9, 2)));\n        System.out.println(\"max str: \" + maxOf(Arrays.asList(\"apple\", \"banana\", \"cherry\")));\n\n        List<Integer> ints = Arrays.asList(1, 2, 3, 4, 5);\n        List<Double> dbls = Arrays.asList(1.1, 2.2, 3.3);\n        System.out.println(\"sum ints: \" + sumOfNumbers(ints));\n        System.out.println(\"sum dbls: \" + sumOfNumbers(dbls));\n\n        // 4) Type erasure 提醒 (執行期看不見泛型參數)\n        System.out.println(\"same class? \" + (ints.getClass() == dbls.getClass()));\n    }\n}`

java:`import java.util.*;\nimport java.util.stream.*;\npublic class Main {\n    public static void main(String[] args){\n        List<Integer> nums = Arrays.asList(3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5);\n\n        // 1) filter + map + collect\n        List<Integer> evens = nums.stream()\n            .filter(x -> x % 2 == 0)\n            .map(x -> x * x)\n            .collect(Collectors.toList());\n        System.out.println(\"even squared: \" + evens);\n\n        // 2) reduce 求和\n        int sum = nums.stream().mapToInt(Integer::intValue).sum();\n        int prod = nums.stream().reduce(1, (a,b) -> a*b);\n        System.out.println(\"sum=\" + sum + \" prod=\" + prod);\n\n        // 3) Collectors.groupingBy 分組\n        Map<Integer, Long> byParity = nums.stream()\n            .collect(Collectors.groupingBy(x -> x % 2, Collectors.counting()));\n        System.out.println(\"by parity: \" + byParity);\n\n        // 4) sorted + distinct + limit\n        List<Integer> top3 = nums.stream().distinct().sorted(Comparator.reverseOrder())\n            .limit(3).collect(Collectors.toList());\n        System.out.println(\"top3 distinct: \" + top3);\n\n        // 5) IntStream.range\n        int fact = IntStream.rangeClosed(1, 5).reduce(1, (a, b) -> a * b);\n        System.out.println(\"5! = \" + fact);\n\n        // 6) joining 字串拼接\n        String csv = nums.stream().map(String::valueOf).collect(Collectors.joining(\",\"));\n        System.out.println(\"csv: \" + csv);\n    }\n}`

java:`import java.util.*;\npublic class Main {\n    static Optional<Integer> firstEven(List<Integer> xs){\n        for(int x : xs) if(x % 2 == 0) return Optional.of(x);\n        return Optional.empty();\n    }\n\n    public static void main(String[] args){\n        // 1) 取代 null 的設計\n        Optional<String> name = Optional.of(\"Alice\");\n        Optional<String> empty = Optional.empty();\n        System.out.println(name.isPresent() + \" \" + empty.isPresent());\n\n        // 2) ifPresent\n        name.ifPresent(n -> System.out.println(\"hello \" + n));\n        empty.ifPresent(n -> System.out.println(\"never printed\"));\n\n        // 3) orElse / orElseGet\n        String n1 = empty.orElse(\"default\");\n        String n2 = empty.orElseGet(() -> \"computed default\");\n        System.out.println(n1 + \" / \" + n2);\n\n        // 4) map / flatMap\n        Optional<Integer> len = name.map(String::length);\n        System.out.println(\"len=\" + len.orElse(-1));\n\n        // 5) 套到實際邏輯\n        List<Integer> xs = Arrays.asList(1, 3, 5, 8, 9);\n        firstEven(xs).ifPresentOrElse(\n            v -> System.out.println(\"first even = \" + v),\n            () -> System.out.println(\"no even\")\n        );\n\n        // 6) try-with-resources (autoclose)\n        try(Scanner sc = new Scanner(System.in)){\n            if(sc.hasNextLine()) System.out.println(\"echo: \" + sc.nextLine());\n        }\n\n        // 7) try / catch / finally\n        try {\n            int x = Integer.parseInt(\"not a number\");\n            System.out.println(x);\n        } catch(NumberFormatException e){\n            System.out.println(\"caught: \" + e.getMessage());\n        } finally {\n            System.out.println(\"cleanup\");\n        }\n    }\n}`,

java:`public class Main {\n    static int counter = 0;\n    static final Object lock = new Object();\n\n    static void runUnsafe() throws InterruptedException {\n        counter = 0;\n        Thread[] ts = new Thread[4];\n        for(int i=0;i<4;i++) ts[i] = new Thread(() -> {\n            for(int j=0;j<100000;j++) counter++;     // race condition\n        });\n        for(Thread t : ts) t.start();\n        for(Thread t : ts) t.join();\n        System.out.println(\"unsafe: \" + counter + \" (expected 400000)\");\n    }\n\n    static void runSynchronized() throws InterruptedException {\n        counter = 0;\n        Thread[] ts = new Thread[4];\n        for(int i=0;i<4;i++) ts[i] = new Thread(() -> {\n            for(int j=0;j<100000;j++){\n                synchronized(lock){ counter++; }\n            }\n        });\n        for(Thread t : ts) t.start();\n        for(Thread t : ts) t.join();\n        System.out.println(\"sync:   \" + counter);\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1) 直接用 Thread\n        Thread t = new Thread(() -> System.out.println(\"hi from \" + Thread.currentThread().getName()));\n        t.start(); t.join();\n\n        // 2) Lambda Runnable\n        Runnable r = () -> {\n            for(int i=0;i<3;i++) System.out.println(\"  tick \" + i);\n        };\n        new Thread(r).start();\n        Thread.sleep(50);\n\n        // 3) 不安全的競爭\n        runUnsafe();\n\n        // 4) synchronized 解決\n        runSynchronized();\n    }\n}`

java:`import java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.concurrent.*;\npublic class Main {\n    static AtomicInteger atomicCnt = new AtomicInteger(0);\n    static int reentrantCnt = 0;\n    static final ReentrantLock lock = new ReentrantLock();\n\n    static void incAtomic(){\n        for(int i=0;i<100000;i++) atomicCnt.incrementAndGet();\n    }\n    static void incReentrant(){\n        for(int i=0;i<100000;i++){\n            lock.lock();\n            try { reentrantCnt++; } finally { lock.unlock(); }\n        }\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1) AtomicInteger 無鎖原子操作\n        Thread[] ts = new Thread[4];\n        for(int i=0;i<4;i++) ts[i] = new Thread(Main::incAtomic);\n        for(Thread t : ts) t.start();\n        for(Thread t : ts) t.join();\n        System.out.println(\"atomic: \" + atomicCnt.get());\n\n        // 2) ReentrantLock (可重入，比 synchronized 彈性)\n        ts = new Thread[4];\n        for(int i=0;i<4;i++) ts[i] = new Thread(Main::incReentrant);\n        for(Thread t : ts) t.start();\n        for(Thread t : ts) t.join();\n        System.out.println(\"reentrant: \" + reentrantCnt);\n\n        // 3) ExecutorService 執行緒池\n        ExecutorService pool = Executors.newFixedThreadPool(4);\n        Future<Long> fut = pool.submit(() -> {\n            long s = 0;\n            for(int i=1;i<=1000000;i++) s += i;\n            return s;\n        });\n        System.out.println(\"sum 1..1e6 = \" + fut.get());\n        pool.shutdown();\n\n        // 4) CompletableFuture\n        CompletableFuture<String> cf = CompletableFuture\n            .supplyAsync(() -> \"hello\")\n            .thenApply(s -> s + \" world\");\n        System.out.println(cf.get());\n    }\n}`

function chapSection(id){
  if(id <= 26) return {key:'apcs', label:'📘 APCS 考試準備', desc:'語法 → 演算法 → 競賽題型'};
  if(id <= 31) return {key:'practical', label:'🛠 實用程式', desc:'檔案、模組、OOP、測試 — 寫工具的基本功'};
  if(id <= 35) return {key:'project', label:'🚀 製作專案', desc:'CLI / CSV / API / 遊戲，整合練習'};
  if(id <= 43) return {key:'topic-crawl', label:'🕷 專項教學 · 爬蟲', desc:'HTTP、requests、BeautifulSoup、實戰爬取'};
  if(id <= 51) return {key:'topic-data',  label:'📊 專項教學 · 資料分析', desc:'pandas、清理、groupby、視覺化'};
  if(id <= 59) return {key:'topic-bot',   label:'🤖 專項教學 · Bot', desc:'Discord / LINE、事件、指令、部署'};
  if(id <= 67) return {key:'topic-game', label:'🎮 專項教學 · pygame', desc:'game loop、輸入、碰撞、完整小遊戲'};
  if(id === 68) return {key:'apcs-new', label:'📗 APCS 新制與識讀', desc:'四級題本、題目分級、程式追蹤'};
  if(id <= 70) return {key:'advanced-practice', label:'🔥 高級題訓練', desc:'快速冪、模運算、分治與逆序對'};
  if(id <= 78) return {key:'topic-cpp',  label:'⚡ 專項教學 · C++', desc:'STL / RAII / move / lambda / 演算法庫 / Concurrency'};
  if(id <= 86) return {key:'topic-c',    label:'🔧 專項教學 · C',   desc:'指標 / malloc / struct / 函式指標 / 字串 / 巨集 / 系統呼叫'};
  return         {key:'topic-java', label:'☕ 專項教學 · Java', desc:'Collections / Generics / Stream / Optional / Threads / JVM'};
}
function renderChapList() {
  const list = document.getElementById('chap-list');
  list.innerHTML = '';
  rebuildDisplayNumMap();
  let lastSection = null;
  const ordered = getOrderedVisibleChapters(currentLang);
  ordered.forEach(c => {
    const sec = chapSection(c.id);
    if(sec.key !== lastSection){
      const header = document.createElement('div');
      header.className = 'sec-header';
      header.innerHTML = `<div class="sec-label">${sec.label}</div><div class="sec-desc">${sec.desc}</div>`;
      list.appendChild(header);
      lastSection = sec.key;
    }
    const div = document.createElement('div');
    const done = completed.has(c.id);
    div.className = 'chap' + (done ? ' done' : '');
    div.onclick = () => selectChap(c.id);
    div.id = 'chap-' + c.id;
    const _en = hasEN(c) ? chEN(c) : null;
    const _t = _en ? _en.title : c.title;
    const _g = _en ? _en.tag   : c.tag;
    div.innerHTML = `<div class="chap-num">${T().chapPrefix(chapDisplayNum(c.id))} · ${_g}</div><div class="chap-title">${_t}</div>`;
    list.appendChild(div);
  });
}

let _prevChapId = null;
function selectChap(id, opts) {
  opts = opts || {};
  currentChap = CHAPTERS.find(c => c.id === id);
  if(!currentChap) return;
  const body = document.getElementById('lesson-body');
  const prevScroll = body.scrollTop;
  document.querySelectorAll('.chap').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('chap-' + id);
  if(el) el.classList.add('active');
  const _enCh = hasEN(currentChap) ? chEN(currentChap) : null;
  const _title = _enCh ? _enCh.title : currentChap.title;
  const _tag   = _enCh ? _enCh.tag   : currentChap.tag;
  document.getElementById('lesson-title').textContent = T().chapPrefixFull(chapDisplayNum(currentChap.id), _title);
  document.getElementById('lesson-tag').textContent = _tag;
  body.innerHTML = marked.parse(getContent(currentChap)) + renderMeta(currentChap);
  if(!opts.preserveEditor){
    cm.setValue(getExample(currentChap));
    document.getElementById('stdin-input').value = getStdin(currentChap);
    document.getElementById('output-body').textContent = T().outPlaceholder;
  }
  // 只有切換到新章節才滾回頂端；同章節重繪（例如答完題）保留位置
  if(_prevChapId === id && !opts.forceTop){
    body.scrollTop = prevScroll;
  } else {
    body.scrollTop = 0;
  }
  _prevChapId = id;
}

function clearEditor() { cm.setValue(''); }
function resetExample() {
  if (currentChap) {
    cm.setValue(getExample(currentChap));
    document.getElementById('stdin-input').value = getStdin(currentChap);
  }
}

async function executeCode(code, stdin, lang) {
  // returns {raw: full output text, stderr: boolean}
  if (lang === 'py') {
    if (!pyodide) return {raw:'Pyodide 尚未載入', stderr:true};
    pyodide.globals.set('__user_stdin', stdin);
    pyodide.globals.set('__user_code', code);
    await pyodide.runPythonAsync(`
import sys, io, traceback
__buf = io.StringIO()
__old_in, __old_out, __old_err = sys.stdin, sys.stdout, sys.stderr
sys.stdin = io.StringIO(__user_stdin)
sys.stdout = __buf
sys.stderr = __buf
try:
    exec(__user_code, {'__name__': '__main__'})
except SystemExit:
    pass
except BaseException:
    traceback.print_exc(file=__buf)
finally:
    sys.stdin, sys.stdout, sys.stderr = __old_in, __old_out, __old_err
__result = __buf.getvalue()
`);
    const result = pyodide.globals.get('__result') || '';
    return {raw: result, stderr: /Traceback|Error/.test(result)};
  }
  // C / C++ / Java 走 Judge0 CE（Piston 公開 API 自 2026/02/15 起改白名單）
  const JUDGE0_LANG = { cpp: 54, c: 50, java: 62 };
  const filename = lang === 'java' ? 'Main.java' : (lang === 'cpp' ? 'main.cpp' : 'main.c');
  try {
    const res = await fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        language_id: JUDGE0_LANG[lang],
        source_code: code,
        stdin: stdin || ''
      })
    });
    const data = await res.json();
    const stdout = data.stdout || '';
    const stderr = data.stderr || data.compile_output || '';
    return {raw: stdout + (stderr ? '\n[stderr]\n' + stderr : ''), stderr: !!stderr};
  } catch (e) {
    return {raw: '網路錯誤（C/C++/Java 透過 Judge0 CE 編譯執行，需要網路）：\n' + String(e.message || e), stderr: true};
  }
}

async function runCode() {
  const code = cm.getValue();
  const stdin = document.getElementById('stdin-input').value;
  const out = document.getElementById('output-body');
  out.textContent = '執行中...';
  try {
    const {raw} = await executeCode(code, stdin, currentLang);
    const result = raw || '(無輸出)';
    const hint = currentLang === 'py' ? translateError(result) : '';
    if(hint){
      out.innerHTML = '';
      const pre = document.createElement('div');
      pre.textContent = result;
      out.appendChild(pre);
      const hintDiv = document.createElement('div');
      hintDiv.innerHTML = hint;
      out.appendChild(hintDiv);
    } else {
      out.textContent = result;
    }
  } catch (e) {
    out.textContent = '錯誤：\n' + (e.message || e);
  }
}

// ── 程式練習：執行使用者程式碼，比對 stdout 是否符合預期 ───────────────
function normalizeOutput(s){
  return (s || '').replace(/\r\n/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n+$/,'').trim();
}
async function checkAnswer(chapId){
  const meta = CHAPTER_META[chapId];
  if(!meta || !meta.code) return;
  const btn = document.getElementById('check-btn-'+chapId);
  if(btn){ btn.disabled = true; btn.textContent = '執行中...'; }
  const code = cm.getValue();
  let result;
  try {
    result = await executeCode(code, meta.code.stdin || '', currentLang);
  } catch(e){
    result = {raw: String(e.message||e), stderr: true};
  }
  const got = normalizeOutput(result.raw);
  const want = normalizeOutput(meta.code.expect);
  const passed = !result.stderr && got === want;
  codeQuizState[chapId] = {status: passed ? 'pass' : 'fail', got: result.raw || '(無輸出)'};
  if(passed && !completed.has(chapId)) markDone(chapId);
  if(currentChap && currentChap.id === chapId) selectChap(chapId, {preserveEditor:true});
}
