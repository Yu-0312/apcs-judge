.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}

.chip.on[data-type="ai"]{background:var(--purple);border-color:var(--purple);}
.btn{background:var(--accent);color:#08131f;border:none;border-radius:8px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-weight:600;}
.btn.ghost:hover{color:var(--text);border-color:var(--text-muted);}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted);}

.rec-head:hover{background:var(--surface-tint);}
.type-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.type-badge.reading{background:rgba(88,166,255,.14);color:var(--blue);}
.type-badge.impl{background:rgba(63,185,80,.14);color:var(--green);}
.type-badge.ai{background:rgba(188,140,255,.14);color:var(--purple);}
.rec-title{font-weight:600;font-size:14px;flex-shrink:0;}
.rec-title-in{background:var(--bg);border:1px solid var(--accent);color:var(--text);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px;font-weight:600;}

.rec-count{font-size:10px;font-weight:700;color:var(--yellow);background:rgba(210,153,34,.14);border-radius:999px;padding:2px 7px;}

.rec-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.rec.open .rec-body{display:block;}
.sec-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 7px;}
pre.code{background:var(--code-bg);border:1px solid var(--border);border-radius:9px;padding:12px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre;}

.opt.correct{border-color:var(--green);background:rgba(63,185,80,.1);color:var(--green);}

.md pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;}
.md pre code{border:none;padding:0;background:none;}
.md ul,.md ol{margin:6px 0 6px 20px;}
.stmt{font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:var(--text);}
.rec-img{max-width:100%;max-height:280px;border-radius:9px;border:1px solid var(--border);margin-top:6px;}
.kv{font-size:12.5px;color:var(--text-muted);}
.kv b{color:var(--text);}
.toolbar-status{width:100%;font-size:12px;color:var(--text-muted);min-height:1.5em}

<script>
const $ = id => document.getElementById(id);
function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const SAFE_MD_TAGS = new Set(['P','BR','STRONG','B','EM','I','UL','OL','LI','CODE','PRE','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','HR','TABLE','THEAD','TBODY','TR','TH','TD','A']);
function safeHttpUrl(raw){
  try{const u=new URL(String(raw||''),location.href);return(u.protocol==='http:'||u.protocol==='https:')?u.href:null;}
  catch(e){return null;}
}
function safeImageDataUrl(raw){
  const value=String(raw||'');
  return /^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=\s]+$/i.test(value)?value:null;
}
// Persisted AI Markdown is untrusted.  Mirror the AI page's local allow-list
// sanitizer so the mistake book remains safe even when a CDN is unavailable.
function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  const root=doc.body.firstElementChild;
  [...root.querySelectorAll('*')].forEach(el=>{
    if(!SAFE_MD_TAGS.has(el.tagName)){el.replaceWith(doc.createTextNode(el.textContent||''));return;}
    const href=el.tagName==='A'?safeHttpUrl(el.getAttribute('href')):null;
    [...el.attributes].forEach(a=>el.removeAttribute(a.name));
    if(el.tagName==='A'&&href){el.setAttribute('href',href);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
    else if(el.tagName==='A'){el.replaceWith(doc.createTextNode(el.textContent||''));}
  });
  return root.innerHTML;
}
function renderMd(s){
  try{
    const escaped = escH(String(s||'')).replace(/~/g,'&#126;');
    return sanitizeHtml(marked.parse(escaped));
  }catch(e){ return escH(s); }
}
const TYPE_LABEL = { reading:'🔍 判讀題', impl:'🎯 實作題', ai:'🤖 AI 上傳' };
const LANG_LABEL = { py:'Python', python:'Python', cpp:'C++', c:'C', java:'Java', js:'JavaScript' };

let curType = 'all';
let curSearch = '';

function fmtTime(iso){
  try{ const d = new Date(iso); const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  catch(e){ return iso; }
}

function summaryText(r){
  if (r.type === 'reading') return (r.questionStem || r.questionText || '').replace(/\s+/g,' ').slice(0,80);
  if (r.type === 'impl') return (r.problemTitle||'') + '　' + (r.lang?('['+(LANG_LABEL[r.lang]||r.lang)+'] '):'') + (r.passed!=null? ('通過 '+r.passed+'/'+r.total):'');
  if (r.type === 'ai') return (r.problemStatement || r.problemTitle || '').replace(/\s+/g,' ').slice(0,80);
  return '';
}

function isDue(r){ return !!(r && r.nextReviewAt && Date.parse(r.nextReviewAt) <= Date.now()); }
function refreshCounts(){
  const all = MistakeBook.all();
  $('c-all').textContent = all.length;
  $('c-reading').textContent = all.filter(r=>r.type==='reading').length;
  $('c-impl').textContent = all.filter(r=>r.type==='impl').length;
  $('c-ai').textContent = all.filter(r=>r.type==='ai').length;
  if($('c-due')) $('c-due').textContent = all.filter(isDue).length;
}

function render(){
  refreshCounts();
  let recs = MistakeBook.all();
  if (curType === 'due') recs = recs.filter(isDue);
  else if (curType !== 'all') recs = recs.filter(r => r.type === curType);
  if (curSearch){
    const q = curSearch.toLowerCase();
    // 只搜文字欄位；先前用 JSON.stringify 連 base64 圖片都掃，會出現亂猜的誤中
    recs = recs.filter(r =>
      [r.title, r.problemTitle, r.problemStatement, r.questionStem, r.topic, r.desc,
       r.code, r.explain, r.explanation, r.approach, (r.options||[]).join(' ')]
      .filter(Boolean).join(' ').toLowerCase().includes(q));
  }
  const list = $('list');
  if (!recs.length){
    list.innerHTML = '<div class="empty"><div class="big">📭</div>'
      + '<div class="t">' + (MistakeBook.count() ? '沒有符合條件的錯題' : '錯題本還是空的') + '</div>'
      + '<div class="s">在 <a href="reading.html" style="color:var(--blue)">程式判讀</a> 答錯、'
      + '<a href="index.html" style="color:var(--green)">實作題</a> 未全過、'
      + '或用 <a href="ai-solve.html" style="color:var(--purple)">AI 解題</a> 上傳題目後，<br>都會自動收錄到這裡。</div></div>';
    return;
  }
  list.innerHTML = recs.map(recCard).join('');
}

function recCard(r){
  const typeKey=['reading','impl','ai'].includes(r.type)?r.type:'unknown';
  const badge = '<span class="type-badge '+typeKey+'">'+escH(TYPE_LABEL[r.type]||r.type||'其他')+'</span>';
  const count=Number(r.count)||0;
  const cnt = count>1 ? '<span class="rec-count">×'+count+'</span>' : '';
  const domId='rec-body-'+String(r.id||'').replace(/[^a-zA-Z0-9_-]/g,'');
  return '<div class="rec" data-id="'+escH(r.id)+'">'
    + '<div class="rec-head" data-act="toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="'+domId+'">'
    +   '<span class="chev">▶</span>'
    +   badge
    +   '<span class="rec-title">'+escH(r.title)+'</span>'
    +   cnt
    +   '<span class="rec-sum">'+escH(summaryText(r))+'</span>'
    +   '<span class="rec-meta">'+fmtTime(r.updated||r.created)+'</span>'
    +   '<button class="icon-btn" data-act="rename" title="改標題" aria-label="改標題">✏️</button>'
    +   '<button class="icon-btn" data-act="del" title="刪除" aria-label="刪除這筆錯題">🗑</button>'
    + '</div>'
    + '<div class="rec-body" id="'+domId+'">'+recBody(r)+'</div>'
    + '</div>';
}

function recBody(r){
  if (r.type === 'reading') return readingBody(r);
  if (r.type === 'impl') return implBody(r);
  if (r.type === 'ai') return aiBody(r);
  return '<pre class="code">'+escH(JSON.stringify(r,null,2))+'</pre>';
}

function readingBody(r){
  let h = '';
  h += '<div class="kv" style="margin-top:12px;"><b>'+escH(LANG_LABEL[r.lang]||'觀念')+'</b>'
     + (r.level?'　難度：<b>'+escH(r.level)+'</b>':'') + '</div>';
  if(r.masteryState){
    const label={learning:'學習中',review:'複習中',mastered:'已熟練'}[r.masteryState]||r.masteryState;
    h += '<div class="kv">狀態：<b>'+escH(label)+'</b>'
      +(r.masteryState==='review'?'　連續答對：<b>'+Number(r.correctStreak||0)+' / 2</b>':'')
      +(r.nextReviewAt?'　建議複習：<b>'+escH(fmtTime(r.nextReviewAt).slice(0,10))+'</b>':'')+'</div>';
  }
  h += '<div class="sec-label">題目</div>';
  if (r.code) h += '<pre class="code">'+escH(r.code)+'</pre>';
  if (r.questionStem) h += '<div class="stmt">'+escH(r.questionStem)+'</div>';
  h += '<div class="sec-label">選項</div>';
  (r.options||[]).forEach((op,i)=>{
    let cls='opt';
    if (i===r.answerIndex) cls+=' correct';
    else if (i===r.chosenIndex) cls+=' wrong';
    const tag = i===r.answerIndex ? '（正解）' : (i===r.chosenIndex ? '（你的選擇）' : '');
    h += '<div class="'+cls+'">('+('ABCD'[i]||i)+') '+escH(op)+' '+tag+'</div>';
  });
  if (r.explain){ h += '<div class="sec-label">解析</div><div class="stmt">'+escH(r.explain)+'</div>'; }
  return h;
}

function implBody(r){
  let h = '';
  const passed=Number.isFinite(Number(r.passed))?Number(r.passed):null;
  const total=Number.isFinite(Number(r.total))?Number(r.total):null;
  h += '<div class="kv" style="margin-top:12px;">題目：<b>'+escH(r.problemTitle||'')+'</b>'
     + (r.lang?'　語言：<b>'+escH(LANG_LABEL[r.lang]||r.lang)+'</b>':'')
     + (passed!=null&&total!=null?'　最佳：<b>'+passed+' / '+total+'</b> 筆公開範例':'') + '</div>';
  if (r.topic) h += '<div class="kv">主題：'+escH(r.topic)+'</div>';
  if (r.desc){ h += '<div class="sec-label">題目敘述</div><div class="md">'+renderMd(r.desc)+'</div>'; }
  if (r.code){ h += '<div class="sec-label">你最後提交的程式</div><pre class="code">'+escH(r.code)+'</pre>'; }
  h += '<div class="kv" style="margin-top:12px;"><a href="index.html" style="color:var(--green)">→ 回實作題再練一次</a></div>';
  return h;
}

function aiBody(r){
  let h = '';
  const checkLabel=r.stressChecked?'對拍通過（非 AC）':(r.sampleChecked?'公開範例相符（非 AC）':(r.verified?'已驗證':'未驗證'));
  const checkColor=(r.stressChecked||r.sampleChecked||r.verified)?'var(--green)':'var(--yellow)';
  h += '<div class="kv" style="margin-top:12px;">語言：<b>'+escH(LANG_LABEL[r.language]||r.language||'-')+'</b>'
     + '　檢查：<b style="color:'+checkColor+'">'+checkLabel+'</b></div>';
  if(r.masteryState||r.nextReviewAt){
    const label={learning:'學習中',review:'複習中',mastered:'已熟練'}[r.masteryState]||r.masteryState||'';
    h += '<div class="kv">'+(label?'狀態：<b>'+escH(label)+'</b>':'')+(r.nextReviewAt?'　建議複習：<b>'+escH(fmtTime(r.nextReviewAt).slice(0,10))+'</b>':'')+'</div>';
  }
  if(Array.isArray(r.relatedTopics)&&r.relatedTopics.length){
    h += '<div class="kv">延伸複習：'+r.relatedTopics.map(t=>'<code>'+escH(String(t))+'</code>').join('、')+'</div>';
  }
  const imageUrl=safeImageDataUrl(r.image);
  if (imageUrl) h += '<div class="sec-label">題目照片</div><img class="rec-img" src="'+escH(imageUrl)+'" alt="題目">';
  if (r.problemStatement){ h += '<div class="sec-label">題目辨識</div><div class="md">'+renderMd(r.problemStatement)+'</div>'; }
  if (r.approach){ h += '<div class="sec-label">解題思路</div><div class="md">'+renderMd(r.approach)+'</div>'; }
  if (r.code){ h += '<div class="sec-label">解答程式碼</div><pre class="code">'+escH(r.code)+'</pre>'; }
  if (r.explanation){ h += '<div class="sec-label">完整詳解</div><div class="md">'+renderMd(r.explanation)+'</div>'; }
  return h;
}

// ── 事件 ──
$('list').addEventListener('click', e => {
  const rec = e.target.closest('.rec'); if (!rec) return;
  const id = rec.dataset.id;
  const act = e.target.closest('[data-act]') && e.target.closest('[data-act]').dataset.act;
  if (act === 'del'){
    e.stopPropagation();
    if (confirm('確定刪除這筆錯題紀錄？')){ MistakeBook.remove(id); render(); }
    return;
  }
  if (act === 'rename'){
    e.stopPropagation();
    const titleEl = rec.querySelector('.rec-title');
    if (rec.querySelector('.rec-title-in')) return;
    const cur = MistakeBook.get(id);
    const inp = document.createElement('input');
    inp.className = 'rec-title-in'; inp.value = cur ? cur.title : '';
    titleEl.replaceWith(inp); inp.focus(); inp.select();
    const commit = () => { const v = inp.value.trim() || (cur?cur.title:''); MistakeBook.update(id, { title: v }); render(); };
    inp.addEventListener('keydown', ev => { if (ev.key==='Enter'){ commit(); } else if (ev.key==='Escape'){ render(); } });
    inp.addEventListener('blur', commit);
    inp.addEventListener('click', ev => ev.stopPropagation());
    return;
  }
  // toggle 展開
  rec.classList.toggle('open');
  const head=rec.querySelector('.rec-head');if(head)head.setAttribute('aria-expanded',rec.classList.contains('open')?'true':'false');
});
$('list').addEventListener('keydown',e=>{
  if((e.key!=='Enter'&&e.key!==' ')||e.target.closest('button,input'))return;
  const head=e.target.closest('.rec-head');if(!head)return;
  e.preventDefault();head.click();
});

function selectChip(chip){
  if (!chip) return;
  curType = chip.dataset.type;
  $('filter').querySelectorAll('.chip').forEach(c => {
    const on = c === chip;
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  render();
}
$('filter').addEventListener('click', e => selectChip(e.target.closest('.chip')));
// 鍵盤操作：Enter / Space 等同點擊（chip 為 role="button"）
$('filter').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const chip = e.target.closest('.chip'); if (!chip) return;
  e.preventDefault();
  selectChip(chip);
});
$('search').addEventListener('input', e => { curSearch = e.target.value.trim(); render(); });

$('btn-clear').onclick = () => {
  if (!MistakeBook.count()) return;
  if (confirm('確定清空整本錯題本？此動作無法復原。')){
    const cleared=MistakeBook.clearAll();render();
    $('toolbar-status').textContent=cleared?'錯題本已清空。':'儲存空間異常，錯題本未能清空。請先匯出備份。';
  }
};
$('btn-export').onclick = () => {
  const data = JSON.stringify({app:'apcs-mistake-book',version:2,exportedAt:new Date().toISOString(),records:MistakeBook.all()}, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'apcs-錯題本-' + MistakeBook.dateTitle(new Date()) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  $('toolbar-status').textContent='錯題本已匯出；檔案不包含 API 金鑰。';
};
$('btn-import').onclick=()=>$('import-file').click();
$('import-file').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  if(file.size>12*1024*1024){$('toolbar-status').textContent='匯入失敗：檔案超過 12 MB。';return;}
  try{
    const data=JSON.parse(await file.text());
    let records=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
    // Also accept the complete learning backup exported from dashboard.html.
    if(!records&&data&&data.app==='apcs-learning-backup'&&data.storage&&typeof data.storage[MistakeBook.LS]==='string')records=JSON.parse(data.storage[MistakeBook.LS]);
    if(!Array.isArray(records))throw new Error('bad format');
    const added=MistakeBook.importRecords(records);const report=MistakeBook.getLastImportReport?MistakeBook.getLastImportReport():{added,skipped:0};render();
    $('toolbar-status').textContent=`匯入完成，新增 ${added} 筆；同題紀錄已合併${report.skipped?`，略過 ${report.skipped} 筆過大或格式不符資料`:''}。`;
  }catch(err){$('toolbar-status').textContent='匯入失敗：請選擇本站匯出的錯題本或完整學習備份。';}
});

window.addEventListener('apcs:mistake-storage-warning',e=>{
  const d=e.detail||{};
  if(d.code==='IMAGES_REMOVED')$('toolbar-status').textContent=`儲存空間不足：已移除 ${d.count||0} 張較大的題目圖片，其餘錯題已保留。`;
  else if(d.code==='WRITE_FAILED')$('toolbar-status').textContent='儲存空間不足，這次變更未能保存。請先匯出備份並刪除不需要的紀錄。';
});

render();
</script>
